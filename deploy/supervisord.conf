# ============================================
# Noda Ops - Supervisord 配置
# ============================================
# 管理多个运维进程：备份 cron + Cloudflare Tunnel
# ============================================

[supervisord]
nodaemon=true
logfile=/var/log/noda-backup/supervisord.log
pidfile=/tmp/supervisor/supervisord.pid
childlogdir=/var/log/noda-backup

[program:cron]
command=/usr/sbin/crond -f -l 8 -L /var/log/noda-backup/crond.log
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/var/log/noda-backup/cron.log
stderr_logfile=/var/log/noda-backup/cron-error.log
environment=HOME="/home/nodaops",PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",TZ="Pacific/Auckland"

[program:cronhb-httpd]
# cron 心跳静态 status 文件服务（2026-10-21 cron 全量盘点接入）：shell 型
# cron 经 hb.sh 写 /var/cronhb/api/cron/status，adminapi cron-pull 环经
# SERVICE_ENDPOINTS=noda-ops-cron=http://noda-ops:3017 拉取（URL 路径直映射
# 文档根）。busybox httpd 只读静态服务，无 CGI。
command=/bin/busybox-extras httpd -f -p 3017 -h /var/cronhb
user=nodaops
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/var/log/noda-backup/cronhb-httpd.log
stderr_logfile=/var/log/noda-backup/cronhb-httpd-error.log
environment=HOME="/home/nodaops"

[program:cloudflared]
command=/usr/local/bin/cloudflared tunnel --no-autoupdate --protocol auto run --token %(ENV_CLOUDFLARE_TUNNEL_TOKEN)s
user=nodaops
autostart=true
autorestart=true
startsecs=15
startretries=10
stdout_logfile=/var/log/noda-backup/cloudflared.log
stderr_logfile=/var/log/noda-backup/cloudflared-error.log
environment=HOME="/home/nodaops"
