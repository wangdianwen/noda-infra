# ============================================
# Noda Monorepo - Docker Compose 基础配置
# ============================================
# 此文件定义所有共享的服务配置
# 环境特定配置在 docker-compose.dev.yml 和 docker-compose.prod.yml 中覆盖

name: noda-infra

services:
  # ----------------------------------------
  # PostgreSQL 数据库
  # ----------------------------------------
  postgres:
    image: postgres:17.9
    container_name: noda-infra-postgres-prod
    labels:
      - "noda.service-group=infra"
      - "noda.environment=prod"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./services/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - noda-network
    healthcheck:
      # -t 5: pg_isready 自身连接超时；interval/retries 放宽——r4s 上备份/爬虫批量写入
      # 期间 pg_isready 偶发抖动，10s×5 次会瞬间打 unhealthy 造成误报（已自愈但污染告警）
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -t 5"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ----------------------------------------
  # Nginx 反向代理
  # ----------------------------------------
  nginx:
    container_name: noda-infra-nginx
    image: nginx:1.25-alpine
    labels:
      - "noda.service-group=infra"
      - "noda.environment=prod"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "81:81"
      - "443:443"
    volumes:
      - ../config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../config/nginx/conf.d:/etc/nginx/conf.d:ro
      - ../config/nginx/snippets:/etc/nginx/snippets:ro
      - ../config/nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - noda-network
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/ || curl -sf http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ----------------------------------------
  # Noda Ops - 运维工具集（备份 + Cloudflare Tunnel）
  # 合并了旧的 opdev 和 cloudflared 容器
  # ----------------------------------------
  noda-ops:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.noda-ops
    image: noda-ops:latest
    container_name: noda-ops
    labels:
      - "noda.service-group=infra"
      - "noda.environment=prod"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      # 备份系统配置
      POSTGRES_HOST: noda-infra-postgres-prod
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_DIR: /tmp/postgres_backups
      HISTORY_DIR: /app/history
      # B2 云存储配置
      B2_ACCOUNT_ID: ${B2_ACCOUNT_ID}
      B2_APPLICATION_KEY: ${B2_APPLICATION_KEY}
      B2_BUCKET_NAME: ${B2_BUCKET_NAME:-noda-backups}
      B2_PATH: ${B2_PATH:-backups/postgres/}
      ALERT_EMAIL: ${ALERT_EMAIL:-}
      # SSL 配置（Docker 内部网络无需 SSL）
      PGSSLMODE: disable
      # Cloudflare Tunnel 配置
      CLOUDFLARE_TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
      # Doppler 密钥备份配置
      DOPPLER_TOKEN: ${DOPPLER_TOKEN}
      # 爬虫 LLM 配置
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.z.ai/api/anthropic}
      ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN}
    volumes:
      - ./volumes/backup:/tmp/postgres_backups
      - ./volumes/history:/app/history
      - ./volumes/logs:/var/log/noda-backup
      - ./volumes/crawler-logs:/app/crawler/logs
    networks:
      - noda-network
    depends_on:
      - postgres
    healthcheck:
      # -t 5: pg_isready 自身连接超时；retries 放宽——爬虫运行窗口内容器内存顶格，
      # 探测偶发超时属正常，不应立即判 unhealthy
      test: ["CMD-SHELL", "pg_isready -h noda-infra-postgres-prod -U ${POSTGRES_USER:-postgres} -t 5 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ----------------------------------------
  # Keycloak 认证服务（单容器，直接替换部署）
  # 生产环境通过 Jenkins infra-deploy Pipeline 管理（docker stop/rm/run）
  # 容器名: keycloak，此定义仅作为配置参考保留（profiles: disabled）
  # ----------------------------------------
  keycloak:
    profiles:
      - disabled
    image: quay.io/keycloak/keycloak:26.2.3
    container_name: noda-infra-keycloak
    labels:
      - "noda.service-group=infra"
      - "noda.environment=prod"
    # 数据库配置（独立数据库架构）
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      # 启用 HTTP 模式（开发/内部网络）
      KC_HTTP_ENABLED: "true"
      # Hostname 配置（v2 SPI - 使用完整 URL）
      KC_HOSTNAME: "https://auth.noda.co.nz"
      KC_HOSTNAME_STRICT: "false"
      # Proxy 配置（Cloudflare Tunnel）
      KC_PROXY: "edge"
      KC_PROXY_HEADERS: "xforwarded"
      # Frontend URL（强制使用 HTTPS）
      KC_FRONTEND_URL: "https://auth.noda.co.nz"
      # 管理员账号
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    command: start
    volumes:
      - ./services/keycloak/themes:/opt/keycloak/themes:ro  # 可选：未来自定义主题
    networks:
      noda-network:
        aliases:
          - noda-infra-keycloak
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

# ============================================
# Volumes（数据持久化）
# ============================================
volumes:
  postgres_data:
    driver: local

# ============================================
# Networks（网络隔离）
# ============================================
networks:
  noda-network:
    external: true
    name: noda-network
