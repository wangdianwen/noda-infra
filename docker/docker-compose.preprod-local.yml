# ============================================
# 本机 Mac Preprod 环境（含 liuyao + Keycloak）
# ============================================
# 轻量级 preprod：nginx + noda-apps 多进程容器 + postgres + keycloak
#
# 使用：
#   NORA_APPS_IMAGE=noda-apps:<sha> docker compose -f docker/docker-compose.preprod-local.yml up -d
#
# 访问（需 /etc/hosts 加 127.0.0.1 liuyao-preprod.noda.co.nz auth-preprod.noda.co.nz）：
#   liuyao:   https://liuyao-preprod.noda.co.nz/
#   keycloak: https://auth-preprod.noda.co.nz/
#
# 也可直接用 localhost:端口：
#   liuyao-web:  http://localhost:3005
#   liuyao-api:  http://localhost:3007/api/health
#   keycloak:    http://localhost:8080

services:
  postgres:
    image: postgres:17.9
    container_name: preprod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password_change_me
      POSTGRES_DB: noda_preprod
    ports:
      - "5433:5432"
    volumes:
      - preprod-pgdata:/var/lib/postgresql/data
      - ./init-preprod.sql:/docker-entrypoint-initdb.d/03-init-preprod.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.2.3
    container_name: preprod-keycloak
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgres_password_change_me
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY: "edge"
      KC_PROXY_HEADERS: "xforwarded"
      KC_FRONTEND_URL: "https://auth-preprod.noda.co.nz"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin_password_change_me
      GOOGLE_OAUTH_CLIENT_ID: "${GOOGLE_OAUTH_CLIENT_ID:-180691835704-oqiknqfklc5cjg3iaomu24uhk3i2gj1p.apps.googleusercontent.com}"
      GOOGLE_OAUTH_CLIENT_SECRET: "${GOOGLE_OAUTH_CLIENT_SECRET:-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}"
    command: ["start", "--import-realm"]
    volumes:
      - ./keycloak-realm.json:/opt/keycloak/data/import/noda-realm.json:ro
    healthcheck:
      # Keycloak 26 镜像（UBI micro）无 curl/wget，且默认未开 health 端点
      # 容器 /bin/sh 即 bash，用 /dev/tcp 探公开端点 /realms/noda
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /realms/noda HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && timeout 3 cat <&3 | head -1 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  noda-apps:
    image: ${NORA_APPS_IMAGE:-noda-apps:latest}
    container_name: preprod-noda-apps
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:postgres_password_change_me@postgres:5432/noda_preprod"
      DIRECT_URL: "postgresql://postgres:postgres_password_change_me@postgres:5432/noda_preprod"
      AUTH_BYPASS: "false"
      KEYCLOAK_URL: "https://auth-preprod.noda.co.nz"
      KEYCLOAK_REALM: "noda"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      ANTHROPIC_AUTH_TOKEN: "${ANTHROPIC_AUTH_TOKEN:-}"
      ANTHROPIC_BASE_URL: "${ANTHROPIC_BASE_URL:-}"
      # 注意：ANTHROPIC_MODEL 不在此透传——宿主 shell 可能残留旧值（如 sonnet），
      # 留缺走 liuyao llm.ts 代码默认（glm-5.3-flash），与 ZAI 网关匹配
      ANTHROPIC_MAX_TOKENS: "24000"
      LIYUAO_API_PORT: "3007"
      NEXT_PUBLIC_LOCAL_API_URL: "http://localhost:3001"
      # 环境隔离规则：preprod 禁用任何 prod key。专用 PREPROD_ 前缀防宿主 live 值吸入
      # （宿主/Jenkins 环境 export 的 STRIPE_SECRET_KEY 是 prod live key）。
      # test mode 值放 docker/.env（PREPROD_STRIPE_*），未配置则支付功能不可用——这是有意的
      STRIPE_SECRET_KEY: "${PREPROD_STRIPE_SECRET_KEY:-}"
      STRIPE_WEBHOOK_SECRET: "${PREPROD_STRIPE_WEBHOOK_SECRET:-}"
      STRIPE_PRICE_DEEP_READ: "${PREPROD_STRIPE_PRICE_DEEP_READ:-}"
      LIUYAO_WEB_BASE_URL: "${LIUYAO_WEB_BASE_URL:-https://liuyao-preprod.noda.co.nz}"
    volumes:
      - preprod-python-cache:/app/apps/findclass/scripts/python/cache
    deploy:
      resources:
        limits:
          memory: 2g

  nginx:
    image: nginx:1.25-alpine
    container_name: preprod-nginx
    restart: unless-stopped
    depends_on:
      - noda-apps
      - keycloak
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /Users/dianwenwang/Project/noda-infra/config/nginx/liuyao-local.conf:/etc/nginx/conf.d/default.conf:ro
      - /Users/dianwenwang/Project/noda-infra/config/nginx/ssl:/etc/nginx/ssl:ro

volumes:
  preprod-pgdata:
  preprod-python-cache:
