# ============================================
# 本机 Mac Preprod 环境（Keycloak 已下线移除；liuyao-preprod 已 410，见 liuyao-local.conf）
# ============================================
# 轻量级 preprod：postgres + 应用三容器（keycloak 已随 Keycloak 下线移除，2026-09-12）
# 三容器拆分（2026-09）：原 noda-apps 单容器拆为
#   preprod-noda-api（Go API 六 listener）/ preprod-noda-static（nginx 静态+反代）——S5 零 Node
# 原 preprod-nginx 容器删除——static 容器顶替（监听 80/443，挂载 liuyao-local.conf）
#
# 使用：
#   NORA_API_IMAGE=noda-api:<sha> NORA_FRONTEND_IMAGE=noda-frontend:<sha> \
#   NORA_STATIC_IMAGE=noda-static:<sha> \
#   docker compose -f docker/docker-compose.preprod-local.yml up -d
#
# 访问（需 /etc/hosts 加 127.0.0.1 auth-preprod.noda.co.nz）：
#   class 等经 static 反代；liuyao-preprod 已整站 410（liuyao-local.conf liuyao-preprod 块）

name: preprod

services:
  postgres:
    image: postgres:17.9
    container_name: preprod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password_change_me
      POSTGRES_DB: noda_preprod
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - preprod-pgdata:/var/lib/postgresql/data
      - ./init-preprod.sql:/docker-entrypoint-initdb.d/03-init-preprod.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------
  # Go API（聚合单二进制，四 listener：class 3001 / email 3010 /
  #   admin 3011 / nearby 3014；liuyao 3007 已随 2026-10-10 v2 清算摘除）
  # 镜像 = noda-apps Wave 3/4 新形态：Go 多模块聚合单容器（构建见
  #   noda-apps/infra/docker/Dockerfile.noda-api，BuildKit GOCACHE 缓存挂载只重编改动包），
  #   附带 noda-crawler 子进程二进制（NODA_CRAWLER_BIN=/usr/local/bin/noda-crawler 不变）
  # ----------------------------------------
  preprod-noda-api:
    # 流水线恒传 NORA_API_IMAGE（commit tag）；构建机不再打 latest（2026-09-13）——
    # 手动 compose 需先 docker tag noda-api:<sha> noda-api:latest
    image: ${NORA_API_IMAGE:-noda-api:latest}
    container_name: preprod-noda-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NODA_ENV: "preprod"
      DATABASE_URL: "postgresql://postgres:postgres_password_change_me@postgres:5432/noda_preprod"
      DIRECT_URL: "postgresql://postgres:postgres_password_change_me@postgres:5432/noda_preprod"
      AUTH_BYPASS: "false"
      # 会话 cookie 名（Go API 校验 cookie 用；preprod 独立名避免污染 prod 会话）
      NEXT_PUBLIC_SESSION_COOKIE_NAME: "noda_session_preprod"
      NEXT_PUBLIC_ALLOWED_ORIGINS: "https://auth-preprod.noda.co.nz,https://www-preprod.noda.co.nz,https://admin-preprod.noda.co.nz,https://comments-preprod.noda.co.nz"
      TOKEN_SECRET: "${TOKEN_SECRET:-}"
      EMAIL_SERVICE_API_KEY: "${EMAIL_SERVICE_API_KEY:-}"
      RESEND_API_KEY: "${RESEND_API_KEY:-}"
      # Go emailapi 发件地址（必须用已验证域名 email.noda.co.nz，缺省会回退
      # 未验证的 noda.co.nz 被 Resend 拒绝 → send-* 全部 500）
      RESEND_FROM_EMAIL: "Noda <noreply@email.noda.co.nz>"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      ANTHROPIC_AUTH_TOKEN: "${ANTHROPIC_AUTH_TOKEN:-}"
      ANTHROPIC_BASE_URL: "${ANTHROPIC_BASE_URL:-}"
      # 备 provider（2026-11-02 failover）：主（z.ai）失败自动切备（DeepSeek）
      ANTHROPIC_FALLBACK_API_KEY: "${ANTHROPIC_FALLBACK_API_KEY:-}"
      ANTHROPIC_FALLBACK_AUTH_TOKEN: "${ANTHROPIC_FALLBACK_AUTH_TOKEN:-}"
      ANTHROPIC_FALLBACK_BASE_URL: "${ANTHROPIC_FALLBACK_BASE_URL:-}"
      # 注意：ANTHROPIC_MODEL 不在此透传——宿主 shell 可能残留旧值（如 sonnet），
      # 留缺走 Go 端代码默认（glm-5.3-flash），与 ZAI 网关匹配
      # ANTHROPIC_FALLBACK_MODEL 同理不透传，留缺走 Go 端默认（deepseek-flash）
      ANTHROPIC_MAX_TOKENS: "24000"
      CRAWL_POST_LIMIT: "10"
      # Stripe test key 源头隔离：preprod 部署脚本从 Doppler config=prd_pre 导出
      # （prd_pre 只存 test mode 值），与 prod（config=prd，live key）天然隔离，
      # 变量名保持 STRIPE_* 与导出侧一致
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY:-}"
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET:-}"
      STRIPE_PRICE_DEEP_READ: "${STRIPE_PRICE_DEEP_READ:-}"
      # Nearby（2026-09 M1）：:3014 listener + Eventfinda 凭证（prd_pre 经 pipeline 导出）
      NEARBY_API_PORT: "3014"
      EVENTFINDA_API_HOST: "${EVENTFINDA_API_HOST:-}"
      EVENTFINDA_API_USERNAME: "${EVENTFINDA_API_USERNAME:-}"
      EVENTFINDA_API_PASSWORD: "${EVENTFINDA_API_PASSWORD:-}"
      NEARBY_OSM_ENABLED: "${NEARBY_OSM_ENABLED:-true}"
      NEARBY_NEWS_ENABLED: "${NEARBY_NEWS_ENABLED:-true}"
      # S5 去 Node 化（2026-09-12）：:3004 authapi + :3012 commentapi listener。
      # 密钥与 frontend 容器同源（Doppler prd_pre 经部署 shell 导出）
      AUTH_API_PORT: "3004"
      COMMENT_API_PORT: "3012"
      GOOGLE_OAUTH_CLIENT_ID: "${GOOGLE_OAUTH_CLIENT_ID:-}"
      GOOGLE_OAUTH_CLIENT_SECRET: "${GOOGLE_OAUTH_CLIENT_SECRET:-}"
      AUTH_STATE_SECRET: "${AUTH_STATE_SECRET:-}"
      ALLOWED_ORIGINS: "https://auth-preprod.noda.co.nz,https://www-preprod.noda.co.nz,https://admin-preprod.noda.co.nz,https://comments-preprod.noda.co.nz"
      ADMIN_ALLOWED_EMAILS: "wangdw2012@gmail.com,dryrun-admin@noda.test"
      COMMENT_SERVICE_KEY: "${COMMENT_SERVICE_KEY:-}"
      REMARK_WORDS_BAN_LIST: "赌博,代开发票,casino-spam"
      # 头像桶（authapi avatar 写 SeaweedFS stg；blobstore 同款变量名）
      S3_ENDPOINT: "http://seaweedfs:8333"
      S3_ACCESS_KEY: "${S3_ACCESS_KEY:-}"
      S3_SECRET_KEY: "${S3_SECRET_KEY:-}"
      S3_BUCKET: "noda-static"
      # nearby 条目页 head 注入拉壳的桶（stg 桶与 S3_BUCKET 的 prod 名不同,须显式）
      NEARBY_STATIC_BUCKET: "noda-static-stg"
      # 站点绝对地址（Go 侧 sitemap/深链注入运行时读取；缺省回退 prod 域名，
      # preprod 须显式指向 -preprod 域，否则 preprod sitemap/注入输出 prod URL）
      NEXT_PUBLIC_SITE_URL: "https://class-preprod.noda.co.nz"
      NEXT_PUBLIC_NEARBY_SITE_URL: "https://nearby-preprod.noda.co.nz"
      # blobstore fs 模式（#123/#8 SeaweedFS 退役）：preprod 直接 fs——stg 无
      # 30 天保留约束，直写本地静态根 cdn/ 子树（与 pipeline fs 后端同根，
      # STG_STATIC_ROOT Jenkins 共享根，见 volumes 注释）
      BLOBSTORE_MODE: "fs"
      BLOBSTORE_FS_DIR: "/data/blobstore"
      # nearby 壳页基址（#123 fs 模式）：preprod-noda-static 专用 8181 监听
      # （liuyao-local.conf 尾部 server 块），替代原 S3 path-style 桶基址
      STATIC_SHELL_BASE_URL: "http://preprod-noda-static:8181"
    volumes:
      # 静态 fs 后端根（#8）：blobstore 可写直挂 cdn/ 子树。
      # STG_STATIC_ROOT 由 pipeline-stages.sh export（Jenkins 共享绝对根，
      # 槽位无关——build 1165 实证工作区级根会被 checkout 清空致探活 404）；
      # 手动 compose 不带 env 时回落仓库内 ./volumes/static-stg（自包含开发模式）
      - ${STG_STATIC_ROOT:-./volumes/static-stg}/cdn:/data/blobstore
    tmpfs:
      - /tmp
      - /app/crawl-output:uid=1001,gid=1001,mode=0755
      - /app/crawler-logs:uid=1001,gid=1001,mode=0755
    deploy:
      resources:
        limits:
          memory: 512m

  # ----------------------------------------
  # Static（nginx）：www 静态站 + preprod 反代（顶替原 preprod-nginx）
  # S5：配置内 preprod upstream 指向 preprod-noda-api（auth/comment API）+ 桶伺服静态站
  # ----------------------------------------
  preprod-noda-static:
    # 流水线恒传 NORA_STATIC_IMAGE（commit tag 或本地最新 tag）；手动 compose 同上
    image: ${NORA_STATIC_IMAGE:-noda-static:latest}
    container_name: preprod-noda-static
    restart: unless-stopped
    # ⚠️ 不声明 depends_on: preprod-noda-api——compose 重建依赖目标（api）时会把
    # dependent（static）一并 kill+destroy，配合 --no-deps 又不会重新拉起，
    # 造成每次 api 发版后 static 消失（2026-09-13 build 343-349 实证）。
    # static 的 nginx 对 api 走 resolver 运行时解析，无启动顺序需求；
    # 自身 /health 为本地直答，健康检查亦不依赖 api。
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
      # 8443 = nearby 同域换源端口（回归测试绕缓存毒化，2026-09-22）
      - "127.0.0.1:8443:8443"
    volumes:
      - /Users/dianwenwang/Project/noda-infra/config/nginx/liuyao-local.conf:/etc/nginx/conf.d/default.conf:ro
      - /Users/dianwenwang/Project/noda-infra/config/nginx/snippets:/etc/nginx/snippets:ro
      - /Users/dianwenwang/Project/noda-infra/config/nginx/ssl:/etc/nginx/ssl:ro
      # 本地静态根（noda-infra#8 P3，2026-11-02）：preprod 挂 static-stg（顶层
      # sites/<产品>/ 与 cdn/…，同 prod 布局；发布流水线写入此目录），原 SeaweedFS
      # stg 桶代理（seaweedfs-*-stg snippet 与 cdn-preprod 块）切本地只读直读。
      # STG_STATIC_ROOT：Jenkins 共享绝对根（同 api blobstore 注释），手动
      # compose 缺省回落仓库内 ./volumes/static-stg
      - ${STG_STATIC_ROOT:-./volumes/static-stg}:/var/noda-static:ro
    healthcheck:
      # ⚠️ Host 头必须是 localhost（server_name 白名单成员，/health 直答 200）。
      # 2026-11-08 起未匹配域名落 80 default_server 兜底块 return 444（1ef8aaf
      # 域名唯一入口加固），裸 wget 127.0.0.1（Host: 127.0.0.1）恒 444 → 恒 unhealthy。
      # URL 仍用 127.0.0.1：busybox wget 探 localhost 会先试 ::1（nginx 不听 IPv6，
      # connection refused），故用 --header 覆盖 Host 而非改 URL 主机名。
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider --header 'Host: localhost' http://127.0.0.1:80/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ----------------------------------------
  # SeaweedFS（stg 实例，Phase 1, 2026-09-12）——已退役（noda-infra#8，2026-11-02）
  # stg 静态发布 fs-only（共享根 rsync 蓝绿），blobstore BLOBSTORE_MODE=fs；
  # 上方 S3_ENDPOINT / S3_BUCKET 等 env 键仅作 s3 回退模式的惰性默认保留。
  # 回退锚：git revert 本文件与 pipeline-stages.sh 的退役提交 →
  # docker compose up -d seaweedfs（seaweedfs-data 数据卷保留至 2026-12-02
  # 删除窗口；.backend-fs 标记删除后发布链回落 s3 桶路径）。
  # ----------------------------------------

  # ----------------------------------------
  # OurAuckland CDP sidecar（issue #182 浏览器会话通道）
  # 有头 chromium（Xvfb）+ CDP 9222：preprod-noda-api 的 ourauckland adapter
  # 403→CDP fallback（NEARBY_CDP_URL=http://ourauckland-cdp:9222，env 模板已配）。
  # 与 prod 版（docker-compose.r4s.yml）同镜像/入口，Mac 上 512m 档即可。
  # 仅 preprod 默认网络内可达，无宿主端口发布。
  # ----------------------------------------
  ourauckland-cdp:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.ourauckland-cdp
    image: ourauckland-cdp:latest
    container_name: preprod-ourauckland-cdp
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    shm_size: 128m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9222/json/version || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512m

volumes:
  preprod-pgdata:
