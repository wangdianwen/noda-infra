# ============================================
# Noda Monorepo - Docker Compose 生产环境配置
# ============================================
# 此文件覆盖生产环境特定的配置
# 使用方法：docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

name: noda-infra

# 共享安全加固配置（YAML anchors）
# 注意：no-new-privileges 已在基础 docker-compose.yml 中统一设置，此处不再重复
x-common-security: &common-security
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  stop_grace_period: 30s

services:
  # ----------------------------------------
  # PostgreSQL 生产环境配置
  # ----------------------------------------
  postgres:
    <<: *common-security
    # 生产环境不暴露端口，仅通过 Docker 内部网络访问
    environment:
      POSTGRES_DB: noda_prod
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    volumes:
      - ./services/postgres/backup:/var/lib/postgresql/backup  # 备份目录
      - ./services/postgres/backup/wal-archive:/var/lib/postgresql/wal_archive  # WAL 归档目录
      - ./services/postgres/conf/postgresql.conf:/etc/postgresql/postgresql.conf:ro  # PostgreSQL 配置文件
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      - /var/run/postgresql
      - /tmp

  # ----------------------------------------
 # Keycloak 已下线（2026-09-12）：服务块物理移除，证据见 git 历史与
  # backup/2026/decommission/keycloak-final-20260912.dump；认证在 Go authapi。
  # ----------------------------------------
  # ----------------------------------------
  # Nginx 安全加固（生产环境）
  # ----------------------------------------
  nginx:
    <<: *common-security
    volumes:
      - ../config/nginx/errors:/etc/nginx/errors:ro
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp

  # ----------------------------------------
  # Noda Ops 安全加固（生产环境）
  # ----------------------------------------
  noda-ops:
    <<: *common-security
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      - /tmp
      - /root/.doppler
      - /home/nodaops:uid=100,gid=101,mode=0700
      - /var/spool/cron/cronstamps:uid=100,gid=101,mode=0700

# ============================================
# 网络定义
# ============================================
networks:
  noda-network:
    external: true
    name: noda-network
