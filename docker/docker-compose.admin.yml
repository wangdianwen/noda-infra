# ============================================
# Admin Dashboard 服务配置
# ============================================
# 仅内网可访问的管理后台（localhost:8001）
# 独立于主应用服务，使用相同的 noda-network

name: noda-admin

services:
  admin:
    build:
      context: ../../noda-apps
      dockerfile: apps/admin/Dockerfile
    image: noda-admin:latest
    container_name: noda-admin
    labels:
      - "noda.service-group=admin"
      - "noda.environment=prod"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      # 仅监听 localhost，不暴露外网
      - "127.0.0.1:8001:8001"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@noda-infra-postgres-prod:5432/noda_prod
      KEYCLOAK_URL: http://noda-infra-nginx
      KEYCLOAK_REALM: noda
      KEYCLOAK_CLIENT_ID: admin-dashboard
      KEYCLOAK_ADMIN_CLIENT_ID: admin-cli
      KEYCLOAK_ADMIN_USERNAME: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      ADMIN_SERVER_PORT: "3011"
      SERVICE_ENDPOINTS: "findclass-api:http://noda-apps:3001"
    networks:
      - noda-network
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8001/api/admin/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  noda-network:
    external: true
