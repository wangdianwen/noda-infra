# ============================================
# Pre-prod: 六爻算卦 (Liuyao) — /etc/hosts 访问 (HTTPS)
# Next.js 前端(3005) + 内部 /api/* 通过 Next.js rewrites 代理到 3007
# ============================================
server {
    listen 80;
    server_name liuyao.noda.test;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name liuyao.noda.test;

    ssl_certificate /etc/nginx/ssl/noda.dev.crt;
    ssl_certificate_key /etc/nginx/ssl/noda.dev.key;

    include /etc/nginx/snippets/upstream-preprod.conf;

    add_header X-Noda-Environment "preprod" always;
    include /etc/nginx/snippets/security-headers.conf;

    client_max_body_size 10M;

    location / {
        proxy_pass http://$preprod_liuyao_upstream;
        include /etc/nginx/snippets/proxy-common.conf;
        # SSE 流式：关闭 buffering，长超时
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
    }

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    error_page 502 503 /50x.html;
    location = /50x.html {
        root /etc/nginx/errors;
        internal;
    }
}

