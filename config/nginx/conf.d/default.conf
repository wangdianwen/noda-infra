# 动态设置转发协议和端口（Cloudflare TLS 终止，内部 HTTP）
map $host $forwarded_proto {
    default $scheme;
    class.noda.co.nz "https";
    auth.noda.co.nz "https";
    noda.co.nz "https";
    www.noda.co.nz "https";
    comments.noda.co.nz "https";
}

map $host $forwarded_port {
    default $server_port;
    class.noda.co.nz "443";
    auth.noda.co.nz "443";
    noda.co.nz "443";
    www.noda.co.nz "443";
}

# ============================================
# Auth 服务域名 — 全部走 Auth App（2026-09-12 Keycloak 下线，OAuth 直连 Google）
# ============================================
server {
    listen 81;
    server_name auth.noda.co.nz noda-infra-nginx;

    # upstream 变量（使用 resolver 动态 DNS，容器重建后自动刷新）
    include /etc/nginx/snippets/upstream-class.conf;
    # S5 静态壳：auth 页面切 SeaweedFS 桶 sites/auth/（/api/ 双跑期仍指 Node）
    include /etc/nginx/snippets/upstream-seaweedfs.conf;
    # 变量 upstream 需动态 DNS（docker 内嵌 DNS，容器重建自动刷新）
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 302 Location 不绝对化（防 :81 泄漏进 Location——admin/www/liuyao/nearby 同款教训；
    # 漏加时登录后 /zh/profile 规整 302 带 :81，浏览器跳出 CF 代理死链）
    absolute_redirect off;

    # static 容器健康检查（wget 127.0.0.1:81/health）本地直答：
    # 若代理到 auth 应用（frontend :3004），frontend 启动慢于 static 时
    # 健康检查被启动时序误杀（#272）。本端点只证明 nginx 自身配置可用。
    location = /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # 客户端最大请求体大小
    client_max_body_size 100M;

    # 安全头：auth 域专用——不使用 security-headers.conf 片段，因为该片段的
    # X-Frame-Options: SAMEORIGIN 在 XFO 与 CSP frame-ancestors 并存时优先生效，
    # 会拦死各应用对 Keycloak 端点的 iframe 嵌入（3p-cookies 探测 + silent
    # check-sso），导致登录回跳后 keycloak-js 兑换 code 前 init 直接挂死。
    # 帧嵌入策略由下方 CSP frame-ancestors 显式 allowlist 管控。
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # frame-ancestors 必须包含各 preprod 应用源：preprod auth/class/liuyao 应用
    # 经 iframe 加载 Keycloak 静默端点（3p-cookies 探测 + silent check-sso），
    # 缺源会被浏览器拦截 → keycloak-js init 超时 → 应用恒判未认证。
    # https://noda.co.nz（prod 官网）同理：www 的 keycloak-js 登录回跳要挂
    # 3p-cookies 探测 iframe，漏源会导致兑换 code 前被 CSP 掐死、登录态永远建不起来
    add_header Content-Security-Policy "frame-ancestors 'self' https://noda.co.nz https://class.noda.co.nz https://class-preprod.noda.co.nz https://liuyao.noda.co.nz https://liuyao-preprod.noda.co.nz https://auth-preprod.noda.co.nz https://www-preprod.noda.co.nz https://admin.noda.co.nz https://admin-preprod.noda.co.nz https://localhost:3001 https://localhost:3006;" always;
    # auth 域不参与 SEO：Keycloak 协议端点（silent-check-sso 等）被 Googlebot 渲染发现后会进
    # GSC "Crawled - currently not indexed"，加 noindex 头让 Google 主动出索引
    add_header X-Robots-Tag "noindex" always;
    # keycloak 若未来在 realm 安全防御里配置了 XFO/CSP，同样会与上面的策略冲突，隐藏之
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Content-Security-Policy;

    # ============================================
    # S5（2026-09-12）：auth 页面静态壳 → SeaweedFS 桶 sites/auth/
    # （next build output:'export' → scripts/pipeline-stages.sh
    #   pipeline_publish_static_site auth auth out/zh/login.html）
    # 原 auth/middleware.ts 的等价物在 conf.d/auth.map.conf 与下方 if 正则：
    #   - 无前缀 canonical = zh：默认内部改写 /zh 前缀伺服（URL 不漂移）
    #   - 协商命中 en/zh-TW → 302 带前缀路径（与原 middleware 307 对齐）
    #   - /zh/* 直达请求 302 规整回无前缀（as-needed 语义）
    # /api/* 与 /avatars/*：/api/ 双跑期仍反代 Node auth（:3004），S5.4 切
    #   noda-api-prod:3004（Go authapi）；头像桶 sites/auth 同级的 avatars/ 前缀
    # 回滚：下方静态 location 换回 proxy_pass http://$auth_app_upstream 即回 SSR
    #   （noda-frontend-prod:3004 的 auth 进程仍在运行，常驻回滚锚点）。
    # ============================================

    # 根页：原 SSR [locale]/page.tsx 的 redirect('/login')（export 烤不出服务端跳转）
    location = / {
        return 302 /login;
    }

    # 无前缀页面（zh canonical）：协商 en/zh-TW → 302 带前缀；默认内部改写 /zh
    # ⚠️ $uri 判定不能进 map（rewrite last 重入不重算 map → 死循环 500），if 正则每轮重入重新求值
    location ~ ^/(login|register|callback|verify-email|forgot-password|reset-password|profile|settings)(/.*)?$ {
        if ($auth_locale = en) {
            return 302 /en$uri$is_args$args;
        }
        if ($auth_locale = zh-TW) {
            return 302 /zh-TW$uri$is_args$args;
        }
        rewrite ^(.*)$ /zh$1 last;
    }

    # 静态资产：一年 immutable
    location /_next/ {
        include /etc/nginx/snippets/seaweedfs-auth-static.conf;
    }
    location /images/ {
        include /etc/nginx/snippets/seaweedfs-auth-static.conf;
    }
    location = /favicon.ico {
        include /etc/nginx/snippets/seaweedfs-auth-static.conf;
    }
    location = /icon.svg {
        include /etc/nginx/snippets/seaweedfs-auth-static.conf;
    }
    location = /apple-icon.png {
        include /etc/nginx/snippets/seaweedfs-auth-static.conf;
    }

    # 头像（S5：Go authapi 写入桶 avatars/ 前缀，nginx 直读；DB 存相对路径不变）
    location /avatars/ {
        add_header Cache-Control $auth_cache_control always;
        include /etc/nginx/snippets/security-headers.conf;
        rewrite ^/avatars/(.*)$ /noda-static/avatars/$1 break;
        proxy_pass http://$seaweedfs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host "seaweedfs:8333";
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # 其余全部（/en/*、/zh-TW/* 带前缀页面、/404.html、/zh/* 302 规整、RSC .txt）
    location / {
        # as-needed：/zh 前缀直达请求 302 回 canonical（$request_uri 判定——内部
        # 改写保留原始 request_uri，不会误伤 /login→/zh/login 的内部改写）
        if ($request_uri ~ ^/zh(/.+)$) {
            return 302 $1;
        }
        add_header Cache-Control $auth_cache_control always;
        include /etc/nginx/snippets/seaweedfs-auth-static.conf;
        error_page 403 404 /404.html;
    }

    # /api/* → Go authapi（S5.4 切换；回滚 = 本变量改回 $auth_app_upstream 即回 Node）
    location /api/ {
        proxy_pass http://$auth_api_upstream;
        include /etc/nginx/snippets/proxy-websocket.conf;
    }

    # 自定义错误页
    error_page 502 503 /50x.html;
    location = /50x.html {
        root /etc/nginx/errors;
        internal;
    }
}

# ============================================
# Noda 官网 — 静态文件（三容器拆分：本容器（noda-static-prod）直接伺服，
# 镜像内烘焙 /var/www/noda.co.nz；原代理 $www_upstream（:3002）已删除）
# ============================================
server {
    listen 81;
    server_name noda.co.nz;

    # 安全头
    include /etc/nginx/snippets/security-headers.conf;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/x-javascript application/xml+rss
               application/json application/javascript
               image/svg+xml;

    # 过渡期（旧 noda-infra-nginx 仍为边缘）：apex 代理到新 noda-static-prod 伺服的
    # www 静态（$www_upstream，见 snippets/upstream-www.conf）。旧边缘退役、
    # Cloudflare 直切本机高位端口后，由运维还原为本地 root /var/www/noda.co.nz。
    # 2026-09-12 S2：www 改桶托管（SeaweedFS noda-static/sites/www/），
    # $www_upstream（自反代 :8181 → 镜像内烘焙文件）仅保留作回滚路径。
    include /etc/nginx/snippets/upstream-www.conf;
    include /etc/nginx/snippets/upstream-seaweedfs.conf;
    # 变量 upstream 需动态 DNS（docker 内嵌 DNS，容器重建自动刷新）
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Nearby 快捷入口卡（2026-09 M2）：静态 www 同域直连 API（最长前缀优先于 location /）
    location /api/nearby/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://$nearby_api_upstream;
        include /etc/nginx/snippets/proxy-common.conf;
    }
    location /api/user/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://$nearby_api_upstream;
        include /etc/nginx/snippets/proxy-common.conf;
    }
    location /api/courses {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://$class_api_www_upstream;
        include /etc/nginx/snippets/proxy-common.conf;
    }
    location /api/recommendations/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://$class_api_www_upstream;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    # 静态资产：SeaweedFS 桶 sites/www/（一年 immutable，CF 边缘开始缓存）
    location /_next/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/seaweedfs-www-static.conf;
    }

    # HTML 与其余文件：桶托管（no-cache，发布即时生效）；404 保留状态码回自定义页
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/seaweedfs-www-static.conf;
        error_page 403 404 /404.html;
    }

    # 自定义错误页
    error_page 502 503 /50x.html;
    location = /50x.html {
        root /etc/nginx/errors;
        internal;
    }
}

# ============================================
# Admin Dashboard — 仅内网访问（/etc/hosts，不经过 Cloudflare）
# 三容器拆分：/api/admin/ → noda-api-prod:3011（$admin_api_upstream）
# ============================================
server {
    listen 81;
    server_name admin.noda.co.nz;

    # upstream 变量
    include /etc/nginx/snippets/upstream-class.conf;
    include /etc/nginx/snippets/upstream-seaweedfs.conf;
    # 变量 upstream 需动态 DNS（docker 内嵌 DNS，容器重建自动刷新）
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 安全头
    include /etc/nginx/snippets/security-headers.conf;

    client_max_body_size 100M;

    # 302 Location 不绝对化（防内网 :81 端口泄漏进 Location，同 class 块教训）
    absolute_redirect off;

    # Admin Hono API
    location /api/admin/ {
        proxy_pass http://$admin_api_upstream;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_read_timeout 120s;
    }

    # 2026-09-12 S2：Admin CSR 静态壳 → SeaweedFS 桶 sites/admin/
    # （回滚：三个静态 location 换回 proxy_pass http://$admin_upstream 即回 SSR）
    # .txt（RSC 载荷）单独代理：已预渲染路由的 .txt 桶内存在正常伺服；未预渲染
    # 路由（如 /cronjobs/<real>）的 .txt 干净 404——触发 Next 路由器硬导航兜底，
    # 落到下方 error_page 壳页（若被 =200 壳 HTML 冒充 RSC 数据，软导航会解析失败）
    location ~ \.txt$ {
        include /etc/nginx/snippets/seaweedfs-admin-static.conf;
    }

    # regex 顺序敏感：.txt > 两级 cronjobs 深链 > 单级 cronjobs
    location ~ ^/cronjobs/[^/]+/[^/]+(/|$) {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/seaweedfs-admin-static.conf;
        error_page 403 404 =200 /cronjobs/app-shell/app-shell.html;
    }

    location ~ ^/cronjobs/ {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/seaweedfs-admin-static.conf;
        error_page 403 404 =200 /cronjobs/app-shell.html;
    }

    # 根页 302（等价原 SSR page.tsx 的 redirect('/dashboard')；export 模式下
    # 服务端 redirect 烤不出跳转，改由 nginx 承担——未登录时 /dashboard 由
    # AuthProvider 渲染登录 UI，行为与 SSR 时代一致）
    location = / {
        return 302 /dashboard;
    }

    # 静态资产：一年 immutable（浏览器与内网客户端）
    location /_next/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/seaweedfs-admin-static.conf;
    }

    # HTML 与其余文件
    location / {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/seaweedfs-admin-static.conf;
        error_page 403 404 /404.html;
    }
}

# ============================================
# Class 应用 — CSR 静态壳（2026-09-12 S1 切换）
# 页面 = SeaweedFS 桶 noda-static/sites/class/（next build output:'export'
#   → scripts/pipeline-stages.sh pipeline_publish_class_static → mc mirror）
# 原 middleware.ts 等价物全部在本块实现（映射见 conf.d/class.map.conf 与
#   snippets/seaweedfs-class-static.conf 头注）：
#   - CSP/安全头 → snippets/security-headers-class.conf
#   - 受保护路径 cookie 存在性检查（publish/dashboard/admin/course/*/edit）
#     → 无 noda_session cookie 302 auth 登录页；会话有效性由页面 ProtectedRoute
#       与 API 侧 Bearer 校验把关（与 middleware 同分层）
#   - 无前缀页面路径 → 按 cookie/Accept-Language 302 到 /en|zh|zh-TW 等价路径
#   - unknown-host 改写 → 不再需要：cloudflared ingress 按 hostname 分发，
#     异常 Host 根本进不了本块（/unknown-host.html 仍可直接访问）
# /api/* 与 /sitemap.xml 分流 Go API（$class_api_upstream → noda-api-prod:3001）
# 回滚：把下方各静态 location 换回 proxy_pass http://$class_upstream 即回 SSR
#   （noda-frontend-prod:3000 的 class 进程仍在运行，作为常驻回滚锚点）。
# ============================================
server {
    listen 81;
    server_name localhost class.noda.co.nz;

    # upstream 变量（Go API + SeaweedFS）
    include /etc/nginx/snippets/upstream-class.conf;
    include /etc/nginx/snippets/upstream-seaweedfs.conf;
    # 变量 upstream 需动态 DNS（docker 内嵌 DNS，容器重建自动刷新）
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 302 Location 保持相对路径（/en/）：nginx 默认绝对化会带内网端口
    # http://class.noda.co.nz:81/en/（:81 经 CF 公网不可达 + scheme 误为 http）
    absolute_redirect off;

    # 客户端最大请求体大小
    client_max_body_size 100M;

    # class 安全头 + CSP（等价 middleware addCSPHeaders）
    include /etc/nginx/snippets/security-headers-class.conf;

    # Gzip 压缩（桶代理返回的 HTML/JS/CSS 就地压缩）
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/x-javascript application/xml+rss
               application/json application/javascript
               image/svg+xml;

    # 管理 API — 仅允许内部访问，外网返回 403
    # （前缀 location 按最长匹配，/api/admin/* 优先于下方 /api/）
    location /api/admin/ {
        return 403 '{"error":"forbidden"}';
        add_header Content-Type application/json always;
    }

    # Go API（noda-api-prod:3001）— /api/* 直达 API 容器
    location /api/ {
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_timeout 5s;
        proxy_next_upstream_tries 2;
        proxy_pass http://$class_api_upstream;
        include /etc/nginx/snippets/proxy-common.conf;

        proxy_buffering off;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # sitemap 由 Go API 动态生成
    location = /sitemap.xml {
        proxy_pass http://$class_api_upstream;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_buffering off;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # .txt（RSC 载荷）单独代理（2026-09-12 S2 回补）：已预渲染页面的 .txt 桶内
    # 正常伺服；未预渲染动态路由（course/category 深链）的 .txt 干净 404 → 触发
    # Next 路由器硬导航兜底回下方壳页（若被 =200 壳 HTML 冒充 RSC 数据，软导航
    # 会解析失败）。regex 顺序敏感：必须先于下方 course/category 块
    location ~ \.txt$ {
        include /etc/nginx/snippets/seaweedfs-class-static.conf;
    }

    # ---- 受保护路径：课程编辑（动态段，cookie 通过后同样走静态壳）----
    # regex location 顺序敏感：edit 更具体，必须先于下方通用 course 块
    location ~ ^/(en|zh|zh-TW)/course/[^/]+/edit(/|$) {
        if ($cookie_noda_session = "") {
            return 302 "https://auth.noda.co.nz/$1/login?from=https://class.noda.co.nz$request_uri";
        }
        include /etc/nginx/snippets/seaweedfs-class-static.conf;
        # course/[id]/edit 无静态文件 → 回退编辑页壳（=200：动态路由合法存在）
        error_page 403 404 =200 /$class_loc/course/app-shell/edit.html;
    }

    # ---- 受保护路径：publish / dashboard / admin（cookie 存在性门槛）----
    location ~ ^/(en|zh|zh-TW)/(publish|dashboard|admin)(/|$) {
        if ($cookie_noda_session = "") {
            return 302 "https://auth.noda.co.nz/$1/login?from=https://class.noda.co.nz$request_uri";
        }
        include /etc/nginx/snippets/seaweedfs-class-static.conf;
        # 这些页面在 out/ 全有静态文件；缺页回 404 页（保留原状态码）
        error_page 403 404 /404.html;
    }

    # ---- 课程详情（动态段 [id]）→ 404/403 回退 app-shell 壳页 ----
    location ~ ^/(en|zh|zh-TW)/course/ {
        include /etc/nginx/snippets/seaweedfs-class-static.conf;
        error_page 403 404 =200 /$class_loc/course/app-shell.html;
    }

    # ---- 分类页（动态段 [...slug]）→ 404/403 回退 app-shell 壳页 ----
    location ~ ^/(en|zh|zh-TW)/category/ {
        include /etc/nginx/snippets/seaweedfs-class-static.conf;
        error_page 403 404 =200 /$class_loc/category/app-shell.html;
    }

    # ---- 其余全部（locale 页面 / _next 资产 / robots / 兜底）----
    location / {
        # 无前缀页面路径 → 302 协商 locale 等价路径（等价 middleware locale 协商；
        # 资产/API/带前缀路径经 class_needs_locale_redirect 放行）
        if ($class_needs_locale_redirect) {
            return 302 /$class_locale$request_uri;
        }
        include /etc/nginx/snippets/seaweedfs-class-static.conf;
        # 缺页 → 静态 404 页（原 404 状态码保留）
        error_page 403 404 /404.html;
    }

    # 健康检查
    location = /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # 自定义错误页
    error_page 502 503 /50x.html;
    location = /50x.html {
        root /etc/nginx/errors;
        internal;
    }
}

# ============================================
# 六爻站 — Prod（S3 静态壳：SeaweedFS 桶 sites/liuyao/ 伺服 + /api 分流 Go API）
# next build output:'export' → scripts/pipeline-stages.sh pipeline_publish_static_site
#   （SERVICE=liuyao-static）→ mc mirror 入桶
# 原 middleware.ts 等价物全部在本块实现（映射见 conf.d/liuyao.map.conf 与
#   snippets/seaweedfs-liuyao-static.conf 头注）：
#   - locale 协商 → liuyao.map.conf（cookie > Accept-Language > en；与 class 不同点：
#     liuyao 是 localePrefix:'as-needed'，无前缀 en 页面 302 会造成 canonical URL
#     漂移——故 en 走 location / 内 rewrite 内部改写保 URL，仅 zh/zh-TW 302）
#   - 分享落地页 /s/<token> 动态段 → app-shell 占位壳 + client 取数
#   - sitemap.xml/robots.txt 为构建期静态产物，直接在桶里
# /api/* 分流 Go API 不变（SSE 流式起卦）
# 回滚：把静态 location 换回 proxy_pass http://$liuyao_upstream 即回 SSR
#   （noda-frontend-prod:3005 的 liuyao 进程在镜像重建前仍在运行，作回滚锚点）
# ============================================
server {
    listen 81;
    server_name liuyao.noda.co.nz;

    # upstream 变量（Go API + SeaweedFS）
    include /etc/nginx/snippets/upstream-class.conf;
    include /etc/nginx/snippets/upstream-seaweedfs.conf;
    # 变量 upstream 需动态 DNS（docker 内嵌 DNS，容器重建自动刷新）
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 302 Location 保持相对路径（/zh/...）：nginx 默认绝对化会带内网端口
    # http://liuyao.noda.co.nz:81/zh/（:81 经 CF 公网不可达 + scheme 误为 http）
    absolute_redirect off;

    client_max_body_size 10M;

    # 安全头（/api/ 等非静态 location 依赖 server 级；静态 location 由 snippet 重注入）
    include /etc/nginx/snippets/security-headers.conf;

    # Gzip 压缩（桶代理返回的 HTML/JS/CSS 就地压缩）
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/x-javascript application/xml+rss
               application/json application/javascript
               image/svg+xml;

    # Go API（noda-api-prod:3007）— 六爻 API 直达（起卦 SSE 流式 + share-cards 快照）
    location /api/ {
        proxy_pass http://$liuyao_api_upstream;
        include /etc/nginx/snippets/proxy-common.conf;
        # SSE 流式（起卦推送）：关闭 buffering，长超时
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        chunked_transfer_encoding on;
    }

    # RSC 载荷 .txt：桶内缺（未预渲染的 token 段）必须净 404（无 error_page），
    # 触发 Next 硬导航兜底——若被深链壳 =200 HTML 冒充，flight 数据解析失败。
    # regex location 顺序敏感：必须先于下方 s/[token] 深链壳。
    location ~ \.txt$ {
        include /etc/nginx/snippets/seaweedfs-liuyao-static.conf;
    }

    # 分享落地页深链 /<loc>/s/<token>：token 无限不可预渲染 → 404 =200 回
    # app-shell 占位壳（client 容器 useParams 取真实 token 拉 /api/share-cards；
    # robots 已 disallow /s/，此页无 SEO 诉求）。$liuyao_loc 见 liuyao.map.conf。
    location ~ ^/(en|zh|zh-TW)/s/[^/]+(/|$) {
        include /etc/nginx/snippets/seaweedfs-liuyao-static.conf;
        error_page 403 404 =200 /$liuyao_loc/s/app-shell.html;
    }

    # 静态站入口：locale 协商（等价 middleware；协商结果 $liuyao_locale 见 liuyao.map.conf）
    location / {
        # $loc="" = URI 已带前缀/是资产，直接静态伺服；set 取 map 值（请求头派生，
        # 不随内部改写变化），$uri 判定用 if 正则——每轮重入重新求值，rewrite last
        # 内部改写 /en 后此处命中前缀正则清空 $loc，不会死循环（map $uri 版本会，
        # 因 map 值请求内缓存不重算 → 500，首版实测踩坑）。
        set $loc $liuyao_locale;
        if ($uri ~ "^/(en|zh|zh-TW)(/|$)") { set $loc ""; }
        if ($uri ~ "^/(_next|api|images|fonts)(/|$)") { set $loc ""; }
        if ($uri ~ "\.[A-Za-z0-9]+(/|$)") { set $loc ""; }
        # zh/zh-TW 协商命中无前缀页面 → 302 带前缀（相对 Location，absolute_redirect off）
        if ($loc = zh-TW) { return 302 /zh-TW$request_uri; }
        if ($loc = zh) { return 302 /zh$request_uri; }
        # en（默认）→ 内部改写 /en 前缀进静态映射，URL 保持无前缀 canonical
        if ($loc = en) { rewrite ^(.*)$ /en$1 last; }
        include /etc/nginx/snippets/seaweedfs-liuyao-static.conf;
        error_page 403 404 /404.html;
    }

    # 健康检查
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}

# ============================================
# Nearby（周边新鲜事）— Prod（S3 静态壳：SeaweedFS 桶 sites/nearby/ 伺服 + /api 分流 Go API）
# next build output:'export' → pipeline_publish_static_site（SERVICE=nearby-static）→ mc mirror 入桶
# 原 middleware.ts 等价物在本块实现（见 conf.d/nearby.map.conf）：
#   - locale 协商：as-needed 同 liuyao——无前缀 en 页面内部 rewrite 保 URL，zh/zh-TW 302
#   - /item/<id> 动态段 → app-shell 占位壳 + client 取数（SEO 元数据客户端补挂：
#     Google 渲染可见；社交爬虫预览降级为站点默认 og，回滚 = 换回 proxy_pass）
#   - sitemap.xml → nearbyapi（Go）动态生成，本块反代（Next force-dynamic 与 export 冲突）
# /api/nearby/*、/api/user/* 分流 Go API 不变
# 回滚：把静态 location 换回 proxy_pass http://$nearby_upstream 即回 SSR
#   （noda-frontend-prod:3013 的 nearby 进程在镜像重建前仍运行，作回滚锚点）
# ============================================
server {
    listen 81;
    server_name nearby.noda.co.nz;

    # upstream 变量（Go API + SeaweedFS）
    include /etc/nginx/snippets/upstream-class.conf;
    include /etc/nginx/snippets/upstream-seaweedfs.conf;
    # 变量 upstream 需动态 DNS（docker 内嵌 DNS，容器重建自动刷新）
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 302 Location 保持相对路径（/zh/...）：nginx 默认绝对化会带内网端口
    absolute_redirect off;

    client_max_body_size 5M;

    # 安全头（/api/ 等非静态 location 依赖 server 级；静态 location 由 snippet 重注入）
    include /etc/nginx/snippets/security-headers.conf;

    # Gzip 压缩（桶代理返回的 HTML/JS/CSS 就地压缩）
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/x-javascript application/xml+rss
               application/json application/javascript
               image/svg+xml;

    # Nearby API（:3014，noda-api-prod）
    location /api/nearby/ {
        proxy_pass http://$nearby_api_upstream;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_buffering off;
    }
    location /api/user/ {
        proxy_pass http://$nearby_api_upstream;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_buffering off;
    }

    # sitemap.xml → Go API 动态生成（条目每日爬取新增，静态桶会冻结）
    location = /sitemap.xml {
        proxy_pass http://$nearby_api_upstream;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    # RSC 载荷 .txt：桶内缺（未预渲染的 item 段）必须净 404（无 error_page），
    # 触发 Next 硬导航兜底。regex location 顺序敏感：必须先于下方 item 深链壳。
    location ~ \.txt$ {
        include /etc/nginx/snippets/seaweedfs-nearby-static.conf;
    }

    # 条目详情深链 /<loc>/item/<id>：id 无限不可预渲染 → 404 =200 回 app-shell
    # 占位壳（client 容器解析真实 id 拉 API 并补挂 SEO 元数据）。$nearby_loc 见
    # nearby.map.conf（基于 $request_uri——snippet rewrite 后 $uri 已改写）。
    location ~ ^/(en|zh|zh-TW)/item/[^/]+(/|$) {
        include /etc/nginx/snippets/seaweedfs-nearby-static.conf;
        error_page 403 404 =200 /$nearby_loc/item/app-shell.html;
    }

    # 静态站入口：locale 协商（等价 middleware，判定 map 见 nearby.map.conf）
    location / {
        # $loc="" = URI 已带前缀/是资产，直接静态伺服；set 取 map 值（请求头派生），
        # $uri 判定用 if 正则（每轮重入重新求值，内部改写 /en 后命中前缀正则清空
        # $loc，不会死循环——map $uri 版本因值缓存不重算会循环 500，liuyao 首版踩坑）
        set $loc $nearby_locale;
        if ($uri ~ "^/(en|zh|zh-TW)(/|$)") { set $loc ""; }
        if ($uri ~ "^/(_next|api|images|fonts)(/|$)") { set $loc ""; }
        if ($uri ~ "\.[A-Za-z0-9]+(/|$)") { set $loc ""; }
        # zh/zh-TW 协商命中无前缀页面 → 302 带前缀（相对 Location，absolute_redirect off）
        if ($loc = zh-TW) { return 302 /zh-TW$request_uri; }
        if ($loc = zh) { return 302 /zh$request_uri; }
        # en（默认）→ 内部改写 /en 前缀进静态映射，URL 保持无前缀 canonical
        if ($loc = en) { rewrite ^(.*)$ /en$1 last; }
        include /etc/nginx/snippets/seaweedfs-nearby-static.conf;
        error_page 403 404 /404.html;
    }

    # 健康检查
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}

