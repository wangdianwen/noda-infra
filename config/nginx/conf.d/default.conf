# 动态设置转发协议和端口（Cloudflare TLS 终止，内部 HTTP）
map $host $forwarded_proto {
    default $scheme;
    class.noda.co.nz "https";
    auth.noda.co.nz "https";
    noda.co.nz "https";
    www.noda.co.nz "https";
    comments.noda.co.nz "https";
}

map $host $forwarded_port {
    default $server_port;
    class.noda.co.nz "443";
    auth.noda.co.nz "443";
    noda.co.nz "443";
    www.noda.co.nz "443";
}

# ============================================
# Auth 服务域名 — 用户页面 → Auth App，API → Keycloak
# ============================================
server {
    listen 81;
    server_name auth.noda.co.nz noda-infra-nginx;

    # upstream 变量（使用 resolver 动态 DNS，容器重建后自动刷新）
    include /etc/nginx/snippets/upstream-findclass.conf;
    include /etc/nginx/snippets/upstream-keycloak.conf;

    # 客户端最大请求体大小
    client_max_body_size 100M;

    # 安全头（通用头 + 站点特有 CSP）
    include /etc/nginx/snippets/security-headers.conf;
    add_header X-Frame-Options "ALLOW-FROM https://class.noda.co.nz" always;
    add_header Content-Security-Policy "frame-ancestors 'self' https://class.noda.co.nz https://liuyao.noda.co.nz https://liuyao-preprod.noda.co.nz https://admin.noda.co.nz https://admin-preprod.noda.co.nz https://localhost:3001 https://localhost:3006;" always;

    # Auth App 用户页面（Next.js）
    location = / {
        proxy_pass http://$auth_app_upstream;
        include /etc/nginx/snippets/proxy-websocket.conf;
    }
    location /login {
        proxy_pass http://$auth_app_upstream;
        include /etc/nginx/snippets/proxy-websocket.conf;
    }
    location /register {
        proxy_pass http://$auth_app_upstream;
        include /etc/nginx/snippets/proxy-websocket.conf;
    }
    location /callback {
        proxy_pass http://$auth_app_upstream;
        include /etc/nginx/snippets/proxy-websocket.conf;
    }
    location /verify-email {
        proxy_pass http://$auth_app_upstream;
        include /etc/nginx/snippets/proxy-websocket.conf;
    }
    location /forgot-password {
        proxy_pass http://$auth_app_upstream;
        include /etc/nginx/snippets/proxy-websocket.conf;
    }
    location /reset-password {
        proxy_pass http://$auth_app_upstream;
        include /etc/nginx/snippets/proxy-websocket.conf;
    }
    location /profile {
        proxy_pass http://$auth_app_upstream;
        include /etc/nginx/snippets/proxy-websocket.conf;
    }
    location /settings {
        proxy_pass http://$auth_app_upstream;
        include /etc/nginx/snippets/proxy-websocket.conf;
    }
    # locale-prefixed routes (next-intl /zh/* and /en/*)
    location ~ ^/(zh|en)(/(login|register|callback|verify-email|forgot-password|reset-password|profile|settings))?$ {
        proxy_pass http://$auth_app_upstream;
        include /etc/nginx/snippets/proxy-websocket.conf;
    }
    location /_next/ {
        proxy_pass http://$auth_app_upstream;
        include /etc/nginx/snippets/proxy-websocket.conf;
    }
    location /favicon.ico {
        proxy_pass http://$auth_app_upstream;
        include /etc/nginx/snippets/proxy-websocket.conf;
    }
    location /api/ {
        proxy_pass http://$auth_app_upstream;
        include /etc/nginx/snippets/proxy-websocket.conf;
    }
    # Auth App 静态资源（illustrations, favicon 等）
    location /images/ {
        proxy_pass http://$auth_app_upstream;
        include /etc/nginx/snippets/proxy-websocket.conf;
    }

    # Keycloak API/协议端点（默认兜底）
    location / {
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_timeout 5s;
        proxy_next_upstream_tries 2;
        proxy_pass http://$keycloak_upstream;
        include /etc/nginx/snippets/proxy-websocket.conf;
    }

    # 自定义错误页
    error_page 502 503 /50x.html;
    location = /50x.html {
        root /etc/nginx/errors;
        internal;
    }
}

# ============================================
# Noda 官网 — 静态文件（代理到 noda-apps:3002）
# ============================================
server {
    listen 81;
    server_name noda.co.nz www.noda.co.nz;

    # upstream 变量
    include /etc/nginx/snippets/upstream-findclass.conf;

    # 安全头
    include /etc/nginx/snippets/security-headers.conf;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/x-javascript application/xml+rss
               application/json application/javascript
               image/svg+xml;

    # 代理到静态文件服务器
    location / {
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_timeout 5s;
        proxy_next_upstream_tries 2;
        proxy_pass http://$www_upstream;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    # 自定义错误页
    error_page 502 503 /50x.html;
    location = /50x.html {
        root /etc/nginx/errors;
        internal;
    }
}

# ============================================
# Admin Dashboard — 仅内网访问（/etc/hosts，不经过 Cloudflare）
# ============================================
server {
    listen 81;
    server_name admin.noda.co.nz;

    # upstream 变量
    include /etc/nginx/snippets/upstream-findclass.conf;

    # 安全头
    include /etc/nginx/snippets/security-headers.conf;

    client_max_body_size 100M;

    # Admin Hono API
    location /api/admin/ {
        proxy_pass http://$admin_api_upstream;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_read_timeout 120s;
    }

    # Admin Next.js 前端
    location / {
        proxy_pass http://$admin_upstream;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_buffering off;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

# ============================================
# FindClass 应用 — Next.js SSR（代理到 noda-apps:3000）
# ============================================
server {
    listen 81;
    server_name localhost class.noda.co.nz;

    # upstream 变量
    include /etc/nginx/snippets/upstream-findclass.conf;

    # 客户端最大请求体大小
    client_max_body_size 100M;

    # 安全头
    include /etc/nginx/snippets/security-headers.conf;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/x-javascript application/xml+rss
               application/json application/javascript
               image/svg+xml;

    # 管理 API — 仅允许内部访问，外网返回 403
    location /api/admin/ {
        return 403 '{"error":"forbidden"}';
        add_header Content-Type application/json always;
    }

    # 所有请求代理到 SSR 容器（API + SSR 渲染 + 静态文件）
    location / {
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_timeout 5s;
        proxy_next_upstream_tries 2;
        proxy_pass http://$findclass_upstream;
        include /etc/nginx/snippets/proxy-common.conf;

        # SSR Streaming 支持 (Next.js RSC streaming)
        proxy_buffering off;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 健康检查
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # 自定义错误页
    error_page 502 503 /50x.html;
    location = /50x.html {
        root /etc/nginx/errors;
        internal;
    }
}

# ============================================
# Remark42 评论服务 — Prod
# ============================================
server {
    listen 81;
    server_name comments.noda.co.nz;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name comments.noda.co.nz;

    ssl_certificate /etc/nginx/ssl/noda.dev.crt;
    ssl_certificate_key /etc/nginx/ssl/noda.dev.key;

    client_max_body_size 10M;

    include /etc/nginx/snippets/security-headers.conf;
    add_header Content-Security-Policy "frame-ancestors 'self' https://class.noda.co.nz https://class.noda.test:8443" always;

    location / {
        proxy_pass http://remark42:8080;
        include /etc/nginx/snippets/proxy-common.conf;
    }
}

