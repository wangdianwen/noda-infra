# 动态设置转发协议和端口（Cloudflare TLS 终止，内部 HTTP）
map $host $forwarded_proto {
    default $scheme;
    auth.noda.co.nz "https";
    noda.co.nz "https";
    www.noda.co.nz "https";
    comments.noda.co.nz "https";
}

map $host $forwarded_port {
    default $server_port;
    auth.noda.co.nz "443";
    noda.co.nz "443";
    www.noda.co.nz "443";
}

# ============================================
# Auth 服务域名 — 全部走 Auth App（2026-09-12 Keycloak 下线，OAuth 直连 Google）
# ============================================
server {
    include snippets/origin-gate.conf;
    listen 81;
    server_name auth.noda.co.nz noda-infra-nginx;

    # upstream 变量（使用 resolver 动态 DNS，容器重建后自动刷新）
    include /etc/nginx/snippets/upstream-apps.conf;
    # S5 静态壳：auth 页面切 SeaweedFS 桶 sites/auth/（/api/ 双跑期仍指 Node）
    include /etc/nginx/snippets/upstream-seaweedfs.conf;
    # 变量 upstream 需动态 DNS（docker 内嵌 DNS，容器重建自动刷新）
    include /etc/nginx/snippets/upstream-graphql.conf;
    resolver 127.0.0.11 valid=10s ipv6=off;

    # GraphQL BFF（同源反代：前端相对路径 /graphql；与 api.noda.co.nz 独立入口并存）
    location = /graphql {
        client_max_body_size 1m;          # GraphQL 查询体上限（防滥用第一道）
        limit_req zone=rl_graphql burst=30 nodelay;   # 反爬限速（conf.d/ratelimit.conf；#37 burst 20→30 无限滚动）
        limit_req_status 429;
        set $rl_surface "graphql";                    # 429 观测打标（conf.d/ratelimit.conf）
        proxy_pass http://$bff_upstream_prod;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_buffering off;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # 302 Location 不绝对化（防 :81 泄漏进 Location——admin/www/liuyao/nearby 同款教训；
    # 漏加时登录后 /zh/profile 规整 302 带 :81，浏览器跳出 CF 代理死链）
    absolute_redirect off;

    # static 容器健康检查（wget 127.0.0.1:81/health）本地直答：
    # 若代理到 auth 应用（frontend :3004），frontend 启动慢于 static 时
    # 健康检查被启动时序误杀（#272）。本端点只证明 nginx 自身配置可用。
    location = /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # 客户端最大请求体大小
    client_max_body_size 100M;

    # 安全头：auth 域专用——不使用 security-headers.conf 片段，因为该片段的
    # X-Frame-Options: SAMEORIGIN 在 XFO 与 CSP frame-ancestors 并存时优先生效，
    # 会拦死各应用对 Keycloak 端点的 iframe 嵌入（3p-cookies 探测 + silent
    # check-sso），导致登录回跳后 keycloak-js 兑换 code 前 init 直接挂死。
    # 帧嵌入策略由下方 CSP frame-ancestors 显式 allowlist 管控。
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # frame-ancestors 必须包含各 preprod 应用源：preprod auth/www/admin 应用
    # 经 iframe 加载 Keycloak 静默端点（3p-cookies 探测 + silent check-sso），
    # 缺源会被浏览器拦截 → keycloak-js init 超时 → 应用恒判未认证。
    # https://noda.co.nz（prod 官网）同理：www 的 keycloak-js 登录回跳要挂
    # 3p-cookies 探测 iframe，漏源会导致兑换 code 前被 CSP 掐死、登录态永远建不起来
    add_header Content-Security-Policy "frame-ancestors 'self' https://noda.co.nz https://auth-preprod.noda.co.nz https://www-preprod.noda.co.nz https://admin.noda.co.nz https://admin-preprod.noda.co.nz https://localhost:3001 https://localhost:3006;" always;
    # auth 域不参与 SEO：Keycloak 协议端点（silent-check-sso 等）被 Googlebot 渲染发现后会进
    # GSC "Crawled - currently not indexed"，加 noindex 头让 Google 主动出索引
    add_header X-Robots-Tag "noindex" always;
    # keycloak 若未来在 realm 安全防御里配置了 XFO/CSP，同样会与上面的策略冲突，隐藏之
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Content-Security-Policy;

    # ============================================
    # S5（2026-09-12）：auth 页面静态壳 → SeaweedFS 桶 sites/auth/
    # （next build output:'export' → scripts/pipeline-stages.sh
    #   pipeline_publish_static_site auth auth out/zh/login.html）
    # 原 auth/middleware.ts 的等价物在 conf.d/auth.map.conf 与下方 if 正则：
    #   - 无前缀 canonical = zh：默认内部改写 /zh 前缀伺服（URL 不漂移）
    #   - 协商命中 en/zh-TW → 302 带前缀路径（与原 middleware 307 对齐）
    #   - /zh/* 直达请求 302 规整回无前缀（as-needed 语义）
    # /api/* 与 /avatars/*：/api/ 双跑期仍反代 Node auth（:3004），S5.4 切
    #   noda-api-prod:3004（Go authapi）；头像桶 sites/auth 同级的 avatars/ 前缀
    # 回滚：下方静态 location 换回 proxy_pass http://$auth_app_upstream 即回 SSR
    #   （noda-frontend-prod:3004 的 auth 进程仍在运行，常驻回滚锚点）。
    # ============================================

    # 根页：原 SSR [locale]/page.tsx 的 redirect('/login')（export 烤不出服务端跳转）
    location = / {
        return 302 /login;
    }

    # 无前缀页面（zh canonical）：协商 en/zh-TW → 302 带前缀；默认内部改写 /zh
    # ⚠️ $uri 判定不能进 map（rewrite last 重入不重算 map → 死循环 500），if 正则每轮重入重新求值
    location ~ ^/(login|register|callback|verify-email|forgot-password|reset-password|profile|settings)(/.*)?$ {
        if ($auth_locale = en) {
            return 302 /en$uri$is_args$args;
        }
        if ($auth_locale = zh-TW) {
            return 302 /zh-TW$uri$is_args$args;
        }
        rewrite ^(.*)$ /zh$1 last;
    }

    # 静态资产：一年 immutable
    location /_next/ {
        include /etc/nginx/snippets/seaweedfs-auth-static.conf;
    }
    location /images/ {
        include /etc/nginx/snippets/seaweedfs-auth-static.conf;
    }
    location = /favicon.ico {
        include /etc/nginx/snippets/seaweedfs-auth-static.conf;
    }
    location = /icon.svg {
        include /etc/nginx/snippets/seaweedfs-auth-static.conf;
    }
    location = /apple-icon.png {
        include /etc/nginx/snippets/seaweedfs-auth-static.conf;
    }

    # 头像（S5：Go authapi 写入桶 avatars/ 前缀，nginx 直读；DB 存相对路径不变）
    location /avatars/ {
        add_header Cache-Control $auth_cache_control always;
        include /etc/nginx/snippets/security-headers.conf;
        rewrite ^/avatars/(.*)$ /noda-static/avatars/$1 break;
        proxy_pass http://$seaweedfs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host "seaweedfs:8333";
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # 其余全部（/en/*、/zh-TW/* 带前缀页面、/404.html、/zh/* 302 规整、RSC .txt）
    location / {
        # as-needed：/zh 前缀直达请求 302 回 canonical（$request_uri 判定——内部
        # 改写保留原始 request_uri，不会误伤 /login→/zh/login 的内部改写）
        if ($request_uri ~ ^/zh(/.+)$) {
            return 302 $1;
        }
        add_header Cache-Control $auth_cache_control always;
        include /etc/nginx/snippets/seaweedfs-auth-static.conf;
        error_page 403 404 /404.html;
    }

    # P4 退役（2026-09-17）：前端认证面全量 GraphQL（BFF me/login/logout + 种 cookie）。
    # /api/auth/ 前缀全量代理 authapi（2026-10-07 多 Provider 登录：wechat/facebook/
    # apple/x 的 start/callback 与 google 同形；安全边界在 authapi——未注册 provider
    # 值 NoRoute 404，未配置键 307 回 login?error={id}_not_configured，nginx 只做转发）。
    # Google Console 注册的回调 = /api/auth/google/callback，不可断（本前缀内）。
    location /api/auth/ {
        limit_req zone=rl_auth burst=10 nodelay;      # 反爬限速（conf.d/ratelimit.conf）
        limit_req_status 429;
        set $rl_surface "auth-api";                   # 429 观测打标（conf.d/ratelimit.conf）
        proxy_pass http://$auth_api_upstream;
        include /etc/nginx/snippets/proxy-websocket.conf;
    }
    location /api/ {
        return 410 '{"error":"gone"}';
        add_header Content-Type application/json always;
    }

    # 自定义错误页
    error_page 502 503 /50x.html;
    location = /50x.html {
        root /etc/nginx/errors;
        internal;
    }
}

# ============================================
# Noda 主站（apex = nearby 升级上位，2026-10-24 一次性上线，spec §3）
# 原装 www 门面（桶 sites/www/）退役——www 301 表见下方 www.noda.co.nz 块；
# 法务页由 nearby 侧新增 [locale]/privacy|terms 承接（noda-apps T9）。
# 本块 = nearby 全套 location 组上位（自下方 nearby 子域块同构移植）：
#   页面 = 桶 sites/nearby/（as-needed：en 无前缀 canonical，zh/zh-TW 带前缀）、
#   /graphql BFF 同源反代、/api/nearby|user → nearbyapi、= /sitemap.xml →
#   nearbyapi 动态生成、= /geo.json IP→默认城市、item 深链 nearbyapi head 注入。
# 相对原 www 门面块的三条手术（实证）：
#   ① 删 /en 剥前缀 rewrite 两条（^/en/?$→/ 与 ^/en(/.*)$）——那是 www 烤根
#     结构（默认语言烤在根、桶内无 en/ 目录）的规整；nearby 的 /en/ 是真实
#     路由（桶内文件就在 /en/ 下），保留 = 英文站全断
#   ② /api/ P4 门面 410 → 改回 nearby-api 反代（/api/nearby/、/api/user/）
#   ③ absolute_redirect off / resolver / 变量 upstream 手法原样保留
# 回滚：整块换回 git 上一版 www 门面块 + nginx -t + 重建容器（30 分钟恢复现状）
# ============================================
server {
    include snippets/origin-gate.conf;
    listen 81;
    server_name noda.co.nz;

    # upstream 变量（Go API + SeaweedFS；$noda_api_upstream = noda-api-prod:3014）
    include /etc/nginx/snippets/upstream-apps.conf;
    include /etc/nginx/snippets/upstream-seaweedfs.conf;
    # 变量 upstream 需动态 DNS（docker 内嵌 DNS，容器重建自动刷新）
    include /etc/nginx/snippets/upstream-graphql.conf;
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 搜狗蜘蛛 403（2026-10-18 issue16，conf.d/botblock.map.conf）
    include /etc/nginx/snippets/bot-sogou-block.conf;

    # GraphQL BFF（同源反代：前端相对路径 /graphql；与 api.noda.co.nz 独立入口并存）
    location = /graphql {
        client_max_body_size 1m;          # GraphQL 查询体上限（防滥用第一道）
        limit_req zone=rl_graphql burst=30 nodelay;   # 反爬限速（conf.d/ratelimit.conf；#37 burst 20→30 无限滚动）
        limit_req_status 429;
        set $rl_surface "graphql";                    # 429 观测打标（conf.d/ratelimit.conf）
        proxy_pass http://$bff_upstream_prod;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_buffering off;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # 302 Location 保持相对路径（/zh、/zh-TW 协商 302）：nginx 默认绝对化会带
    # 内网端口 http://noda.co.nz:81/zh/（:81 经 CF 公网不可达 + scheme 误为 http；
    # www 门面时代 /en 301 泄漏 :81 同款教训，2026-09-30 实证）
    absolute_redirect off;

    # 尾斜杠归一（issue#31 D6/层D，2026-10-22）：canonical = 无斜杠（跟随
    # next.config trailingSlash:false），非根路径带尾斜杠一律 301 去斜杠。
    # server 级 rewrite 先于全部 location（归一先行），query 自动保留
    # （/places/?type=x → /places?type=x）。捕获组收尾排除斜杠（[^/]）：
    # /a// 等多尾斜杠形态不归一（防 301 到自身成环），维持现状落桶。
    # 替代原 = /zh/、= /zh-TW/ 两条 exact 301（2026-10-11 F5，已删——
    # 本条覆盖其全部命中面）。
    rewrite ^/(.+[^/])/$ /$1 permanent;

        # 旧 /places?{pool type} 深链 → 新分类路径（issue#31 层D；服务级 if+return
        # 为 rewrite 相安全用法——location 内 if+proxy_pass 与主内容处理器共存不接管，
        # 2026-10-23 复刻实证，改纯静态 map 直出 301）
        if ($nearby_places_301) {
            return 301 $nearby_places_301;
        }

    client_max_body_size 5M;

    # 安全头（/api/ 等非静态 location 依赖 server 级；静态 location 由 snippet 重注入）
    include /etc/nginx/snippets/security-headers.conf;

    # Gzip 压缩（桶代理返回的 HTML/JS/CSS 就地压缩）
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/x-javascript application/xml+rss
               application/json application/javascript
               image/svg+xml;

    # nearby API 反代（手术②：P4 门面 410 → 改回，2026-10 apex 接管）：
    # /api/nearby/*、/api/user/* → nearbyapi；其余 /api/* 维持 P4 410 退役面
    location /api/nearby/ {
        limit_req zone=rl_api burst=20 nodelay;       # 反爬限速（conf.d/ratelimit.conf）
        limit_req_status 429;
        set $rl_surface "nearby-api";                 # 429 观测打标（conf.d/ratelimit.conf）
        proxy_pass http://$noda_api_upstream;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_buffering off;
        proxy_set_header Connection "";
    }
    location /api/user/ {
        limit_req zone=rl_api burst=20 nodelay;       # 反爬限速（conf.d/ratelimit.conf）
        limit_req_status 429;
        set $rl_surface "nearby-api";                 # 429 观测打标（conf.d/ratelimit.conf）
        proxy_pass http://$noda_api_upstream;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_buffering off;
        proxy_set_header Connection "";
    }
    location /api/ {
        return 410 '{"error":"gone"}';
        add_header Content-Type application/json always;
    }

    # sitemap.xml + 分片（sitemapindex，#29②/#31 层B）→ nearbyapi 动态生成
    # （条目每日爬取新增，静态桶会冻结）
    location ~ ^/sitemap(?:-pages|-catalog|-items-[0-9]+)?\.xml$ {
        proxy_pass http://$noda_api_upstream;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    # IP→默认城市（前端无 noda_geo cookie 时的水合期兜底；变量与白名单见
    # conf.d/geoip2.map.conf）。private：响应随 CF-Connecting-IP 因人而异，
    # 只许浏览器私有缓存，禁共享缓存跨人复用；空串 = 不支持 → 前端回落奥克兰
    location = /geo.json {
        default_type application/json;
        add_header Cache-Control "private, max-age=300" always;
        return 200 '{"city":"$geo_city"}';
    }

    # RSC 载荷 .txt：桶内缺（未预渲染的 item 段）必须净 404（无 error_page），
    # 触发 Next 硬导航兜底。regex location 顺序敏感：必须先于下方 item 深链壳。
    location ~ \.txt$ {
        include /etc/nginx/snippets/seaweedfs-nearby-static.conf;
    }

    # 条目详情深链 /<loc>/item/<id> → nearbyapi 服务端 head 注入（2026-09-16 P1 SEO，
    # 自 nearby 子域块同构移植）：API 拉桶内 app-shell 壳 + 查条目 + 注入
    # title/og/canonical/hreflang/JSON-LD 整页返回——社交爬虫（不执行 JS）直接
    # 拿到条目级元数据。API 5xx/503（发版窗口）→ @named location 回退旧静态壳
    # 路径（client 自行取数渲染，即注入前行为）；命名位置必要：error_page 落 URI
    # 会重进本 location 造成代理循环。条目不存在/DB 故障由 API 侧原样回壳（200）。
    # proxy_cache stale-on-error（2026-10-16，配 conf.d/api-deep-cache.conf）：api
    # 不可达时回上一份注入完整页——裸壳全站同 title 无 canonical，Google 抓到即聚成
    # 千页重复簇（GSC "Duplicate without user-selected canonical" 验证失败根源，
    # class course 块同期同修）。
    location ~ ^/(en|zh|zh-TW)/item/[^/]+(/|$) {
        proxy_pass http://$noda_api_upstream;
        include /etc/nginx/snippets/proxy-common.conf;
        # API 主动返回的 502(桶不可达且无陈旧壳缓存)也要进兜底——默认只拦 nginx 自产网关错误
        proxy_intercept_errors on;
        proxy_cache api_deep;
        proxy_cache_valid 200 30m;
        proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status always;
        error_page 502 503 504 = @apex_item_static_shell;
    }
    location @apex_item_static_shell {
        include /etc/nginx/snippets/seaweedfs-nearby-static.conf;
        # 回退壳的条件请求剥离见 snippets/strip-conditional-get.conf 头注
        include /etc/nginx/snippets/strip-conditional-get.conf;
        # 冷缓存 + api 不可达的残余回退：通用壳不得进索引（同 class 块）
        add_header X-Robots-Tag "noindex, follow" always;
        error_page 403 404 =200 /$nearby_loc/item/app-shell.html;
    }

    # ── URL 架构 v2 模式路由面（issue#31 层D + 设计 D7，2026-10-22）──
    # nginx 只做「模式路由」：新详情/旧 URL 模式 → nearbyapi（3014），所有业务
    # 301 目标由 Go 查库/查静态数据生成（单跳，防 nginx map 与数据漂移）。
    # 列表/聚合页维持桶静态（末段约束 id12 形态，列表 URL 不命中）。HEAD 透传
    # 由 proxy 默认行为承担。curl 冒烟清单：noda-infra docs/notes-url-arch.md。
    # 常量源（noda-apps common/go/geo/districts_gen.go + geo.go）：七城
    # auckland|wellington|christchurch|hamilton|tauranga|queenstown|dunedin
    # + national 兜底（issue#31 §1 规则 7）；category25 = 四组分类 25 slug。

    # A1 城市树详情 → Go 动态壳/段强制 301（issue#31 §1：
    # /{loc}/{city}/places/{cat}/{slug}-{id12}、/{loc}/{city}/{events|news|deals}/
    # {slug}-{id12}；纯 id12 与无分类 places 形态也进 Go，由 Go 301 补全 canonical
    # 段）。末段形态二选一：slug-id12（[a-z0-9-]*-[0-9a-f]{12}）或整段 12hex。
    # 可选分类组挂在 places 段之后（places/{cat}/ 结构序）。
    # 列表页（/auckland/events、/auckland/places/markets 等）不命中 → 桶静态。
    # ⚠️ 正则含 {12} 量词，必须整体加双引号——nginx 词法在未引用 { 处截断
    location ~ "^/(?:en/|zh/|zh-TW/)?(?:auckland|wellington|christchurch|hamilton|tauranga|queenstown|dunedin|national)/(?:places(?:/(?:attractions|markets|camping|hidden-gems|national-parks))?|events|news|deals)/(?:[a-z0-9-]*-[0-9a-f]{12}|[0-9a-f]{12})$" {
        proxy_pass http://$noda_api_upstream;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    # A2 旧 URL → Go 301（迁移总表 issue#31 §2；目标由 Go 查库生成，单跳）：
    # ① 旧目录详情 /{loc}/(attractions|market|camping)/{slug}
    #    （无尾段列表页 /attractions /market /camping 仍走桶）
    location ~ ^/(?:en/|zh/|zh-TW/)?(?:attractions|market|camping)/[^/]+$ {
        proxy_pass http://$noda_api_upstream;
        include /etc/nginx/snippets/proxy-common.conf;
    }
    # ② event/place 全族（含裸 /event、/event/{sub}/{when}、/place/{sub}）
    #    （复数 /events 与 /places 不命中：place 后必须 / 或结尾）
    location ~ ^/(?:en/|zh/|zh-TW/)?(?:event|place)(?:/|$) {
        proxy_pass http://$noda_api_upstream;
        include /etc/nginx/snippets/proxy-common.conf;
    }
    # ②b 城市轴改造 S3/S4（2026-10-24）：退役单段代理 Go 301 大脑——场景页
    #    ×5（weekend/kids/free/outdoors/settle）+岛页 attractions/market。
    #    页面已不烘（桶 404），301 目标由 nearbyapi scenarioRedirects/
    #    islandRedirects 单一真源生成（与 ①③ 同代理模式，不建 nginx map 副本）。
    location ~ ^/(?:en/|zh/|zh-TW/)?(?:weekend|kids|free|outdoors|settle|attractions|market)$ {
        proxy_pass http://$noda_api_upstream;
        include /etc/nginx/snippets/proxy-common.conf;
    }
    # ③ news/deals 带子段（/news /deals 无参列表仍走桶）
    location ~ ^/(?:en/|zh/|zh-TW/)?(?:news|deals)/[^/]+$ {
        proxy_pass http://$noda_api_upstream;
        include /etc/nginx/snippets/proxy-common.conf;
    }
    # ④ 旧城市类型页 /{city}/(event|place)（URL 变更才走 Go 301：event→events、
    #    place→places/hidden-gems；news/deals 新城市列表同 URL，由桶静态页原地
    #    承接，代理给 Go 会同路径回环，故不路由——notes-url-arch.md「已知交互」）
    location ~ ^/(?:en/|zh/|zh-TW/)?(?:auckland|wellington|christchurch|hamilton|tauranga|queenstown|dunedin)/(?:event|place)$ {
        proxy_pass http://$noda_api_upstream;
        include /etc/nginx/snippets/proxy-common.conf;
    }
    # ⑤ 旧城市分类页 /{city}/{category25}（geo.go 四组 25 slug——event 族:
    #    family|market|music|sports|culture|food|free；place 族: playground|art|
    #    viewpoint|beach|garden|venues|recreation；news 族: policy|livelihood|
    #    transport|education|community|leisure；deal 族: grocery|homeware|
    #    electronics|fuel|other。分区页 slug（central/north-shore 等）与本集
    #    零重叠 → 城市分区页不受影响，仍走桶）
    location ~ ^/(?:en/|zh/|zh-TW/)?(?:auckland|wellington|christchurch|hamilton|tauranga|queenstown|dunedin)/(?:family|market|music|sports|culture|food|free|playground|art|viewpoint|beach|garden|venues|recreation|policy|livelihood|transport|education|community|leisure|grocery|homeware|electronics|fuel|other)$ {
        proxy_pass http://$noda_api_upstream;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    # 计划详情深链 /<loc>/plan/history/<gid> → 静态壳回填（2026-10-03 计划历史，
    # nearby 同构）：noindex 个人页无需 item 那套 API head 注入——直接静态伺服，
    # 404（gid 非桶内文件）=200 回 app-shell 占位壳 + client 取数渲染。
    location ~ ^/(en|zh|zh-TW)/plan/history/[^/]+(/|$) {
        include /etc/nginx/snippets/seaweedfs-nearby-static.conf;
        include /etc/nginx/snippets/strip-conditional-get.conf;
        error_page 403 404 =200 /$nearby_loc/plan/history/app-shell.html;
    }

    # 分享页深链 /<loc>/plan/share/<token> → 静态壳回填（noindex 公开只读页，同构）
    location ~ ^/(en|zh|zh-TW)/plan/share/[^/]+(/|$) {
        include /etc/nginx/snippets/seaweedfs-nearby-static.conf;
        include /etc/nginx/snippets/strip-conditional-get.conf;
        error_page 403 404 =200 /$nearby_loc/plan/share/app-shell.html;
    }

    # nearby 页脚内建链接收口（2026-10-10 B4 review 移交）：NodaFooter support 栏
    # Contact Us / Refund Policy 指向 main 域（= 本站），三语各发 /contact、
    # /zh/contact、/zh-TW/contact（refunds 同形）——apex 无对应内容路径，裸 404。
    # 处置与 www 门面表同口径（见下方 www.noda.co.nz 块）：/contact 变体 → 首页；
    # /refunds → 410（spec 决策：法务 refunds 页不迁 apex，站点级退役）。
    # regex 与 item/plan 深链无重叠，顺序无交互。
    location ~ ^/(?:en/|zh/|zh-TW/)?contact/?$ {
        return 301 https://noda.co.nz/;
    }
    location ~ ^/(?:en/|zh/|zh-TW/)?refunds/?$ {
        return 410;
    }
    # /sell → 410（snagme 退役路径；spec §4 冒烟口径=apex 直 410，www 门面表同款。
    # 2026-10-10 上线冒烟实证 apex 裸 404 补齐——404 可被复挂内容洗白，410=永久下线语义）
    location ~ ^/(?:en/|zh/|zh-TW/)?sell/?$ {
        return 410;
    }

    # 指南景点文 301 承接（issue #9，2026-10-15）：travel 分类 9 篇景点性质文章
    # 移交 /attractions 景点大分类，旧指南 URL 301 至对应语言景点页保 SEO。en 无
    # 前缀 canonical（/en/guide/… 旧链一并规整）；zh/zh-TW 用 named capture 保语言
    # 前缀拼接（⚠️ ${gloc} 必须 braces：位置捕获紧跟文字会被解析成整段变量名，
    # www 门面 privacy 首版实证）。regex 与 item/plan 深链及上方收口表无重叠，
    # 先于下方 location / 静态映射命中。9 slug 全集与 noda-apps issue #9 D9 清单一致。
    location ~ ^/(?:en/)?guide/(?:waipu-caves-free-glowworm|taupo-spa-park-free-hot-spring|enclosed-gardens-entry-fees|mt-eden-western-springs-free|te-papa-mt-victoria-free|lakeside-gardens-arrowtown-free|south-island-free-viewpoints|botanic-gardens-hagley-free|baldwin-street-peninsula-free)/?$ {
        return 301 https://noda.co.nz/attractions;
    }
    location ~ ^/(?<gloc>zh/|zh-TW/)?guide/(?:waipu-caves-free-glowworm|taupo-spa-park-free-hot-spring|enclosed-gardens-entry-fees|mt-eden-western-springs-free|te-papa-mt-victoria-free|lakeside-gardens-arrowtown-free|south-island-free-viewpoints|botanic-gardens-hagley-free|baldwin-street-peninsula-free)/?$ {
        return 301 https://noda.co.nz/${gloc}attractions;
    }

    # 静态站入口：locale 协商（等价 middleware，判定 map 见 nearby.map.conf）
    # （/zh/ 与 /zh-TW/ 的尾斜杠 301 已由上方 server 级归一 rewrite 承接，
    # 2026-10-22 URL 架构 v2，原两条 exact location 移除）

    # PWA manifest（issue13 未来1 A9，2026-10-17）：seaweedfs 对 .webmanifest
    # 扩展回 application/octet-stream，浏览器 installability 要求 manifest 专属
    # MIME——nginx 就地改写（regex 先于下方 location / 静态映射命中；根路径与
    # locale 前缀两形态都覆盖，canonical 引用为根路径无前缀）
    location ~* ^/(?:en/|zh/|zh-TW/)?manifest\.webmanifest$ {
        include /etc/nginx/snippets/seaweedfs-nearby-static.conf;
        proxy_hide_header Content-Type;
        add_header Content-Type "application/manifest+json" always;
    }

    location / {
        # 旧 ?type= 深链 301 类型路径（issue#10 D1；map 见 nearby.map.conf 尾部，
        # 须先于 locale 协商——协商 302 会保留 query 造成双跳）
        if ($nearby_type_redirect) {
            return 301 $nearby_type_redirect;
        }
        # /places（含 zh/zh-TW 前缀变体）带查询串 → Go 301 处理器（issue#31 层D
        # A2：?type= 等业务 301 收敛 Go，D7）。同样先于 locale 协商（302 保 query
        # 会双跳）。if 内仅 proxy_pass（if-安全用法；无 URI 部分原样转发带 query）。
        # 判定 map 见 nearby.map.conf 尾部 $nearby_places_args_go（$uri 派生 map
        # 的请求内缓存约束与安全性论证见该处注释）。
        # $loc="" = URI 已带前缀/是资产，直接静态伺服；set 取 map 值（请求头派生），
        # $uri 判定用 if 正则（每轮重入重新求值，内部改写 /en 后命中前缀正则清空
        # $loc，不会死循环——map $uri 版本因值缓存不重算会循环 500，liuyao 首版踩坑）
        set $loc $nearby_locale;
        if ($uri ~ "^/(en|zh|zh-TW)(/|$)") { set $loc ""; }
        if ($uri ~ "^/(_next|api|images|fonts)(/|$)") { set $loc ""; }
        if ($uri ~ "\.[A-Za-z0-9]+(/|$)") { set $loc ""; }
        # zh/zh-TW 协商命中无前缀页面 → 302 带前缀（相对 Location，absolute_redirect
        # off）；$nearby_redirect_path 把根路径目标收敛为 /zh 而非 /zh/（2026-10-11 F5，
        # 其余路径 $request_uri 原样拼接）
        if ($loc = zh-TW) { return 302 /zh-TW$nearby_redirect_path; }
        if ($loc = zh) { return 302 /zh$nearby_redirect_path; }
        # en（默认）→ 内部改写 /en 前缀进静态映射，URL 保持无前缀 canonical
        if ($loc = en) { rewrite ^(.*)$ /en$1 last; }
        include /etc/nginx/snippets/seaweedfs-nearby-static.conf;
        error_page 403 404 /404.html;
    }

    # 健康检查
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # 自定义错误页
    error_page 502 503 /50x.html;
    location = /50x.html {
        root /etc/nginx/errors;
        internal;
    }
}

# ============================================
# Admin Dashboard — 仅内网访问（/etc/hosts，不经过 Cloudflare）
# 三容器拆分：/api/admin/ → noda-api-prod:3011（$admin_api_upstream）
# ============================================
server {
    include snippets/origin-gate.conf;
    listen 81;
    server_name admin.noda.co.nz;

    # upstream 变量
    include /etc/nginx/snippets/upstream-apps.conf;
    include /etc/nginx/snippets/upstream-seaweedfs.conf;
    # 变量 upstream 需动态 DNS（docker 内嵌 DNS，容器重建自动刷新）
    include /etc/nginx/snippets/upstream-graphql.conf;
    resolver 127.0.0.11 valid=10s ipv6=off;

    # GraphQL BFF（同源反代：前端相对路径 /graphql；与 api.noda.co.nz 独立入口并存）
    location = /graphql {
        client_max_body_size 1m;          # GraphQL 查询体上限（防滥用第一道）
        limit_req zone=rl_graphql burst=30 nodelay;   # 反爬限速（conf.d/ratelimit.conf；#37 burst 20→30 无限滚动）
        limit_req_status 429;
        set $rl_surface "graphql";                    # 429 观测打标（conf.d/ratelimit.conf）
        proxy_pass http://$bff_upstream_prod;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_buffering off;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # 安全头
    include /etc/nginx/snippets/security-headers.conf;

    client_max_body_size 100M;

    # 302 Location 不绝对化（防内网 :81 端口泄漏进 Location，同 class 块教训）
    absolute_redirect off;

    # 后台不参与 SEO：显式全站 Disallow。桶内无 robots.txt 时缺失会被 Cloudflare
    # 托管 content-signal 前导码顶替（2026-09-20 线上实证），且后台本就不该被爬
    location = /robots.txt {
        access_log off;
        return 200 "User-Agent: *\nDisallow: /\n";
        add_header Content-Type text/plain;
    }

    # 误封哨兵数据端点（misban-watch.py cron */10 写 ops-logs/security-report/；本卷已挂
    # /var/log/rl429，watcher 每轮同步 page.html+report.json。只读静态，无应用鉴权
    # ——保护层=CF admin non-NZ challenge + robots 全站 Disallow）。
    # ⚠️ 前缀不可用 /security——会遮蔽 admin 应用自身的 /security 路由（误封哨兵
    # UI 页，2026-10-26），静态数据端点让路改名 /security-report/。
    # 无尾斜杠 301 归一（location 前缀含斜杠，裸路径会落进下方静态壳 404）
    location = /security-report {
        return 301 /security-report/;
    }
    location ^~ /security-report/ {
        alias /var/log/rl429/security-report/;
        index page.html;
        add_header Cache-Control "no-cache" always;
    }

    # P4 退役（2026-09-17）：admin 看板全量迁 BFF GraphQL（adminSnagme* workbench/
    # tail/radar/history/runs/listing + adminUsers/adminCronServices/adminAudit 等）
    location /api/ {
        return 410 '{"error":"gone"}';
        add_header Content-Type application/json always;
    }

    # 2026-09-12 S2：Admin CSR 静态壳 → SeaweedFS 桶 sites/admin/
    # （回滚：三个静态 location 换回 proxy_pass http://$admin_upstream 即回 SSR）
    # .txt（RSC 载荷）单独代理：已预渲染路由的 .txt 桶内存在正常伺服；未预渲染
    # 路由（如 /cronjobs/<real>）的 .txt 干净 404——触发 Next 路由器硬导航兜底，
    # 落到下方 error_page 壳页（若被 =200 壳 HTML 冒充 RSC 数据，软导航会解析失败）
    location ~ \.txt$ {
        include /etc/nginx/snippets/seaweedfs-admin-static.conf;
    }

    # regex 顺序敏感：.txt > snagme 详情深链 > 两级 cronjobs 深链 > 单级 cronjobs
    location ~ ^/snagme/listing/[^/]+(/|$) {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/seaweedfs-admin-static.conf;
        # 条件请求剥离见 snippets/strip-conditional-get.conf 头注（深链壳 304×error_page=200 → 空 200 白页）
        include /etc/nginx/snippets/strip-conditional-get.conf;
        error_page 403 404 =200 /snagme/listing/app-shell.html;
    }

    location ~ ^/cronjobs/[^/]+/[^/]+(/|$) {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/seaweedfs-admin-static.conf;
        # 条件请求剥离见 snippets/strip-conditional-get.conf 头注（深链壳 304×error_page=200 → 空 200 白页）
        include /etc/nginx/snippets/strip-conditional-get.conf;
        error_page 403 404 =200 /cronjobs/app-shell/app-shell.html;
    }

    location ~ ^/cronjobs/ {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/seaweedfs-admin-static.conf;
        # 条件请求剥离见 snippets/strip-conditional-get.conf 头注（深链壳 304×error_page=200 → 空 200 白页）
        include /etc/nginx/snippets/strip-conditional-get.conf;
        error_page 403 404 =200 /cronjobs/app-shell.html;
    }

    # 根页 302（等价原 SSR page.tsx 的 redirect('/dashboard')；export 模式下
    # 服务端 redirect 烤不出跳转，改由 nginx 承担——未登录时 /dashboard 由
    # AuthProvider 渲染登录 UI，行为与 SSR 时代一致）
    location = / {
        return 302 /dashboard;
    }

    # 静态资产：一年 immutable（浏览器与内网客户端）
    location /_next/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/seaweedfs-admin-static.conf;
    }

    # HTML 与其余文件
    location / {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/seaweedfs-admin-static.conf;
        error_page 403 404 /404.html;
    }
}


# ============================================
# 六爻站 — 整站下线 410（2026-10-24 apex 上线，T10 纯净退役）
# 决策（spec §1 决策人批复①）：snagme/liuyao 整站下线 + 410 纯净；DB 全保留
# （divinations 17 条），T11 归档移仓后仓内不再部署本站。
# 原 S3 静态壳全套（桶 sites/liuyao/ + locale 协商 + /s/<token> 深链壳 +
# = /api/webhooks/stripe Stripe 回调）随块退役；liuyao.map.conf 语言协商
# map 已随 2026-10-10 v2 清算删除（G2 落地）。
# 410（非 404/301）：永久下线语义，搜索索引出清快；preprod 同步见
# config/nginx/liuyao-local.conf liuyao-preprod 块（同改 410）。
# ============================================
server {
    include snippets/origin-gate.conf;
    listen 81;
    server_name liuyao.noda.co.nz;
    return 410;
}

# ============================================
# Nearby 子域 — HTML 面 301 到 apex（2026-10-24 nearby 升 apex，spec §3）
# apex（noda.co.nz，上方块）接管全套 nearby location 组；本子域不再伺服
# 页面——HTML/静态/深链/robots/sitemap 整站保路径 301 到 apex（三语路由、
# /<loc>/item/<id> 注入页在 apex 等位）。用 301（非 302）：SEO 信号合并
# 到 apex canonical。API 面留驻（spec §3）：
#   - /graphql BFF 同源反代原样保留（老书签/客户端直连子域不断）
#   - /api/ 维持 P4 410 语义原样保留
# preprod 验证场（nearby-preprod，liuyao-local.conf）不受本变更影响。
# ============================================
server {
    include snippets/origin-gate.conf;
    listen 81;
    server_name nearby.noda.co.nz;

    # 变量 upstream 需动态 DNS（docker 内嵌 DNS，容器重建自动刷新）
    include /etc/nginx/snippets/upstream-graphql.conf;
    resolver 127.0.0.11 valid=10s ipv6=off;

    # GraphQL BFF（同源反代：前端相对路径 /graphql；与 api.noda.co.nz 独立入口并存）
    location = /graphql {
        client_max_body_size 1m;          # GraphQL 查询体上限（防滥用第一道）
        limit_req zone=rl_graphql burst=30 nodelay;   # 反爬限速（conf.d/ratelimit.conf；#37 burst 20→30 无限滚动）
        limit_req_status 429;
        set $rl_surface "graphql";                    # 429 观测打标（conf.d/ratelimit.conf）
        proxy_pass http://$bff_upstream_prod;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_buffering off;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # /api/：P4 410 语义原样保留（API 域留驻面）
    location /api/ {
        return 410 '{"error":"gone"}';
        add_header Content-Type application/json always;
    }

    # HTML/静态/深链/robots/sitemap：整站保路径 301 apex
    location / {
        return 301 https://noda.co.nz$request_uri;
    }

    # 健康检查
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}

# ============================================
# Snagme — 整站下线 410（2026-10-24 apex 上线，T10 纯净退役）
# 决策（spec §1 决策人批复①）：snagme/liuyao 整站下线 + 410 纯净；DB 全保留
# （snagme 全表），T11 归档移仓后仓内不再部署本站。Trade Me 暴露面随站下线。
# 原产品站全套（桶 sites/snagme/ + deals/report 深链壳 + TradeMe 图片代理 +
# Resend webhook）随块退役；snagme.map.conf 语言协商 map 已随 2026-10-10 v2
# 清算删除（G2 落地）。admin 看板（/api/snagme/ 数据面在 admin 域）保留冻结
# 只读视图不受影响（spec §8）。preprod 同步见 liuyao-local.conf snagme-preprod 块。
# ============================================
server {
    include snippets/origin-gate.conf;
    listen 81;
    server_name snagme.noda.co.nz;
    return 410;
}


# ============================================
# www.noda.co.nz — 门面退役 301 表（2026-10-24 apex 上线，spec §3）
# 不变量保持：www → apex 301（原 catch-all 语义不变，保路径）。表内特例：
#   /privacy /terms（含三语/尾斜杠变体）→ apex 新法务页（nearby 侧
#     [locale]/privacy|terms，as-needed：en 无前缀 canonical）
#   /refunds /sell → 410 纯净（refunds 法务页不迁；sell 无承接内容）
#   /guides/* /contact（含三语变体）→ apex 首页（无对应内容路径）
# www 为 trailingSlash 站点且 en 烤在根：规则同时覆盖带/不带尾斜杠与 /en
# 前缀旧链；其余一切路径（含 /、/zh、/zh-TW 首页）走兜底 301 保路径——
# apex 三语路由等位（/zh → apex /zh 三语首页即"对应内容路径"）。
# ============================================
server {
    include snippets/origin-gate.conf;
    listen 81;
    server_name www.noda.co.nz;

    # 法务页 → apex 新法务页（/en 前缀旧链规整到无前缀 canonical；zh/zh-TW 保语言。
    # ⚠️ 拼接用 named capture + ${}：位置捕获 $1 紧跟文字会被解析成整段变量名，
    # ${1} braces 形式则不被 nginx 支持（unknown "1" variable，nginx -t 实证））
    location ~ ^/(?:en/)?privacy/?$ {
        return 301 https://noda.co.nz/privacy;
    }
    location ~ ^/(?<wwwloc>zh/|zh-TW/)?privacy/?$ {
        return 301 https://noda.co.nz/${wwwloc}privacy;
    }
    location ~ ^/(?:en/)?terms/?$ {
        return 301 https://noda.co.nz/terms;
    }
    location ~ ^/(?<wwwloc>zh/|zh-TW/)?terms/?$ {
        return 301 https://noda.co.nz/${wwwloc}terms;
    }

    # 已下线内容 → 410 纯净（www/web 的 refunds 页不迁移；sell 无承接路由）
    location ~ ^/(?:en/|zh/|zh-TW/)?refunds/?$ {
        return 410;
    }
    location ~ ^/(?:en/|zh/|zh-TW/)?sell/?$ {
        return 410;
    }

    # guides（整段含子路径）与 contact：apex 无对应内容路径 → 首页
    location ~ ^/(?:en/|zh/|zh-TW/)?guides(/|$) {
        return 301 https://noda.co.nz/;
    }
    location ~ ^/(?:en/|zh/|zh-TW/)?contact/?$ {
        return 301 https://noda.co.nz/;
    }

    # 兜底：/、/en、/zh、/zh-TW 与其余全部 www 路径 → 保路径 301 apex
    # （原「www.noda.co.nz → 301 → noda.co.nz」不变量，语义零变化）
    location / {
        return 301 https://noda.co.nz$request_uri;
    }
}

# ============================================
# 评论服务（comment 产品）— Prod
# Cloudflare Tunnel 终止 TLS 后以 HTTP 进 :81——:81 必须直接代理，
# 不能 301 回 https（隧道重进还是 :81 → 自指死循环：
# GSC "Redirect error" + 线上评论组件全坏）
# S5：前端（admin 占位页）= 桶 sites/comment/；API :3012 = Go commentapi
#（独立模块 comment/api）。双跑期 /api/ 仍指 Node，S5.4 切 upstream 变量值即可。
# ============================================
server {
    include snippets/origin-gate.conf;
    listen 81;
    server_name comments.noda.co.nz;

    # $comment_upstream：双跑期 → noda-frontend-prod:3012（Node），S5.4 改 noda-api-prod:3012
    include /etc/nginx/snippets/upstream-apps.conf;
    include /etc/nginx/snippets/upstream-seaweedfs.conf;
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 302 Location 不绝对化（/ → /admin 跳转防 :81 泄漏，同 auth 块）
    absolute_redirect off;

    client_max_body_size 10M;

    include /etc/nginx/snippets/security-headers.conf;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    # 评论后端不参与 SEO
    add_header X-Robots-Tag "noindex" always;

    # 显式全站 Disallow（桶内无 robots.txt 时缺失会被 Cloudflare 托管
    # content-signal 前导码顶替——2026-09-20 线上实证；评论后端本就不该被爬）
    location = /robots.txt {
        access_log off;
        return 200 "User-Agent: *\nDisallow: /\n";
        add_header Content-Type text/plain;
    }

    # admin 占位页入口（桶内无根 index）
    location = / {
        return 302 /admin;
    }

    # RSC .txt：桶内缺对象必须净 404（Next 软导航兜底，同 class 块）
    location ~ \.txt$ {
        include /etc/nginx/snippets/seaweedfs-comment-static.conf;
    }

    # 静态资产
    location /_next/ {
        include /etc/nginx/snippets/seaweedfs-comment-static.conf;
    }

    # 页面与其余
    location / {
        include /etc/nginx/snippets/seaweedfs-comment-static.conf;
        error_page 403 404 /404.html;
    }

    # API：双跑期仍指 Node :3012；S5.4 切 Go commentapi 只改 $comment_upstream 值
    location /api/ {
        proxy_pass http://$comment_upstream;
        include /etc/nginx/snippets/proxy-common.conf;
    }
}
server {
    include snippets/origin-gate.conf;
    listen 443 ssl;
    server_name comments.noda.co.nz;

    ssl_certificate /etc/nginx/ssl/noda.dev.crt;
    ssl_certificate_key /etc/nginx/ssl/noda.dev.key;

    include /etc/nginx/snippets/upstream-apps.conf;
    include /etc/nginx/snippets/upstream-seaweedfs.conf;
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 302 Location 不绝对化（/ → /admin 跳转防 :81 泄漏，同 auth 块）
    absolute_redirect off;

    client_max_body_size 10M;

    include /etc/nginx/snippets/security-headers.conf;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header X-Robots-Tag "noindex" always;

    location = / {
        return 302 /admin;
    }

    location ~ \.txt$ {
        include /etc/nginx/snippets/seaweedfs-comment-static.conf;
    }

    location /_next/ {
        include /etc/nginx/snippets/seaweedfs-comment-static.conf;
    }

    location / {
        include /etc/nginx/snippets/seaweedfs-comment-static.conf;
        error_page 403 404 /404.html;
    }

    location /api/ {
        proxy_pass http://$comment_upstream;
        include /etc/nginx/snippets/proxy-common.conf;
    }
}

# ============================================
# api.noda.co.nz — GraphQL BFF（统一接口层；spec 2026-09-16 graphql-bff-grpc-design）
# 只暴露 /graphql + /healthz。CORS 由 BFF Go 侧 cors() 统一处理（白名单回显 +
# Allow-Credentials），nginx 纯代理不叠加 CORS 头（重复头会被浏览器拒绝）。
# ============================================
server {
    include snippets/origin-gate.conf;
    listen 81;
    server_name api.noda.co.nz;

    include /etc/nginx/snippets/upstream-graphql.conf;
    # 变量 upstream 需动态 DNS（docker 内嵌 DNS，容器重建自动刷新）
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /healthz {
        proxy_pass http://$bff_upstream_prod;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_buffering off;
        proxy_set_header Connection "";
    }

    location = /graphql {
        client_max_body_size 1m;          # GraphQL 查询体上限（防滥用第一道）
        limit_req zone=rl_graphql burst=30 nodelay;   # 反爬限速（conf.d/ratelimit.conf；#37 burst 20→30 无限滚动）
        limit_req_status 429;
        set $rl_surface "graphql";                    # 429 观测打标（conf.d/ratelimit.conf）
        proxy_pass http://$bff_upstream_prod;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_buffering off;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location = /playground {
        proxy_pass http://$bff_upstream_prod;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_buffering off;
        proxy_set_header Connection "";
    }

    location / { return 404; }
}

# ============================================
# shuotong.wang — 说通个人站（SvelteKit adapter-static 纯静态，2026-10-11 WS4）
# Cloudflare Tunnel 终止 TLS 后以 HTTP 进 :81（同其他静态站，不可 301 回 https）
# 桶：noda-static/sites/shuotong/（Jenkins shuotong-wang job 经
#     pipeline_publish_product shuotong 发布；server_name 含 www——两个 hostname
#     同服务一块，canonical 由站点页面自指 apex 承担）
# ============================================
server {
    include snippets/origin-gate.conf;
    listen 81;
    server_name shuotong.wang www.shuotong.wang;

    # $seaweedfs_upstream 变量（SeaweedFS S3）；变量 upstream 需动态 DNS
    include /etc/nginx/snippets/upstream-seaweedfs.conf;
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 302 Location 不绝对化（绝对化会带内网 :81，经 CF 公网不可达——apex 块同教训）
    absolute_redirect off;

    # 安全头（静态 location 由 snippet 重注入；此处覆盖 /health 等）
    include /etc/nginx/snippets/security-headers.conf;

    # Gzip 压缩（桶代理返回的 HTML/JS/CSS 就地压缩；precompress 的 .gz/.br
    # 发布前已剔除，r4s nginx 无 gzip_static/brotli_static）
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/x-javascript application/xml+rss
               application/json application/javascript
               image/svg+xml;

    # 健康检查（CF Tunnel/监控探针；无反代依赖，直接 200）
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # 静态站入口（SvelteKit 平铺 .html 布局，映射与缓存头见 snippet）
    location / {
        include /etc/nginx/snippets/seaweedfs-shuotong-static.conf;
    }

    # 上游网关错误页（桶不可达/超时；404 由 snippet 内 intercept 净 404 承担）
    error_page 502 503 /50x.html;
    location = /50x.html {
        root /etc/nginx/errors;
        internal;
    }
}

# ============================================
# 评论服务（comment 产品）— Pre-prod
# S5：前端 = 桶 sites/comment/；API 双跑期仍指 preprod Node :3012
# ============================================
server {
