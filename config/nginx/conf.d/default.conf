    # $preprod_comments_upstream：双跑期 → preprod-noda-frontend:3012，S5.4 改 preprod-noda-api:3012
    include /etc/nginx/snippets/upstream-preprod.conf;
    include /etc/nginx/snippets/upstream-seaweedfs.conf;
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 302 Location 不绝对化（/ → /admin 跳转防 :81 泄漏，同 auth 块）
