# ============================================
# Pre-prod: Auth — /etc/hosts 访问 (HTTP)
# ============================================
server {
    include snippets/origin-gate.conf;
    listen 80;
    server_name auth.noda.test;
    return 301 https://$host$request_uri;
}
server {
    include snippets/origin-gate.conf;
    listen 443 ssl;
    server_name auth.noda.test;

    ssl_certificate /etc/nginx/ssl/noda.dev.crt;
    ssl_certificate_key /etc/nginx/ssl/noda.dev.key;

    include /etc/nginx/snippets/upstream-preprod.conf;
    # S5 静态壳（与 prod auth 块同构）：auth 页面切桶，/api/ 双跑期仍指 preprod Node
    include /etc/nginx/snippets/upstream-seaweedfs.conf;
    resolver 127.0.0.11 valid=10s ipv6=off;

    add_header X-Noda-Environment "preprod" always;
    include /etc/nginx/snippets/security-headers.conf;
    add_header X-Frame-Options "ALLOW-FROM https://noda.test" always;
    add_header Content-Security-Policy "frame-ancestors 'self' https://class.noda.test:8443;" always;

    client_max_body_size 100M;

    # 根页：export 烤不出服务端跳转，nginx 承担（同 prod auth 块）
    location = / {
        return 302 /login;
    }

    # 无前缀页面（zh canonical）：协商 en/zh-TW → 302；默认内部改写 /zh
    location ~ ^/(login|register|callback|verify-email|forgot-password|reset-password|profile|settings)(/.*)?$ {
        if ($auth_locale = en) {
            return 302 /en$uri$is_args$args;
        }
        if ($auth_locale = zh-TW) {
            return 302 /zh-TW$uri$is_args$args;
        }
        rewrite ^(.*)$ /zh$1 last;
    }

    # 静态资产
    location /_next/ {
        include /etc/nginx/snippets/seaweedfs-auth-static.conf;
    }
    location /images/ {
        include /etc/nginx/snippets/seaweedfs-auth-static.conf;
    }
    location = /favicon.ico {
        include /etc/nginx/snippets/seaweedfs-auth-static.conf;
    }
    location = /icon.svg {
        include /etc/nginx/snippets/seaweedfs-auth-static.conf;
    }
    location = /apple-icon.png {
        include /etc/nginx/snippets/seaweedfs-auth-static.conf;
    }

    # 头像（Go authapi 写桶 avatars/ 前缀）
    location /avatars/ {
        add_header Cache-Control $auth_cache_control always;
        include /etc/nginx/snippets/security-headers.conf;
        rewrite ^/avatars/(.*)$ /noda-static/avatars/$1 break;
        proxy_pass http://$seaweedfs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host "seaweedfs:8333";
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # 其余全部（带前缀页面、/404.html、/zh/* 302 规整、RSC .txt）
    location / {
        if ($request_uri ~ ^/zh(/.+)$) {
            return 302 $1;
        }
        add_header Cache-Control $auth_cache_control always;
        include /etc/nginx/snippets/seaweedfs-auth-static.conf;
        error_page 403 404 /404.html;
    }

    # /api/* 双跑期仍指 preprod Node auth（S5.4 切 Go authapi：upstream 变量改值）
    location /api/ {
        proxy_pass http://$preprod_auth_app_upstream;
        include /etc/nginx/snippets/proxy-websocket.conf;
    }

    error_page 502 503 /50x.html;
    location = /50x.html {
        root /etc/nginx/errors;
        internal;
    }
}

# ============================================
# Pre-prod: Noda 官网 — /etc/hosts 访问 (HTTPS)
# 三容器拆分：www 静态站由 static 容器本地 root 伺服
# （镜像内烘焙的是 prod 构建产物；原 $preprod_www_upstream 已删除）
# ============================================
server {
    include snippets/origin-gate.conf;
    listen 80;
    server_name www.noda.test;
    return 301 https://$host$request_uri;
}
server {
    include snippets/origin-gate.conf;
    listen 443 ssl;
    server_name www.noda.test;

    ssl_certificate /etc/nginx/ssl/noda.dev.crt;
    ssl_certificate_key /etc/nginx/ssl/noda.dev.key;

    add_header X-Noda-Environment "preprod" always;
    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/x-javascript application/xml+rss
               application/json application/javascript
               image/svg+xml;

    root /var/www/noda.co.nz;

    # 带内容哈希的静态资源：一年 immutable
    location /_next/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header X-Noda-Environment "preprod" always;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # HTML：no-cache 强制 revalidate
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header X-Noda-Environment "preprod" always;
        try_files $uri $uri/ $uri/index.html =404;
        add_header Cache-Control "no-cache";
    }

    error_page 502 503 /50x.html;
    location = /50x.html {
        root /etc/nginx/errors;
        internal;
    }
}

# ============================================
# Pre-prod: apex 演练位（noda.test）— 2026-10-24 apex 上线本地演练（spec §7.2）
# 照新 prod apex 拓扑（nearby 升 apex）的 preprod 同构版：stg 桶
# sites/nearby/ 伺服 + preprod-noda-api:3014（nearbyapi）+ $bff_upstream_preprod。
# 用途：nginx -t + curl 冒烟清单（/、/en、/zh、item 深链、/graphql、
# /sitemap.xml、/geo.json、robots）本地先过——/etc/hosts noda.test → 本机。
# dev 证书自签、不经 CF，与 prod :81 形态差异仅 TLS 终止层。
# 注意：本块仅 *.noda.test 演练域（r4s static 容器 :443）——Mac preprod 的
# 真实验证场是 liuyao-local.conf 的 nearby-preprod 块（拓扑同构，保持可用）。
# ============================================
server {
    include snippets/origin-gate.conf;
    listen 80;
    server_name noda.test;
    return 301 https://$host$request_uri;
}
server {
    include snippets/origin-gate.conf;
    listen 443 ssl;
    server_name noda.test;

    ssl_certificate /etc/nginx/ssl/noda.dev.crt;
    ssl_certificate_key /etc/nginx/ssl/noda.dev.key;

    include /etc/nginx/snippets/upstream-seaweedfs.conf;
    include /etc/nginx/snippets/upstream-graphql.conf;
    resolver 127.0.0.11 valid=10s ipv6=off;

    # nearbyapi（preprod-noda-api:3014）——set 变量做 lazy 解析（变量 upstream
    # 手法，同 upstream-class.conf）：字面量 hostname 会在 nginx -t（部署预检/
    # 裸 docker run，DNS 无 preprod 容器名）时被急切解析直接 emerg；变量经
    # resolver 运行时解析，预检可过（upstream-preprod.conf 无 nearby 变量且其
    # 内容由 pipeline _preprod_upstream_content 模板再生，不在此追加）。
    set $preprod_nearby_api_upstream preprod-noda-api:3014;

    # 302 Location 保持相对路径（locale 协商 302；同 prod apex 块手法）
    absolute_redirect off;

    # 尾斜杠归一（issue#31 D6，同 prod apex 块；归一先行，query 保留）
    rewrite ^/(.+[^/])/$ /$1 permanent;

        # 旧 /places?{pool type} 深链 → 新分类路径（issue#31 层D；服务级 if+return
        # 为 rewrite 相安全用法——location 内 if+proxy_pass 与主内容处理器共存不接管，
        # 2026-10-23 复刻实证，改纯静态 map 直出 301）
        if ($nearby_places_301) {
            return 301 $nearby_places_301;
        }

    client_max_body_size 5M;

    add_header X-Noda-Environment "preprod" always;
    include /etc/nginx/snippets/security-headers.conf;
    # 演练域不参与 SEO
    add_header X-Robots-Tag "noindex" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/x-javascript application/xml+rss
               application/json application/javascript
               image/svg+xml;

    # GraphQL BFF（同源反代，preprod BFF）
    location = /graphql {
        client_max_body_size 1m;          # GraphQL 查询体上限（防滥用第一道）
        proxy_pass http://$bff_upstream_preprod;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_buffering off;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # nearby API 反代（与 prod apex 块同构：/api/nearby|user → nearbyapi，其余 410）
    location /api/nearby/ {
        proxy_pass http://$preprod_nearby_api_upstream;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_buffering off;
        proxy_set_header Connection "";
    }
    location /api/user/ {
        proxy_pass http://$preprod_nearby_api_upstream;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_buffering off;
        proxy_set_header Connection "";
    }
    location /api/ {
        return 410 '{"error":"gone"}';
        add_header Content-Type application/json always;
    }

    # sitemap.xml + 分片 → nearbyapi 动态生成（与 prod apex 块同构）
    location ~ ^/sitemap(?:-pages|-catalog|-items-[0-9]+)?\.xml$ {
        proxy_pass http://$preprod_nearby_api_upstream;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    # IP→默认城市（geoip 变量见 conf.d/geoip2.map.conf；preprod 直连无 CF 头，
    # X-Real-IP 回退——本机 IP 库内查无 → 空串 → 前端回落默认城）
    location = /geo.json {
        default_type application/json;
        add_header Cache-Control "private, max-age=300" always;
        return 200 '{"city":"$geo_city"}';
    }

    # RSC 载荷 .txt：净 404 触发硬导航（先于 item 深链壳，regex 顺序敏感）
    location ~ \.txt$ {
        include /etc/nginx/snippets/seaweedfs-nearby-static-stg.conf;
    }

    # 条目详情深链 → nearbyapi head 注入（与 prod apex 块同构，preprod 全域
    # noindex 语义由上方 server 级 X-Robots-Tag 承担）
    location ~ ^/(en|zh|zh-TW)/item/[^/]+(/|$) {
        proxy_pass http://$preprod_nearby_api_upstream;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_intercept_errors on;
        error_page 502 503 504 = @apex_test_item_static_shell;
    }
    location @apex_test_item_static_shell {
        include /etc/nginx/snippets/seaweedfs-nearby-static-stg.conf;
        include /etc/nginx/snippets/strip-conditional-get.conf;
        error_page 403 404 =200 /$nearby_loc/item/app-shell.html;
    }

    # ── URL 架构 v2 模式路由面（issue#31 层D，同 prod apex 块同构镜像；
    # 正则与常量注释见 prod 块，冒烟清单 docs/notes-url-arch.md）──
    # A1 城市树详情（末段 slug-id12 或纯 id12）→ Go（结构序与常量注释见 prod 块）
    location ~ "^/(?:en/|zh/|zh-TW/)?(?:auckland|wellington|christchurch|hamilton|tauranga|queenstown|dunedin|national)/(?:places(?:/(?:attractions|markets|camping|hidden-gems|national-parks))?|events|news|deals)/(?:[a-z0-9-]*-[0-9a-f]{12}|[0-9a-f]{12})$" {
        proxy_pass http://$preprod_nearby_api_upstream;
        include /etc/nginx/snippets/proxy-common.conf;
    }
    # A2-① 旧目录详情 /{loc}/(attractions|market|camping)/{slug}
    location ~ ^/(?:en/|zh/|zh-TW/)?(?:attractions|market|camping)/[^/]+$ {
        proxy_pass http://$preprod_nearby_api_upstream;
        include /etc/nginx/snippets/proxy-common.conf;
    }
    # A2-② event/place 全族（含裸段与子路径）
    location ~ ^/(?:en/|zh/|zh-TW/)?(?:event|place)(?:/|$) {
        proxy_pass http://$preprod_nearby_api_upstream;
        include /etc/nginx/snippets/proxy-common.conf;
    }
    # A2-③ news/deals 带子段
    location ~ ^/(?:en/|zh/|zh-TW/)?(?:news|deals)/[^/]+$ {
        proxy_pass http://$preprod_nearby_api_upstream;
        include /etc/nginx/snippets/proxy-common.conf;
    }
    # A2-④ 旧城市类型页 /{city}/(event|place|news|deals)
    location ~ ^/(?:en/|zh/|zh-TW/)?(?:auckland|wellington|christchurch|hamilton|tauranga|queenstown|dunedin)/(?:event|place)$ {
        proxy_pass http://$preprod_nearby_api_upstream;
        include /etc/nginx/snippets/proxy-common.conf;
    }
    # A2-⑤ 旧城市分类页 /{city}/{category25}（geo.go 四组 25 slug 全集）
    location ~ ^/(?:en/|zh/|zh-TW/)?(?:auckland|wellington|christchurch|hamilton|tauranga|queenstown|dunedin)/(?:family|market|music|sports|culture|food|free|playground|art|viewpoint|beach|garden|venues|recreation|policy|livelihood|transport|education|community|leisure|grocery|homeware|electronics|fuel|other)$ {
        proxy_pass http://$preprod_nearby_api_upstream;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    # 计划详情/分享深链 → 静态壳回填（与 prod apex 块同构）
    location ~ ^/(en|zh|zh-TW)/plan/history/[^/]+(/|$) {
        include /etc/nginx/snippets/seaweedfs-nearby-static-stg.conf;
        include /etc/nginx/snippets/strip-conditional-get.conf;
        error_page 403 404 =200 /$nearby_loc/plan/history/app-shell.html;
    }
    location ~ ^/(en|zh|zh-TW)/plan/share/[^/]+(/|$) {
        include /etc/nginx/snippets/seaweedfs-nearby-static-stg.conf;
        include /etc/nginx/snippets/strip-conditional-get.conf;
        error_page 403 404 =200 /$nearby_loc/plan/share/app-shell.html;
    }

    # nearby 页脚内建链接收口（与 prod apex 块同构，2026-10-10 B4 review 移交）：
    # /contact（三语变体）→ 首页；/refunds → 410（处置与 www 门面表同口径）
    location ~ ^/(?:en/|zh/|zh-TW/)?contact/?$ {
        return 301 https://noda.co.nz/;
    }
    location ~ ^/(?:en/|zh/|zh-TW/)?refunds/?$ {
        return 410;
    }

    # 静态站入口：locale 协商（as-needed 同 prod apex 块；map 见 nearby.map.conf）
    location / {
        # /places 带查询串 → Go 301 处理器（issue#31 层D A2，同 prod apex 块；
        # 先于 locale 协商防 302 保 query 双跳）
        set $loc $nearby_locale;
        if ($uri ~ "^/(en|zh|zh-TW)(/|$)") { set $loc ""; }
        if ($uri ~ "^/(_next|api|images|fonts)(/|$)") { set $loc ""; }
        if ($uri ~ "\.[A-Za-z0-9]+(/|$)") { set $loc ""; }
        if ($loc = zh-TW) { return 302 /zh-TW$request_uri; }
        if ($loc = zh) { return 302 /zh$request_uri; }
        if ($loc = en) { rewrite ^(.*)$ /en$1 last; }
        include /etc/nginx/snippets/seaweedfs-nearby-static-stg.conf;
        error_page 403 404 /404.html;
    }

    location = /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    error_page 502 503 /50x.html;
    location = /50x.html {
        root /etc/nginx/errors;
        internal;
    }
}

# ============================================
# Pre-prod: Admin Dashboard — /etc/hosts 访问 (HTTPS)
# ============================================
server {
    include snippets/origin-gate.conf;
    listen 80;
    server_name admin.noda.test;
    return 301 https://$host$request_uri;
}
server {
    include snippets/origin-gate.conf;
    listen 443 ssl;
    server_name admin.noda.test;

    ssl_certificate /etc/nginx/ssl/noda.dev.crt;
    ssl_certificate_key /etc/nginx/ssl/noda.dev.key;

    include /etc/nginx/snippets/upstream-preprod.conf;

    add_header X-Noda-Environment "preprod" always;
    include /etc/nginx/snippets/security-headers.conf;

    client_max_body_size 100M;

    location /api/admin/ {
        proxy_pass http://$preprod_admin_api_upstream;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://$preprod_admin_upstream;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_buffering off;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

