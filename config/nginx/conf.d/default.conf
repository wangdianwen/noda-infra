# ============================================
# Pre-prod: Auth — /etc/hosts 访问 (HTTP)
# ============================================
server {
    listen 80;
    server_name auth.noda.test;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name auth.noda.test;

    ssl_certificate /etc/nginx/ssl/noda.dev.crt;
    ssl_certificate_key /etc/nginx/ssl/noda.dev.key;

    include /etc/nginx/snippets/upstream-preprod.conf;
    # S5 静态壳（与 prod auth 块同构）：auth 页面切桶，/api/ 双跑期仍指 preprod Node
    include /etc/nginx/snippets/upstream-seaweedfs.conf;
    resolver 127.0.0.11 valid=10s ipv6=off;

    add_header X-Noda-Environment "preprod" always;
    include /etc/nginx/snippets/security-headers.conf;
    add_header X-Frame-Options "ALLOW-FROM https://class.noda.test" always;
    add_header Content-Security-Policy "frame-ancestors 'self' https://class.noda.test:8443;" always;

    client_max_body_size 100M;

    # 根页：export 烤不出服务端跳转，nginx 承担（同 prod auth 块）
    location = / {
        return 302 /login;
    }

    # 无前缀页面（zh canonical）：协商 en/zh-TW → 302；默认内部改写 /zh
    location ~ ^/(login|register|callback|verify-email|forgot-password|reset-password|profile|settings)(/.*)?$ {
        if ($auth_locale = en) {
            return 302 /en$uri$is_args$args;
        }
        if ($auth_locale = zh-TW) {
            return 302 /zh-TW$uri$is_args$args;
        }
        rewrite ^(.*)$ /zh$1 last;
    }

    # 静态资产
    location /_next/ {
        include /etc/nginx/snippets/seaweedfs-auth-static.conf;
    }
    location /images/ {
        include /etc/nginx/snippets/seaweedfs-auth-static.conf;
    }
    location = /favicon.ico {
        include /etc/nginx/snippets/seaweedfs-auth-static.conf;
    }
    location = /icon.svg {
        include /etc/nginx/snippets/seaweedfs-auth-static.conf;
    }
    location = /apple-icon.png {
        include /etc/nginx/snippets/seaweedfs-auth-static.conf;
    }

    # 头像（Go authapi 写桶 avatars/ 前缀）
    location /avatars/ {
        add_header Cache-Control $auth_cache_control always;
        include /etc/nginx/snippets/security-headers.conf;
        rewrite ^/avatars/(.*)$ /noda-static/avatars/$1 break;
        proxy_pass http://$seaweedfs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host "seaweedfs:8333";
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # 其余全部（带前缀页面、/404.html、/zh/* 302 规整、RSC .txt）
    location / {
        if ($request_uri ~ ^/zh(/.+)$) {
            return 302 $1;
        }
        add_header Cache-Control $auth_cache_control always;
        include /etc/nginx/snippets/seaweedfs-auth-static.conf;
        error_page 403 404 /404.html;
    }

    # /api/* 双跑期仍指 preprod Node auth（S5.4 切 Go authapi：upstream 变量改值）
    location /api/ {
        proxy_pass http://$preprod_auth_app_upstream;
        include /etc/nginx/snippets/proxy-websocket.conf;
    }

    error_page 502 503 /50x.html;
    location = /50x.html {
        root /etc/nginx/errors;
        internal;
    }
}

