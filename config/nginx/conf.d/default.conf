# 动态设置转发协议和端口（Cloudflare TLS 终止，内部 HTTP）
map $host $forwarded_proto {
    default $scheme;
    class.noda.co.nz "https";
    auth.noda.co.nz "https";
    noda.co.nz "https";
    www.noda.co.nz "https";
    comments.noda.co.nz "https";
}

map $host $forwarded_port {
    default $server_port;
    class.noda.co.nz "443";
    auth.noda.co.nz "443";
    noda.co.nz "443";
    www.noda.co.nz "443";
}

# ============================================
# Auth 服务域名 — 用户页面 → Auth App，API → Keycloak
# ============================================
server {
    listen 81;
    server_name auth.noda.co.nz noda-infra-nginx;

    # upstream 变量（使用 resolver 动态 DNS，容器重建后自动刷新）
    include /etc/nginx/snippets/upstream-class.conf;
    include /etc/nginx/snippets/upstream-keycloak.conf;

    # 客户端最大请求体大小
    client_max_body_size 100M;

    # 安全头：auth 域专用——不使用 security-headers.conf 片段，因为该片段的
    # X-Frame-Options: SAMEORIGIN 在 XFO 与 CSP frame-ancestors 并存时优先生效，
    # 会拦死各应用对 Keycloak 端点的 iframe 嵌入（3p-cookies 探测 + silent
    # check-sso），导致登录回跳后 keycloak-js 兑换 code 前 init 直接挂死。
    # 帧嵌入策略由下方 CSP frame-ancestors 显式 allowlist 管控。
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # frame-ancestors 必须包含各 preprod 应用源：preprod auth/class/liuyao 应用
    # 经 iframe 加载 Keycloak 静默端点（3p-cookies 探测 + silent check-sso），
    # 缺源会被浏览器拦截 → keycloak-js init 超时 → 应用恒判未认证。
    # https://noda.co.nz（prod 官网）同理：www 的 keycloak-js 登录回跳要挂
    # 3p-cookies 探测 iframe，漏源会导致兑换 code 前被 CSP 掐死、登录态永远建不起来
    add_header Content-Security-Policy "frame-ancestors 'self' https://noda.co.nz https://class.noda.co.nz https://class-preprod.noda.co.nz https://liuyao.noda.co.nz https://liuyao-preprod.noda.co.nz https://auth-preprod.noda.co.nz https://www-preprod.noda.co.nz https://admin.noda.co.nz https://admin-preprod.noda.co.nz https://localhost:3001 https://localhost:3006;" always;
    # auth 域不参与 SEO：Keycloak 协议端点（silent-check-sso 等）被 Googlebot 渲染发现后会进
    # GSC "Crawled - currently not indexed"，加 noindex 头让 Google 主动出索引
    add_header X-Robots-Tag "noindex" always;
    # keycloak 若未来在 realm 安全防御里配置了 XFO/CSP，同样会与上面的策略冲突，隐藏之
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Content-Security-Policy;

    # Auth App 用户页面（Next.js）
    location = / {
        proxy_pass http://$auth_app_upstream;
        include /etc/nginx/snippets/proxy-websocket.conf;
    }
    location /login {
        proxy_pass http://$auth_app_upstream;
        include /etc/nginx/snippets/proxy-websocket.conf;
    }
    location /register {
        proxy_pass http://$auth_app_upstream;
        include /etc/nginx/snippets/proxy-websocket.conf;
    }
    location /callback {
        proxy_pass http://$auth_app_upstream;
        include /etc/nginx/snippets/proxy-websocket.conf;
    }
    location /verify-email {
        proxy_pass http://$auth_app_upstream;
        include /etc/nginx/snippets/proxy-websocket.conf;
    }
    location /forgot-password {
        proxy_pass http://$auth_app_upstream;
        include /etc/nginx/snippets/proxy-websocket.conf;
    }
    location /reset-password {
        proxy_pass http://$auth_app_upstream;
        include /etc/nginx/snippets/proxy-websocket.conf;
    }
    location /profile {
        proxy_pass http://$auth_app_upstream;
        include /etc/nginx/snippets/proxy-websocket.conf;
    }
    location /settings {
        proxy_pass http://$auth_app_upstream;
        include /etc/nginx/snippets/proxy-websocket.conf;
    }
    # locale-prefixed routes (next-intl /zh/* and /en/*)
    location ~ ^/(zh|zh-TW|en)(/(login|register|callback|verify-email|forgot-password|reset-password|profile|settings))?$ {
        proxy_pass http://$auth_app_upstream;
        include /etc/nginx/snippets/proxy-websocket.conf;
    }
    location /_next/ {
        proxy_pass http://$auth_app_upstream;
        include /etc/nginx/snippets/proxy-websocket.conf;
    }
    location /favicon.ico {
        proxy_pass http://$auth_app_upstream;
        include /etc/nginx/snippets/proxy-websocket.conf;
    }
    location /api/ {
        proxy_pass http://$auth_app_upstream;
        include /etc/nginx/snippets/proxy-websocket.conf;
    }
    # Auth App 静态资源（illustrations, favicon 等）
    location /images/ {
        proxy_pass http://$auth_app_upstream;
        include /etc/nginx/snippets/proxy-websocket.conf;
    }

    # Keycloak silent check-sso 回调页：keycloak-js 经 iframe 加载并 postMessage
    # 回父页（packages/auth AuthProvider 用 silent-check-sso.html，auth 应用
    # 遗留代码用 silent-sso.html）。必须直达应用根——此前落入下方 Keycloak
    # 兜底返回 404，auth 应用无法静默恢复 SSO 会话（登录回跳后恒判未认证）。
    location = /silent-check-sso.html {
        proxy_pass http://$auth_app_upstream;
        include /etc/nginx/snippets/proxy-websocket.conf;
    }
    location = /silent-sso.html {
        proxy_pass http://$auth_app_upstream;
        include /etc/nginx/snippets/proxy-websocket.conf;
    }

    # 2026-09 auth 迁移：Keycloak 下线——原 /resources/ 与 KC 兜底 location / 删除，
    # 全部流量直达 Auth App（:3004）。回滚可恢复 include upstream-keycloak.conf。
    location / {
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_timeout 5s;
        proxy_next_upstream_tries 2;
        proxy_pass http://$auth_app_upstream;
        include /etc/nginx/snippets/proxy-websocket.conf;
    }

    # 自定义错误页
    error_page 502 503 /50x.html;
    location = /50x.html {
        root /etc/nginx/errors;
        internal;
    }
}

# ============================================
# Noda 官网 — 静态文件（代理到 noda-apps:3002）
# ============================================
server {
    listen 81;
    server_name noda.co.nz;

    # upstream 变量
    include /etc/nginx/snippets/upstream-class.conf;

    # 安全头
    include /etc/nginx/snippets/security-headers.conf;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/x-javascript application/xml+rss
               application/json application/javascript
               image/svg+xml;

    # 代理到静态文件服务器
    location / {
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_timeout 5s;
        proxy_next_upstream_tries 2;
        proxy_pass http://$www_upstream;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    # 自定义错误页
    error_page 502 503 /50x.html;
    location = /50x.html {
        root /etc/nginx/errors;
        internal;
    }
}

# ============================================
# Admin Dashboard — 仅内网访问（/etc/hosts，不经过 Cloudflare）
# ============================================
server {
    listen 81;
    server_name admin.noda.co.nz;

    # upstream 变量
    include /etc/nginx/snippets/upstream-class.conf;

    # 安全头
    include /etc/nginx/snippets/security-headers.conf;

    client_max_body_size 100M;

    # Admin Hono API
    location /api/admin/ {
        proxy_pass http://$admin_api_upstream;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_read_timeout 120s;
    }

    # Admin Next.js 前端
    location / {
        proxy_pass http://$admin_upstream;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_buffering off;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

# ============================================
# Class 应用 — Next.js SSR（代理到 noda-apps:3000）
# ============================================
server {
    listen 81;
    server_name localhost class.noda.co.nz;

    # upstream 变量
    include /etc/nginx/snippets/upstream-class.conf;

    # 客户端最大请求体大小
    client_max_body_size 100M;

    # 安全头
    include /etc/nginx/snippets/security-headers.conf;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/x-javascript application/xml+rss
               application/json application/javascript
               image/svg+xml;

    # 管理 API — 仅允许内部访问，外网返回 403
    location /api/admin/ {
        return 403 '{"error":"forbidden"}';
        add_header Content-Type application/json always;
    }

    # 所有请求代理到 SSR 容器（API + SSR 渲染 + 静态文件）
    location / {
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_timeout 5s;
        proxy_next_upstream_tries 2;
        proxy_pass http://$class_upstream;
        include /etc/nginx/snippets/proxy-common.conf;

        # SSR Streaming 支持 (Next.js RSC streaming)
        proxy_buffering off;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 健康检查
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # 自定义错误页
    error_page 502 503 /50x.html;
    location = /50x.html {
        root /etc/nginx/errors;
        internal;
    }
}

# ============================================
# 六爻站 — Prod（此前无 server block，请求误落 auth 应用）
# ============================================
server {
    listen 81;
    server_name liuyao.noda.co.nz;

    # upstream 变量
    include /etc/nginx/snippets/upstream-class.conf;

    client_max_body_size 10M;

    # 安全头
    include /etc/nginx/snippets/security-headers.conf;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/x-javascript application/xml+rss
               application/json application/javascript
               image/svg+xml;

    location / {
        proxy_pass http://$liuyao_upstream;
        include /etc/nginx/snippets/proxy-common.conf;
        # SSE 流式（起卦推送）：关闭 buffering，长超时
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        chunked_transfer_encoding on;
    }

    # 健康检查
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}

# ============================================
# 旧域名 findclass.noda.co.nz — 301 到 class.noda.co.nz
# （SEO 修复：恢复 NXDOMAIN 断链，信号合并到正式域名）
# ============================================
server {
    listen 81;
    server_name findclass.noda.co.nz;
    return 301 https://class.noda.co.nz$request_uri;
}

# ============================================
# www.noda.co.nz — 301 到主域 noda.co.nz
# （SEO 修复：canonical/sitemap 均指向主域，
#   www 重复服务导致 GSC 报 Alternative page with proper canonical tag）
# ============================================
server {
    listen 81;
    server_name www.noda.co.nz;
    return 301 https://noda.co.nz$request_uri;
}

# ============================================
# Remark42 评论服务 — Prod
# Cloudflare Tunnel 终止 TLS 后以 HTTP 进 :81——:81 必须直接代理，
# 不能 301 回 https（隧道重进还是 :81 → 自指死循环：
# GSC "Redirect error" + 线上评论组件全坏）
# ============================================
server {
    listen 81;
    server_name comments.noda.co.nz;

    include /etc/nginx/snippets/upstream-remark42.conf;

    client_max_body_size 10M;

    include /etc/nginx/snippets/security-headers.conf;
    add_header Content-Security-Policy "frame-ancestors 'self' https://class.noda.co.nz https://class.noda.test:8443" always;
    # 评论后端不参与 SEO
    add_header X-Robots-Tag "noindex" always;

    location / {
        proxy_pass http://$remark42_upstream;
        include /etc/nginx/snippets/proxy-common.conf;
    }
}
server {
    listen 443 ssl;
    server_name comments.noda.co.nz;

    ssl_certificate /etc/nginx/ssl/noda.dev.crt;
    ssl_certificate_key /etc/nginx/ssl/noda.dev.key;

    include /etc/nginx/snippets/upstream-remark42.conf;

    client_max_body_size 10M;

    include /etc/nginx/snippets/security-headers.conf;
    add_header Content-Security-Policy "frame-ancestors 'self' https://class.noda.co.nz https://class.noda.test:8443" always;
    add_header X-Robots-Tag "noindex" always;

    location / {
        proxy_pass http://$remark42_upstream;
        include /etc/nginx/snippets/proxy-common.conf;
    }
}

