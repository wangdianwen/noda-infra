# ============================================
# 反爬限速（2026-10-17 bot-hardening，防机器人抓取）
# 定位：源站防线——CF 边缘（Block AI Bots / WAF / 边缘限速）之外的兜底，
#   兜住绕过边缘规则的流量。所有公网流量经 cloudflared 隧道进本 nginx。
#
# key 设计（与 geoip2.map.conf $geoip_lookup_ip 同一结论）：
#   CF-Connecting-IP 优先——CF 边缘强制覆写、隧道下无法经 CF 伪造；
#   X-Real-IP 回退（direct/preprod 形态即真实客户端）。
#   nginx 语义：key 为空的请求不计入限速——两处天然豁免：
#     ① 内网健康检查（无 CF 头、无 X-Real-IP）
#     ② e2e 回归套件密钥头（x-noda-rl-bypass 值与 noda-apps/e2e
#        playwright.config.ts extraHTTPHeaders 同值，双仓私有）——
#        prod 全量回归单 IP 并发会顶爆人均阈值，密钥头豁免保回归畅通
#   注：nginx map 的 default 值引用其他 map 变量（$geoip_lookup_ip）是
#     运行时惰性求值，与 conf.d 加载顺序无关。
#
# 阈值依据（首版保守，观察 Security Events / nginx 429 日志后调）：
#   rl_graphql 60r/m：移动 App 单屏并发 3-6 查询 + NZ Starlink CGNAT 多人
#     共 IP 是常态 → burst 20 nodelay 吸尖峰；抓取者按 100r/s 轰 → 429
#   rl_api    120r/m：apex /api/nearby/、/api/user/（REST 读，密度更高）
#   rl_auth    30r/m：登录/注册/回调——撞库限速（Turnstile 上线前的过渡防线）
#   不限：HTML/深链/静态资产——①CF 边缘已缓存 ②item 深链是 Googlebot
#     高频抓取面（nginx 无法验真 Googlebot，限了伤 SEO）③share 页社媒分享
#     不允许出现挑战/429。
# ============================================

# 限速 key：密钥头命中 → 置空（不计速）；否则用真实访客 IP
map $http_x_noda_rl_bypass $rl_key {
    default       $rl_owner_key;
    "0d5ba87e1fbc8e084a1584610ee387ce114002a71c810ae5" "";
}

# 站主 IP 白名单（2026-10-17）：维护侧自己的出口 IP（本机 curl 调试接口、
# 同 IP 浏览验证）不应被限速连坐——key 置空即不计速（nginx 语义）。
# ⚠️ 经 Cloudflare 边缘，判定值 = CF-Connecting-IP（与 geoip2.map.conf 的
# $geoip_lookup_ip 同一结论）；IP 漂移（换宽带/换 VPN 出口）时此条失效，
# 重新探测后在此追加即可。
map $geoip_lookup_ip $rl_owner_key {
    default         $geoip_lookup_ip;
    "47.72.103.104" "";
}

# 计数 zone：10m ≈ 16 万 IP 状态，单 nginx 实例共享
limit_req_zone $rl_key zone=rl_graphql:10m rate=60r/m;
limit_req_zone $rl_key zone=rl_api:10m rate=120r/m;
limit_req_zone $rl_key zone=rl_auth:10m rate=30r/m;

# 超限拒绝默认按 429（客户端可识别"限流"而非 5xx 故障）；
# 日志降 warn（默认 error 级别会淹没 error.log）
limit_req_log_level warn;

# ============================================
# 429 观测面（2026-10-17 bot-hardening 阶段 2 monitoring）
# 限速仍生效后才有 429——此 access_log 条件命中极稀（实际上限=真正的
# 抓取工具/Bug 重试环），写卷成本可忽略。每行 JSON 记录：真实访客 IP
# （CF-Connecting-IP，限速 key）、命中面（$rl_surface，default.conf 各
# 限速 location 注入）、方法/URI/UA、豁免标记。
# 消费方两条（同宿主 bind 目录 /opt/noda/noda-infra/docker/volumes/ops-logs）：
#   ① r4s 宿主 cron rl429-alert.sh（deploy/ 存档，crontab-r4s-host 注册）——
#      10 分钟聚合，单 IP×面 20 次/窗起 TG 告警（复用 telegram-alert.sh 通道）
#   ② noda-api-prod RO 挂载 /ops-logs → adminapi GET /api/admin/ratelimit/overview
#      → BFF adminRatelimitOverview → admin dashboard /ratelimit 卡片
# 文件路径 /var/log/rl429/rl429.log：镜像已 bake 目录（preprod 等无 bind 形态
# 落容器 FS 兜底，nginx 启动不 emerg）；git clean -e docker/volumes/ 不波及。
# ============================================

# status→429 布尔（access_log if= 条件；escape=json 保证 UA safestring）
map $status $is_429 { default 0; "429" 1; }
# 豁免头存在即 1（聚合侧可剔除 e2e 流量噪声；豁免请求本就不会 429，双保险）
map $http_x_noda_rl_bypass $rl_exempt { "" 0; default 1; }

log_format rl_json escape=json '{"ts":"$time_iso8601","ip":"$http_cf_connecting_ip","surface":"$rl_surface","m":"$request_method","u":"$request_uri","st":$status,"exempt":$rl_exempt,"ua":"$http_user_agent"}';
access_log /var/log/rl429/rl429.log rl_json if=$is_429;
