# ============================================
# GeoIP2——IP → 城市（nearby 首页默认城市兜底；其余站点不消费，零开销）
# 数据: /etc/nginx/geo/dbip-city-lite.mmdb——DB-IP City Lite，CC BY 4.0
#   免注册直链（无 MaxMind 账号），构建期下载烘焙进 noda-static 镜像；
#   数据随镜像固化，月度重建镜像（noda-infra job SERVICE=nginx）即刷新
# 模块: ngx_http_geoip2_module（nginx.conf 顶部 load_module）
#
# 真实 IP 取值（与 Go 侧 httpx.ClientIP 同一结论，见 common/go/httpx）:
#   生产 cloudflared 隧道下 $remote_addr 恒为隧道容器 IP，对所有访客相同，
#   不能用于查库；CF-Connecting-IP 由 CF 边缘强制覆写、无法经 CF 伪造。
#   本方 nginx 注入的 X-Real-IP 作回退（direct/preprod 形态即真实客户端）。
#   两者皆缺（内网健康检查等）→ 查库输入为空 → 变量全空串 → 回落默认城。
#
# 城市白名单: 按行政区（subdivisions 0）英文名映射而非 city 名——DBIP 的
#   city 名很脏（奥克兰拆 Auckland/Manukau City/"Auckland (Grafton)" 等）。
#   DBIP Lite 的 subdivisions 无 iso_code 字段，只有 names.en，实测大区名：
#     "Auckland" / "Wellington Region" / "Canterbury"（GeoNames 命名，前缀
#     匹配兼容变体；NZ 各大区名互不构成前缀冲突）
#     NZ-AUK 奥克兰大区 → auckland
#     NZ-WGN 惠灵顿大区 → wellington
#     NZ-CAN 坎特伯雷大区 → christchurch（大区 ⊃ 基督城，默认城市粒度可接受）
#   非 NZ / 白名单外（如 Otago 但尼丁）/ 查无 → 空串 → 前端回落奥克兰·全部
# ============================================

# 查库 IP：CF-Connecting-IP 优先，缺省回退 X-Real-IP
map $http_cf_connecting_ip $geoip_lookup_ip {
    default $http_cf_connecting_ip;
    ''      $http_x_real_ip;
}

geoip2 /etc/nginx/geo/dbip-city-lite.mmdb {
    $geoip2_country_iso source=$geoip_lookup_ip country iso_code;
    $geoip2_region_name source=$geoip_lookup_ip subdivisions 0 names en;
}

# "国家/行政区" 拼串单点判定：country 必须是 NZ 才进白名单（防境外同名区）
map "$geoip2_country_iso/$geoip2_region_name" $geo_city {
    default          "";
    "~^NZ/Auckland"  auckland;
    "~^NZ/Wellington" wellington;
    "~^NZ/Canterbury" christchurch;
}
