# ============================================
# CDN 对象存储反代（SeaweedFS Phase 2, 2026-09-12）
# ============================================
# 读路径：浏览器 → Cloudflare（边缘缓存 7 天）→ cloudflared tunnel → 本文件
#   → proxy_pass seaweedfs:8333/<bucket>/<key>（S3 path-style GET）
# 对象元数据带 Cache-Control（上传脚本写入：UI 素材 7 天，crawled 内容寻址 1 年
# immutable），源站头透传给 Cloudflare 作为共享缓存指令。
# cdn-preprod 占位 server 块已删（2026-09-12 Wave 4）：该域名纯本地、DNS 不经隧道，
#   preprod 前端在 NEXT_PUBLIC_CDN_URL 生效前走 staticUrl 本地回退，不依赖此域名。

include /etc/nginx/conf.d/cdn.map.conf;

# --------------------------------------------
# cdn.noda.co.nz — prod 桶 noda-static
# --------------------------------------------
server {
    listen 81;
    server_name cdn.noda.co.nz;

    # upstream 变量（snippets 内 set 指令仅允许 server/location 上下文）
    include /etc/nginx/snippets/upstream-seaweedfs.conf;
    # docker 内嵌 DNS（与 upstream-keycloak 等 snippet 同约定）
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 健康检查：cdn.conf 按字母序先于 default.conf 载入 → 本块成为 81 端口默认
    # server，compose 的 wget /health 由此块应答（否则容器会被判 unhealthy）
    location = /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # 健康检查：对桶发一个 HEAD（匿名可读 → 200/404 都证明存储可达）
    location = /cdn-health {
        access_log off;
        proxy_pass http://$seaweedfs_upstream/noda-static/;
    }

    location / {
        # /<key> → /noda-static/<key>（path-style S3 GET，无鉴权头，匿名只读）
        rewrite ^(.*)$ /noda-static$1 break;
        proxy_pass http://$seaweedfs_upstream;
        proxy_http_version 1.1;

        # 覆盖 Host：SeaweedFS 会把带域名的 Host 误判为 virtual-host 桶名 → 400
        proxy_set_header Host "seaweedfs:8333";
        proxy_set_header Connection "";

        # 源站 Cache-Control 原样透传（Cloudflare 共享缓存依赖它）
        proxy_pass_header Cache-Control;
        # SeaweedFS 内部头不外泄
        proxy_hide_header X-Weed-Message;
        proxy_hide_header Server;

        # 公共只读资产：允许任意来源跨域读取（字体等需要 CORS 的资源受益）
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        # SeaweedFS 不回显存储的 Cache-Control——按前缀注入（见 cdn.map.conf）
        add_header Cache-Control $cdn_cache_control always;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}

# cdn-preprod.noda.co.nz 占位 server 块已删（2026-09-12 Wave 4）：域名纯本地、DNS 不经隧道，
# preprod 前端在 NEXT_PUBLIC_CDN_URL 生效前走 staticUrl 本地回退，不依赖此域名；
# preprod 托管位置定案后如需恢复，见 git 历史。
