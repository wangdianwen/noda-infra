# ============================================
# CDN 静态根直读（2026-11-02 本地文件系统迁移，noda-infra#8 P3）
# ============================================
# 读路径：浏览器 → Cloudflare（边缘缓存 7 天）→ cloudflared tunnel → 本文件
#   → root /var/noda-static/cdn 直读（顶层 nearby/… avatars/…）
# 原 SeaweedFS 桶代理（path-style S3 GET /noda-static/<key>，Phase 2 2026-09-12
# 起）随迁移退役，/<key> → /var/noda-static/cdn/<key> 映射语义不变；S3 版历史
# 可 git revert。
# Cache-Control 仍按前缀注入（cdn.map.conf：UI 素材 7 天，crawled 内容寻址
# 1 年 immutable），Cloudflare 共享缓存依赖它。
# cdn-preprod 占位 server 块已删（2026-09-12 Wave 4）：该域名纯本地、DNS 不经隧道，
#   preprod 前端在 NEXT_PUBLIC_CDN_URL 生效前走 staticUrl 本地回退，不依赖此域名。

include /etc/nginx/conf.d/cdn.map.conf;

# --------------------------------------------
# cdn.noda.co.nz — 本地静态根 cdn/ 子树
# --------------------------------------------
server {
    include snippets/origin-gate.conf;
    listen 81;
    server_name cdn.noda.co.nz;

    # upstream 变量（snippets 内 set 指令仅允许 server/location 上下文）；
    # 本块已无 $seaweedfs_upstream 消费方，P4 清理时摘
    include /etc/nginx/snippets/upstream-seaweedfs.conf;
    # docker 内嵌 DNS（与 upstream-keycloak 等 snippet 同约定）
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 健康检查：cdn.conf 按字母序先于 default.conf 载入 → 本块成为 81 端口默认
    # server，compose 的 wget /health 由此块应答（否则容器会被判 unhealthy）
    location = /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # 健康检查：本地直答（原「对桶发一个 HEAD」探活随 S3 退役；容器在跑 =
    #   根可读，nginx 对缺失 root 的 open() 失败会直接反映在 location / 的 404 上）
    location = /cdn-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        # /<key> → /var/noda-static/cdn/<key>（cdn/ 顶层即 nearby/… avatars/…，
        # 无 rewrite——URI 自然映射；缺文件 =404）
        root /var/noda-static/cdn;
        try_files $uri =404;

        # 公共只读资产：允许任意来源跨域读取（字体等需要 CORS 的资源受益）
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        # Cache-Control 按前缀注入（见 cdn.map.conf）
        add_header Cache-Control $cdn_cache_control always;
    }
}

# cdn-preprod.noda.co.nz 占位 server 块已删（2026-09-12 Wave 4）：域名纯本地、DNS 不经隧道，
# preprod 前端在 NEXT_PUBLIC_CDN_URL 生效前走 staticUrl 本地回退，不依赖此域名；
# preprod 托管位置定案后如需恢复，见 git 历史。
