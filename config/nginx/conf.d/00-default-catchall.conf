# catch-all / default_server（2026-11-08 安全 review 固化）：
# 只允许按域名经 Cloudflare（隧道/边缘）进入；IP 直访、伪造 Host、裸 SNI 一律拒。
# 文件名 00- 前缀保证在 conf.d include 字母序中最先加载，显式 default_server
# 抢占各端口隐式默认（原隐式默认是文件序第一个业务块，伪造 Host 会落进业务块）。
# 注意：8181 故意不加——internal-shells.conf（server_name _）是 8181 的合法
# catch-all（noda-api 经 STATIC_SHELL_BASE_URL=http://noda-static-prod:8181 拉壳页，
# Host=容器名，try_files $uri =404 已无毒）。

# 80：未匹配任何域名（IP 直访/伪造 Host）→ 444 静默断开，不给重定向探测面
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

# 81：CF 隧道入口（prod）。伪造 Host / 容器外直连落 444，不再落第一个业务块
server {
    listen 81 default_server;
    server_name _;
    return 444;
}

# 443：证书嗅探 / SNI=IP / 无 SNI → TLS 握手层直接拒绝（不返回证书与 HTTP 响应，
# 防止借默认块行为探测源站，也防证书链泄露）。需 nginx ≥ 1.19.4（镜像 1.27.5）。
server {
    listen 443 ssl default_server;
    ssl_reject_handshake on;
}
