# ============================================
# 本机 Mac preprod nginx 配（liuyao 专用）
# ============================================
# 独立配置，不依赖 upstream-preprod.conf（那是给 r4s 用的）
# 直接 proxy_pass 到 compose service name:port

# resolver for dynamic container DNS
resolver 127.0.0.11 valid=10s;

# ── HTTP → HTTPS 重定向 ──
server {
    listen 80;
    server_name liuyao.noda.test localhost;

    # ACME challenge passthrough (if ever needed)
    location /.well-known/acme-challenge/ {
        root /etc/nginx/ssl;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS (self-signed *.noda.test cert) ──
server {
    listen 443 ssl;
    server_name liuyao.noda.test localhost;

    ssl_certificate /etc/nginx/ssl/noda.dev.crt;
    ssl_certificate_key /etc/nginx/ssl/noda.dev.key;

    client_max_body_size 10M;

    # liuyao-web (Next.js standalone, port 3005)
    # /api/* 通过 Next.js rewrites 内部代理到 3007
    location / {
        proxy_pass http://noda-apps:3005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式：关闭 buffering，长超时
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;

        # WebSocket support (Next.js HMR in dev)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
