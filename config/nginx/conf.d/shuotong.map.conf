# shuotong.wang 静态站 Cache-Control 映射（http 上下文，随 conf.d/*.conf 载入，2026-10-11 WS4）
# SvelteKit adapter-static 纯静态站；SeaweedFS S3 GET 不回显对象 Cache-Control（同
# nearby.map.conf/class.map.conf）——nginx 注入，CF 边缘与浏览器共用该指令。
#
# /_app/immutable/* 内容哈希寻址（SvelteKit 构建产物）→ 一年 immutable；
# /_app/version.json 随每次发布变化 → 落 default no-cache（不进 immutable，
# 否则客户端一年内读到旧版本号影响 SW/启动路由决策）；
# /images/* 站点图片（无内容哈希、低频变更）→ 一天共享缓存，变更次日生效；
# 其余（HTML/robots.txt/sitemap.xml）→ no-cache（发布即刻生效）。
# ⚠️ 用 $request_uri（原始请求）——add_header 求值时 $uri 已被 snippet 的
# rewrite 改写为 /noda-static/sites/shuotong/<key>，$uri 判定永不命中。
# ⚠️ 刻意不带 always：4xx（部署窗口期 chunk 未就绪的 404 等）不得带一年
# immutable，否则浏览器负缓存毒化该 chunk 一年、刷新无效（2026-09-22 实证）。
map $request_uri $shuotong_cache_control {
    "~^/_app/immutable/"  "public, max-age=31536000, immutable";
    "~^/images/"          "public, max-age=86400";
    default               "no-cache";
}
