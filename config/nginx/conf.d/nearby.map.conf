# nearby CSR 静态壳映射（http 上下文，随 conf.d/*.conf 载入，2026-09-12 S3）
# 等价已删除的 apps/nearby/web/middleware.ts：locale 协商 / 无前缀路径改写判定。
# 与 class.map.conf 的差异：nearby routing 是 localePrefix:'as-needed'——en 为默认
# 无前缀（canonical/sitemap 均无前缀），因此无前缀 en 页面不能 302（URL 会漂移、
# SEO 信号分裂），必须**内部改写**到 /en 前缀的静态文件；仅 zh/zh-TW 协商命中时
# 才 302 到带前缀路径（与原 middleware 的 zh-cookie→307 / en-cookie→rewrite 一致）。
# sitemap.xml 不在静态桶：由 nearbyapi（Go）动态生成，块内反代同路径。

# noda_locale cookie 优先（跨子域共享语言选择：在 nearby/www/auth/class 选过，其余站记住）
# en 必须显式认领：缺分支时 cookie=en 落 default ""，中文浏览器 Accept-Language
# 重新接管，zh 切英文被 302 回 /zh（2026-09-15 修复，同 liuyao/snagme.map.conf 先例）
map $cookie_noda_locale $nearby_cookie_locale {
    ~*^zh-TW$   zh-TW;
    ~*^zh$      zh;
    ~*^en$      en;
    default     "";
}
# Accept-Language 中文协商（zh-TW 组合如 "zh-TW,zh;q=0.9" 两位皆 1，先判 zh-TW）
map $http_accept_language $nearby_al_zhtw {
    default     0;
    "~*zh-TW"   1;
}
map $http_accept_language $nearby_al_zh {
    default     0;
    "~*zh"      1;
}
# 协商合成：cookie zh/zh-TW 强制生效 > Accept-Language zh-TW > zh > 默认 en
# ⚠️ 只依赖请求头（cookie/Accept-Language）——nginx map 的值在请求生命周期内缓存，
# rewrite last 内部重入 location 不会重算；故**凡依赖 $uri 的判定不能进 map**
#（内部改写后 $uri 已带 /en 前缀而 map 仍出旧值 → 死循环 500，首版实测踩坑），
# $uri 判定改由 location / 内 if 正则承担（每轮重入重新求值）。
map "$nearby_cookie_locale:$nearby_al_zhtw:$nearby_al_zh" $nearby_locale {
    "~^zh-TW:"  zh-TW;
    "~^zh:"     zh;
    "~^:1"      zh-TW;
    "~^:0:1"    zh;
    default     en;
}

# $request_uri 的 locale 前缀（error_page 兜底到对应语言壳页用）
# ⚠️ 必须用 $request_uri（原始请求）：snippet 的 rewrite ... break 已把 $uri
# 改写为 /noda-static/sites/nearby/<key>，error_page 求值时 $uri 不再带 locale 前缀
map $request_uri $nearby_loc {
    default            en;
    "~^/zh-TW(/|\?|$)" zh-TW;
    "~^/zh(/|\?|$)"    zh;
    "~^/en(/|\?|$)"    en;
}

# Cache-Control 注入（SeaweedFS S3 GET 不回显对象 Cache-Control，同 class.map.conf）
# /_next/* 与 /images/* 内容寻址/静态图 → 一年 immutable（export 后 next.config
# 的 headers() 不可用，原 /images/* 长缓存规则迁此）；页面 HTML → no-cache
# ⚠️ 同上用 $request_uri——add_header 求值时 $uri 已被 rewrite 改写，^/_next/ 永不命中
map $request_uri $nearby_cache_control {
    "~^/_next/"   "public, max-age=31536000, immutable";
    "~^/images/"  "public, max-age=31536000, immutable";
    default       "no-cache";
}

# 根路径 302 目标斜杠收敛（2026-10-11 F5）：location / 的 zh/zh-TW 协商重定向
# 拼 $request_uri 会把根路径目标写成 /zh/——map 归一为空串（其余路径恒等原样）。
# $request_uri 不随内部 rewrite 变化，map 值缓存安全（同 class_loc/$class_cache_control 先例）。
map $request_uri $nearby_redirect_path {
    default $request_uri;
    "/"     "";
}

# ── 旧 ?type= 深链 301 → 新线单跳（issue#10 D1/D11，2026-10-16；#32 条目4① 收敛，2026-10-23）──
# v2 上线版 NearbyHeader「优惠」nav href 曾全站外发 /?type=venueOpening（Google
# 已收录），路径化后类型页为真路径 /events|/places/hidden-gems|/news|/deals。
# 原版先 301 到旧单数线（/event 等）再由 nearbyapi oldTopLineTarget 二跳收新线；
# #32 4① 起 map 值直写新线目标（与 Go oldTopLineTarget 同语义），消灭中转跳。
# 两级 map：
# ① type 值 → 新线目标段（venueOpening=已退役新店 → deals；map 字符串匹配不分
#    大小写；段可含子路径如 places/hidden-gems，无冒号不破坏 ② 的键正则）
# ② 目标段 × URI 语言前缀 → 完整目标（仅 /、/zh、/zh-TW 三种入口形态；
#    非法/缺失 type 值落 default "" → server 块 if 不触发，零影响）
map $arg_type $nearby_type_seg {
    default      "";
    event        events;
    place        places/hidden-gems;
    news         news;
    deals        deals;
    venueOpening deals;
}
map "$nearby_type_seg::$uri" $nearby_type_redirect {
    ~^([^:]+)::/zh-TW/?$   /zh-TW/$1;
    ~^([^:]+)::/zh/?$      /zh/$1;
    ~^([^:]+)::/$          /$1;
    default                "";
}

# ── URL 架构 v2（issue#31 层D + 设计 D7，2026-10-22）──
# /item/ 旧深链：本文件无 nginx map 桥——default.conf 的 /item/ location 即
# 直反代 nearbyapi（单跳：301 目标由 Go 查库生成），D7 语义已满足，无需映射。
#
# /places（含 zh/zh-TW 前缀变体）带查询串 → Go 301 处理器判定（default.conf
# location / 的 if 消费；?type= 等业务 301 由 Go 生成，D7）。无查询串恒 0 →
# locale 协商与桶静态不受影响。
# ⚠️ 本 map 依赖 $uri，受顶部「map 值请求内缓存」警示约束——安全性论证：
# 命中（值 1）时 if 立即 proxy 出块，永不发生内部改写重入；未命中（值 0）
# 时 location / 的 en 内部改写把 $uri 变为 /en/places，但 /en 前缀变体不在
# 匹配面内、且值已缓存为 0，重入求值仍 0——两方向都无「缓存值应变而未变」
# 的死循环条件（与顶部踩坑案例的差异所在）。
# 两段式纯静态映射（无 if-内容坑）：旧池 ?type= 五值是 #31 冻结契约，
# 不需查库——nginx 直接生成 301 目标（Go 侧处理器保留作直打防御）。
# 其余参数（?q= 搜索预填等）不命中 → 原样走桶静态，不被剥参。
map $arg_type $nearby_pool_cat {
    attraction     attractions;
    national-park  national-parks;
    obscure        hidden-gems;
    market         markets;
    campsite       camping;
    default        "";
}
map "$uri::$nearby_pool_cat" $nearby_places_301 {
    default                          "";
    # 只匹配合法入口 /places（含 locale 前缀变体）：根路径 /?type=attraction 与
    # /zh?type=... 等旧形态拼不出有效分类页目标（曾产出 //attractions 协议相对
    # 串、/zh/attractions 404 目标，2026-10-23 修正）——不命中落 "" 走正常首页
    # 路径，不重定向。p 捕获组为空时目标即无前缀 canonical 形态。
    "~^(?<p>/zh-TW|/zh)?/places::(?<c>[^:]+)$"  $p/places/$c;
}
