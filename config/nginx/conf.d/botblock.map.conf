# ============================================
# 搜狗蜘蛛 UA 拦截 map（2026-10-18 issue16）
# 背景：10-17 apex GA4 出现 ~188「中国用户」波峰，BQ 画像=Chrome/99.0.4844.51
#   + Windows 10 + zh-cn + geo Urumqi（GA4 数据集 analytics_553739063），
#   属搜狗蜘蛛集群（Sogou 不公开 IP 段，官方仅给 UA「Sogou web spider」
#   与 DNS 反查 *.sogou.com 验证法，zhanzhang.sogou.com/index.php/help/spider）。
#   该波 UA 伪装浏览器（无 Sogou 字样），本 map 拦不住——本 map 防的是
#   「自报家门」的规范搜狗蜘蛛（web/pic/news/inst/blog/Orion/Test 变体），
#   拦截意义：省源站带宽 + 不喂未授权抓取；伪装波的拦截靠 CF 边缘
#   （Managed Challenge / 已开 WAF）+ ratelimit.conf 限速兜底。
# 匹配：宽松正则 ~*sogou（大小写不敏感，UA 含 sogou 即命中）。
#   覆盖变体：Sogou web spider / Sogou Pic Spider / Sogou News Spider /
#   Sogou inst spider / Sogou Blog Spider / Sogou Orion spider /
#   Sogou-Test-Spider / Sogou spider2 等。
#   误伤面评估：搜狗浏览器桌面 UA 为「SE 2.x MetaSr」不含 sogou 字样，
#   主流浏览器 UA 均不含 sogou——误伤≈0；如未来出现误伤客诉，收紧为
#   ~*sogou[^"]*spider 即可（只拦自报蜘蛛的 UA）。
# 消费方：snippets/bot-sogou-block.conf（default.conf 的 noda.co.nz /
#   class.noda.co.nz 两公网内容 server 块 include）。
#   未接入：nearby/www/findclass 纯 301 壳（无 HTML、无 GA 埋点，拦截无收益）；
#   api/auth/admin/comments 非抓取面。
# 注：map 惰性求值，conf.d 加载顺序无关（同 ratelimit.conf 结论）。
# ============================================
map $http_user_agent $is_sogou_spider {
    default          0;
    ~*sogou          1;
}

# ============================================
# Meta 渲染爬虫 拦截 map（2026-11-06，用户裁定「完全不让访问」）
# 背景：11-06 apex GA4 美国 15 用户判定真人 0,其中 12 个为 Meta 渲染爬虫
#   （9×360x780 + 2×2000x2000 方形 + 1×412x915,全部 0 互动、m.facebook.com/
#   facebook.com 引荐、OS/语言字段空,10 会话同落 /auckland/events/
#   auckland-uni-big-band——FB 分享触发链接理解爬虫反复渲染）。源站日志
#   39 条 facebookexternalhit/1.1 全来自 Meta v6 段 2a03:2880::/32e。
# 用户裁定（2026-11-06）：Meta 爬虫流量无价值,边缘完全拒绝;同日撤销
#   「爬虫 UA 不注入 gtag」的前端方案（noda-apps c4b23fdc→42c2616b revert）。
# 拦截意义：GA4/日志/带宽全面清净;代价（用户知情接受）：FB/Messenger/
#   WhatsApp/IG 分享不再有预览卡片,内容不进 Meta 推荐池。
# 匹配：~*facebookexternalhit（unfurl 爬虫）、~*facebot（老抓取器）、
#   ~*meta-external（meta-externalagent/meta-externalfetcher 内容理解爬虫）。
#   不含 WhatsApp 专有 UA（WhatsApp/2.x）——若确认 WhatsApp 卡片也不需要,
#   再加 ~*^whatsapp。
# 误伤面评估：四令牌均为 Meta 官方爬虫自报 UA,真人浏览器与主流工具
#   不含——误伤≈0。
# 消费方：snippets/bot-meta-block.conf（default.conf noda.co.nz server 块
#   include;www 纯 301 壳无接入价值,同 sogou 先例）。
# ============================================
map $http_user_agent $is_meta_crawler {
    default                0;
    ~*facebookexternalhit  1;
    ~*facebot              1;
    ~*meta-external        1;
}
