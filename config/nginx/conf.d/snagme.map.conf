# snagme 静态壳缓存策略（http 上下文，随 conf.d/*.conf 载入）
# /_next/* 带 content hash → 一年 immutable；HTML/其余 → no-cache（发布即时生效）
map $request_uri $snagme_cache_control {
    "~^/_next/"   "public, max-age=31536000, immutable";
    default       "no-cache";
}

# ── locale 协商（等价 liuyao middleware 语义，照抄 liuyao.map.conf）。
# D-21（2026-10-06）：snagme 前端已迁 localePrefix:'always'——协商结果仅用于
# 根路径 302 与无前缀旧链接的 301 目标选择；en 旧链接 301 /en，zh/zh-TW 302。──
# noda_locale cookie 优先（跨子域共享语言选择）——en 必须显式认领：
# 缺分支时 cookie=en 会落 default ""，中文浏览器 Accept-Language 重新接管，
# 「zh 页切英文」刚写完 cookie 就被 302 回 /zh（2026-09-15 修复）
map $cookie_noda_locale $snagme_cookie_locale {
    ~*^zh-TW$   zh-TW;
    ~*^zh$      zh;
    ~*^en$      en;
    default     "";
}
# Accept-Language 中文协商（zh-TW 组合两位皆 1，先判 zh-TW）
map $http_accept_language $snagme_al_zhtw {
    default     0;
    "~*zh-TW"   1;
}
map $http_accept_language $snagme_al_zh {
    default     0;
    "~*zh"      1;
}
# 协商合成：cookie zh/zh-TW 强制生效 > Accept-Language zh-TW > zh > 默认 en
# ⚠️ 只依赖请求头——map 值请求内缓存，rewrite last 重入 location 不重算；
# $uri 判定由 location / 内 if 正则承担（每轮重入重新求值），否则死循环 500。
map "$snagme_cookie_locale:$snagme_al_zhtw:$snagme_al_zh" $snagme_locale {
    "~^zh-TW:"  zh-TW;
    "~^zh:"     zh;
    "~^:1"      zh-TW;
    "~^:0:1"    zh;
    default     en;
}

# $request_uri 的 locale 前缀（error_page 兜底到对应语言壳页用）
# ⚠️ 必须用 $request_uri（原始请求）：snippet 的 rewrite ... break 已把 $uri
# 改写为 /noda-static/sites/snagme/<key>，error_page 求值时 $uri 不再带前缀
map $request_uri $snagme_loc {
    default            en;
    "~^/zh-TW(/|\?|$)" zh-TW;
    "~^/zh(/|\?|$)"    zh;
    "~^/en(/|\?|$)"    en;
}
