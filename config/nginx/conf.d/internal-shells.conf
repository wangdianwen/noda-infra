# 内部壳页服务（noda-infra#8 / noda-apps#123，2026-11-02）：noda-api 容器经
# STATIC_SHELL_BASE_URL=http://noda-static-prod:8181 拉取 nearby item 壳页
# （fs 模式下原 S3 path-style 桶基址不可再由 S3_ENDPOINT 推导——weed 退役后）。
# 专用端口不进任何 vhost 集合、不带 origin-gate（容器网/LAN 内部只读壳页，
# 与原桶匿名读同暴露面）；宿主不发布此端口。
server {
    listen 8181;
    server_name _;
    access_log off;

    root /var/noda-static/sites/nearby;
    include snippets/strip-conditional-get.conf;
    try_files $uri =404;
}
