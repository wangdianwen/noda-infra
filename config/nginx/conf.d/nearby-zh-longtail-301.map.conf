# zh 目录长尾详情全退（issue #126 P2）301 + 协商豁免双 map——prod 薄壳。
# 数据文件：/var/noda-static/nginx-conf/zh-longtail-301.map.conf（r4s 宿主
# /mnt/mmc1-4/Noda/Static/nginx-conf/，与 sites/ 同级不在任何 server root
# 下，不进 git、不被伺服），由 pipeline_sync_zh_longtail_map（pipeline-
# stages.sh）在每次 nearby static/all prod 发布成功后从 noda-apps 构建产物
# nearby/web/scripts/generated/zh-longtail-301.conf 同步 + nginx -t + reload。
# 历史：2026-11-03 #126 P2 首接线为全量数据表双仓拷贝（5c298f3），此后
# 构建面每次演化（exact 表全量重生成）而本仓拷贝停滞 → 新退场 zh 页落桶
# 404（GSC Not found 邮件 2026-11-12 实锤：t3-* 步道 2 条）——薄壳化后数据
# 随桶发布日更，窗口态即时闭合。
# 数据语义（exact-only 双 map，勿改正则兜底——保留页与退场页同
# <slug>-<id12> 形态，兜底误 301 保留页，2026-11-03 容器实测判例）：
#   $noda_zh_longtail_redirect 301 表（消费见 default.conf server 级）；
#   $noda_zh_longtail_bypass   协商豁免表（防 locale 协商 302 回 /zh 再撞
#   301 表成环，location / 协商序列内消费）。
# map_hash_bucket_size 不在此声明——prod nginx.conf 已有 128；数据文件保持
# 纯数据（长 slug key 超 64B 默认桶，消费方必须已有该声明）。
# preprod 双轨：liuyao-local.conf include snippets/ 全量拷贝（演练域
# noindex、滞后可容忍），与 prod 数据面允许短暂不一致。
include /var/noda-static/nginx-conf/zh-longtail-301.map.conf;
