# auth CSR 静态壳映射（http 上下文，随 conf.d/*.conf 载入，2026-09-12 S5）
# 等价已删除的 auth/middleware.ts：locale 协商 / 无前缀路径改写判定。
# 与 nearby.map.conf 的关键差异：auth routing 是 localePrefix:'as-needed' 且
# defaultLocale=**zh**——无前缀 canonical 是 zh（/login、/profile），en/zh-TW
# 带前缀（/en/login…）。因此无前缀页面默认**内部改写**到 /zh 前缀的静态文件
#（URL 保持 canonical）；仅协商命中 en/zh-TW 时才 302 到带前缀路径
#（与原 middleware 的 307 行为对齐）。

# noda_locale cookie 优先（跨子域共享语言选择；en 同样入 map——TS middleware
# 对 en cookie 的处理是 307 → /en 前缀，等价 302）
map $cookie_noda_locale $auth_cookie_locale {
    ~*^zh-TW$   zh-TW;
    ~*^zh$      zh;
    ~*^en$      en;
    default     "";
}
# Accept-Language 中文协商（zh-TW 组合先判）
map $http_accept_language $auth_al_zhtw {
    default     0;
    "~*zh-TW"   1;
}
map $http_accept_language $auth_al_zh {
    default     0;
    "~*zh"      1;
}
# 协商合成：cookie 强制生效（zh-TW/zh/en）> Accept-Language zh-TW > zh > 默认 zh
# ⚠️ 只依赖请求头——nginx map 值在请求生命周期内缓存，rewrite last 重入不重算；
# 凡依赖 $uri 的判定不能进 map（nearby 首版死循环 500 教训），由 location 内 if 承担
map "$auth_cookie_locale:$auth_al_zhtw:$auth_al_zh" $auth_locale {
    "~^zh-TW:"  zh-TW;
    "~^zh:"     zh;
    "~^en:"     en;
    "~^:1"      zh-TW;
    "~^:0:1"    zh;
    default     zh;
}

# $request_uri 的 locale 前缀（error_page 兜底用 $request_uri：snippet 的
# rewrite ... break 已把 $uri 改写为 /noda-static/sites/auth/<key>）
map $request_uri $auth_loc {
    default            zh;
    "~^/zh-TW(/|\?|$)" zh-TW;
    "~^/zh(/|\?|$)"    zh;
    "~^/en(/|\?|$)"    en;
}

# Cache-Control 注入（SeaweedFS S3 GET 不回显对象 Cache-Control）
# /_next/* /images/* /icons 内容寻址或静态图 → 一年 immutable；头像一周；
# 页面 HTML → no-cache（发布即时生效）
# ⚠️ 用 $request_uri——add_header 求值时 $uri 已被 rewrite 改写
map $request_uri $auth_cache_control {
    "~^/_next/"      "public, max-age=31536000, immutable";
    "~^/images/"     "public, max-age=31536000, immutable";
    "~^/favicon"     "public, max-age=31536000, immutable";
    "~^/icon"        "public, max-age=31536000, immutable";
    "~^/apple-icon"  "public, max-age=31536000, immutable";
    "~^/avatars/"    "public, max-age=604800";
    default          "no-cache";
}

# comment 静态前端（admin 占位页）缓存注入（seaweedfs-comment-static.conf 消费）
map $request_uri $comment_cache_control {
    "~^/_next/"      "public, max-age=31536000, immutable";
    default          "no-cache";
}
