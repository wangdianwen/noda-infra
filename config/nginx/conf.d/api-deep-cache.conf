# api 深链注入页缓存（http 上下文，2026-10-16 GSC "Duplicate without user-selected
# canonical" 验证失败修复）。
#
# 背景：/<loc>/course|category|item 深链由 Go api（classapi/nearbyapi）服务端注入
# head（canonical/hreflang/OG）后整页返回；api 不可达（发版窗/SeaweedFS 故障——
# weed 容器 RestartCount 已累计 2 次，每次桶不可达即 classapi 502）时 nginx 回退
# =200 裸壳：通用 title、无 canonical，全站所有课程/条目共用一份——Google 在该窗口
# 抓到的就是这种壳，聚成千页重复簇且 userCanonical=None，验证必失败（2026-10-13
# 双属性 Failed，1,006 页）。
#
# 两层防御：
#   1. proxy_cache + stale-on-error：api 抖动期间回上一份注入好的完整页（对用户
#      与 Google 均为合法内容，canonical 齐全）；
#   2. 回退命名 location 加 X-Robots-Tag: noindex（default.conf）：仅剩冷缓存 + api
#      不可达才走到，此时也不得给爬虫可索引净壳。
#
# 缓存盘在容器 fs（r4s SD 卡 ~1MB/s）：max_size 压小 + inactive 短，只当韧性层
# 不当性能层；classapi/nearbyapi 注入响应无 Cache-Control/Set-Cookie（2026-10-16
# 实证），proxy_cache_valid 直接生效。
proxy_cache_path /var/cache/nginx/api_deep
                 levels=1:2
                 keys_zone=api_deep:10m
                 max_size=128m
                 inactive=1d
                 use_temp_path=off;
