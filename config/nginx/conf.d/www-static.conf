# www 官网静态专用块（过渡期，2026-09 三容器切换）：
# noda-static-prod 镜像内烘焙 /var/www/noda.co.nz（旧单容器/旧边缘 nginx 无此文件），
# apex 域的代理（default.conf 的 noda.co.nz 块 → $www_upstream = 本容器:8181）落到此块，
# 由 static 本地伺服。独立端口避免与 static 自己加载的 default.conf apex 块互相代理成环。
# 旧边缘退役后，Cloudflare 直连 static 高位端口，此块与 default.conf apex 块一并收敛。
server {
    listen 8181;
    server_name noda.co.nz www.noda.co.nz;

    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript image/svg+xml;

    root /var/www/noda.co.nz;

    location = /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # 带内容哈希的静态资源：一年 immutable
    location /_next/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # HTML 等其余文件：no-cache 强制 revalidate（发布后立即可见）
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ $uri/index.html =404;
        add_header Cache-Control "no-cache";
    }
}
