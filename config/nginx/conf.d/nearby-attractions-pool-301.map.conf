# nearby attractions 线 uuid12→静态目录 sha12 301 map（noda-apps #495 收口件，2026-11-26）
# 背景：#495 把 11 条策展顶流 POI 的 category_slugs 修正为 attractions 后，Go 详情壳
#      canonicalDetail 产出的迁移目标 /places/attractions/{slug}-{uuid12}（DB uuid12
#      形态）在 nginx 无伺服面——detail 壳 location(:423) 的首段白名单只含城市/
#      national，静态目录又只烘 sha12 文件 → 旧 URL 301 链终点 404。
# 本表：11 条 POI × 4 前缀（无前缀 en/en/zh/zh-TW）= 44 exact，uuid12 形态
#      301 → 静态目录 canonical 页（sha12 形态，#499「静态目录=唯一 canonical 面」
#      同向；#499 全量拍板前本表先保 11 条策展面收敛单跳）。
# 生成法（重生成纪律，勿手改条目）：
#   uuid12 侧: ssh r4s psql -At -c "SELECT url_slug||' '||translate(id::text,'-','')
#              FROM nearby_items WHERE type='place' AND status='active'
#              AND category_slugs && '{attractions}';"
#   sha12 侧:  sites/nearby/en/places/attractions/ 文件名（已部署静态树为权威）；
#              slug 改名映射 3 条（cape-reinga→…-te-rerenga-wairua /
#              skyline-queenstown→…-gondola / lake-rotorua→…-lakefront，
#              源 noda-apps #489 attraction_slug 显式映射）
