# origin-gate (2026-10-19): 源站只接受 Cloudflare Tunnel(noda-ops)与内网入口。
# 72h access.log 证实 $remote_addr 仅出现 172.18.0.7(tunnel)/172.18.0.1(docker-proxy)/127.0.0.1，
# CF 边缘从不直连源站 → 公网源直连=扫描/攻击，server 级 444（snippets/origin-gate.conf）。
geo $origin_gate_blocked {
    default 1;
    127.0.0.0/8    0;
    10.0.0.0/8     0;
    172.16.0.0/12  0;
    192.168.0.0/16 0;
    ::1            0;
    fc00::/7       0;
    # 站主家庭宽带委托前缀（LAN 直连诊断便利；前缀轮换则回落走域名）
    2407:7000:b051::/48 0;
}
