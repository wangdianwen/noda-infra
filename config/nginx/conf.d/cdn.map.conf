# CDN Cache-Control 注入映射（http 上下文，随 conf.d/*.conf 载入）
# 背景：SeaweedFS 3.80 的 S3 GET 不回显上传时存储的 Cache-Control 头，
# 由 nginx 按对象前缀注入，保证浏览器与 Cloudflare 边缘都能拿到正确缓存指令。
map $uri $cdn_cache_control {
    default                 "public, max-age=604800";
    # 爬虫内容寻址图：内容不变 → 一年 immutable
    ~^/nearby/crawled/      "public, max-age=31536000, immutable";
}
