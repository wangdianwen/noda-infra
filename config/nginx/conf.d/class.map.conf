# class CSR 静态壳映射（http 上下文，随 conf.d/*.conf 载入，2026-09-12 S1 切换）
# 等价已删除的 apps/class/web middleware.ts：locale 协商 / 无前缀路径改写判定。
# 背景：output:'export' 无请求级 locale 协商，无前缀页面路径没有静态文件，
# 由 nginx 302 到带前缀等价路径（routing.ts localePrefix:'always' 注释同约）。

# noda_locale cookie 优先（跨子域共享语言选择：在 liuyao/www/auth 选过，class 也记住）
map $cookie_noda_locale $class_cookie_locale {
    ~*^zh-TW$   zh-TW;
    ~*^zh$      zh;
    default     "";
}
# Accept-Language 中文协商（0/1 位；zh-TW 组合如 "zh-TW,zh;q=0.9" 两位皆 1，先判 zh-TW）
map $http_accept_language $class_al_zhtw {
    default     0;
    "~*zh-TW"   1;
}
map $http_accept_language $class_al_zh {
    default     0;
    "~*zh"      1;
}
# 协商合成：cookie zh/zh-TW 强制生效 > Accept-Language zh-TW > zh > 默认 en
map "$class_cookie_locale:$class_al_zhtw:$class_al_zh" $class_locale {
    "~^zh-TW:"  zh-TW;
    "~^zh:"     zh;
    "~^:1"      zh-TW;
    "~^:0:1"    zh;
    default     en;
}

# $uri 是否为「无 locale 前缀的页面路径」（1=需要 302；有前缀/资产/API/兜底页不重定向）
# 带扩展名视为资产（等价 middleware 的 pathname.includes('.') 短路）
map $uri $class_needs_locale_redirect {
    default                        1;
    "~^/(en|zh|zh-TW)(/|$)"        0;
    "~^/(_next|api|images)(/|$)"   0;
    "~^/unknown-host"              0;
    "~\.[A-Za-z0-9]+(/|$)"         0;
}

# $uri 的 locale 前缀（error_page 兜底到对应语言 app-shell 壳页用）
# ⚠️ 必须用 $request_uri（原始请求）：snippet 的 rewrite ... break 已把 $uri
# 改写为 /noda-static/sites/class/<key>，error_page 求值时 $uri 不再带 locale 前缀
map $request_uri $class_loc {
    default         en;
    "~^/zh-TW(/|\?|$)" zh-TW;
    "~^/zh(/|\?|$)"    zh;
    "~^/en(/|\?|$)"    en;
}

# Cache-Control 注入（SeaweedFS S3 GET 不回显对象 Cache-Control，同 cdn.map.conf）
# /_next/* 内容哈希寻址 → 一年 immutable；页面 HTML → no-cache（发布即刻生效）
# ⚠️ 同上用 $request_uri——add_header 求值时 $uri 已被 rewrite 改写，^/_next/ 永不命中
map $request_uri $class_cache_control {
    "~^/_next/"   "public, max-age=31536000, immutable";
    default       "no-cache";
}
