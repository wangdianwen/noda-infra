# 安全响应头（2026-11-08 安全 review 固化）：
# - HSTS：强制浏览器后续访问走 https，防降级攻击/SSL 剥离；includeSubDomains 覆盖全部子域。
#   经 CF 边缘透传；CF 侧 Future：可在 Transform Rule 二次兜底。
# - X-Content-Type-Options: nosniff：防 MIME 嗅探把静态/用户内容误渲染为脚本。
# 继承说明：nginx 的 add_header 在 location 级出现任何一条时，server 级的本组头在该
# location 失效——现有 location 级 add_header 仅在 cdn/api-deep-cache 资源类 location
# （见 conf.d/cdn.conf、default.conf /graphql 等），主 HTML 入口不受影响，可接受。
# 用法：在每个业务 server 块首行 include snippets/hardening.conf;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
