# noda-apps prod upstream 变量 — 在 server 块中 include
# 使用 resolver 127.0.0.11 动态解析 DNS，容器重建后自动刷新 IP
# 由 update_upstream() 在蓝绿切换时更新
# 容器命名: noda-apps-prod-{blue|green}（docker-compose 分组: noda-apps-prod）
set $findclass_upstream noda-apps-prod-green:3000;
set $www_upstream noda-apps-prod-green:3002;
set $auth_app_upstream noda-apps-prod-green:3004;
set $admin_upstream noda-apps-prod-green:3006;
set $admin_api_upstream noda-apps-prod-green:3011;
