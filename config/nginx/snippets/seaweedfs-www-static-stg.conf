# [preprod 专用] www 静态站 → 本地文件系统根直读（www-preprod 块共用）。
# 与 seaweedfs-www-static.conf 的差异（2026-11-02 本地文件系统迁移
# noda-infra#8 P3 后）：映射规则相同（root /var/noda-static + /sites/www），
# 区别仅在挂载源与 noindex——preprod 由 compose 挂 docker/volumes/static-stg
# 到 /var/noda-static（stg 数据与 prod 物理隔离；prod/r4s 挂
# /mnt/mmc1-4/Noda/Static），另注入 X-Robots-Tag noindex。原 stg 桶前缀
# /noda-static-stg/sites/www 随 S3 代理退役，两文件仍不可互指。
# （史：2026-09-14 preprod 曾因复用 prod snippet 读 prod 桶致门禁看到旧内容，
#   本地根时代同风险 = 误挂 prod 目录，挂载源隔离纪律不变。）
# ⚠️ 命名约束：主 nginx.conf 第 38 行在 http 上下文通配 include snippets/proxy-*.conf，
# 本片段含 rewrite（仅 server/location/if 合法）——切勿改回 proxy-* 前缀命名。
# 用法：location 内 include 本片段；调用方在 location 内声明 Cache-Control
# （/_next/ immutable、HTML no-cache）与 error_page 403/404 兜底（→ /404.html，
# 保留 404 状态码）。调用方 server 级的 upstream-seaweedfs.conf include 已无
# 本片段消费方（P4 清理时摘）。
#
# 路径映射（www 为 trailingSlash:true 导出布局——目录内 index.html，与 class 平铺 .html 不同）：
#   1. / → /index.html
#   2. 尾斜杠 → /<path>/index.html：/zh/ → /zh/index.html
#   3. 无扩展名无尾斜杠 → /<path>/index.html：/zh → /zh/index.html
#   4. 带扩展名（/_next/*.js、RSC *.txt、/sitemap.xml、/404.html、/og-image-*）原样透传
#   5. 前缀 sites/www → 本地文件 /var/noda-static/sites/www/<key>（缺文件 =404）
root /var/noda-static;
rewrite ^/$ /index.html;
rewrite ^/(.+)/$ /$1/index.html;
rewrite ^(/(?:.*/)?[^/.]+)$ $1/index.html;
rewrite ^(.*)$ /sites/www$1 break;
try_files $uri =404;

# 缺对象（404，含 RSC .txt——触发 Next 路由器硬导航兜底）统一交调用方 error_page；
# 原 S3 匿名拒绝（403）随桶退役，本地 try_files 一律 404（error_page 403 声明保留）。

# 静态 location 有自己的 add_header → 不继承 server 级安全头，须重新注入
# （与 prod 版不同：preprod 各 location 未逐个 include security-headers）
include /etc/nginx/snippets/security-headers.conf;

# preprod 全站不收录（prod 版 snippet 无此头；server 级会被本片段 add_header 阻断继承）
add_header X-Robots-Tag "noindex" always;
