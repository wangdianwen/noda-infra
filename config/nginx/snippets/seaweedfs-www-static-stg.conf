# [preprod 专用] www 静态站 → SeaweedFS stg 桶代理（www-preprod 块共用）。
# 与 seaweedfs-www-static.conf 唯一差异 = 桶前缀 noda-static → noda-static-stg
# + preprod noindex（stg 实例桶与 prod 隔离；prod/r4s 一律用原 snippet，两文件不可互指）。
# 2026-09-14：流水线 stg 发布固定写 noda-static-stg/sites/<product>，www-preprod
# 原先复用 prod snippet 读 noda-static 桶 → preprod 门禁看到的是旧内容，对齐
# admin/snagme 的 -stg 模式后门禁才真实。
# ⚠️ 命名约束：主 nginx.conf 第 38 行在 http 上下文通配 include snippets/proxy-*.conf，
# 本片段含 rewrite（仅 server/location/if 合法）——切勿改回 proxy-* 前缀命名。
# 用法：location 内 include 本片段；调用方（server 级）负责：
#   include /etc/nginx/snippets/upstream-seaweedfs.conf;   # $seaweedfs_upstream 变量
#   resolver 127.0.0.11 valid=10s ipv6=off;                # 变量 upstream 需动态 DNS
# 并在 location 内声明 Cache-Control（/_next/ immutable、HTML no-cache）与
# error_page 403/404 兜底（→ /404.html，保留 404 状态码）。
#
# 路径映射（www 为 trailingSlash:true 导出布局——目录内 index.html，与 class 平铺 .html 不同）：
#   1. / → /index.html
#   2. 尾斜杠 → /<path>/index.html：/zh/ → /zh/index.html
#   3. 无扩展名无尾斜杠 → /<path>/index.html：/zh → /zh/index.html
#   4. 带扩展名（/_next/*.js、RSC *.txt、/sitemap.xml、/404.html、/og-image-*）原样透传
#   5. 前缀 sites/www → path-style S3 GET：/noda-static-stg/sites/www/<key>
rewrite ^/$ /index.html;
rewrite ^/(.+)/$ /$1/index.html;
rewrite ^(/(?:.*/)?[^/.]+)$ $1/index.html;
rewrite ^(.*)$ /noda-static-stg/sites/www$1 break;

proxy_pass http://$seaweedfs_upstream;
proxy_http_version 1.1;
proxy_set_header Host "seaweedfs:8333";
proxy_set_header Connection "";

# 桶内缺对象（404，含 RSC .txt——触发 Next 路由器硬导航兜底）与匿名拒绝（403）
# 统一交调用方 error_page
proxy_intercept_errors on;
proxy_connect_timeout 5s;
proxy_read_timeout 30s;

# 静态 location 有自己的 add_header → 不继承 server 级安全头，须重新注入
# （与 prod 版不同：preprod 各 location 未逐个 include security-headers）
include /etc/nginx/snippets/security-headers.conf;

# preprod 全站不收录（prod 版 snippet 无此头；server 级会被本片段 add_header 阻断继承）
add_header X-Robots-Tag "noindex" always;
