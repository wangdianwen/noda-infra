# GraphQL BFF upstream 变量 — api.noda.co.nz / api-preprod.noda.co.nz
# （spec: noda-apps docs/superpowers/specs/2026-09-16-graphql-bff-grpc-design.md）
# BFF 是 noda-api 容器进程内 listener（:3060），经 docker 网络由本机 nginx 反代。
set $bff_upstream_prod noda-api-prod:3060;
set $bff_upstream_preprod preprod-noda-api:3060;
