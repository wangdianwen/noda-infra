# comment 静态前端 → 本地文件系统根直读（comments.noda.co.nz；
# 2026-09-12 S5 起桶代理，2026-11-02 本地文件系统迁移 noda-infra#8 P3：
# path-style S3 GET /noda-static/sites/comment/<key> 切 root /var/noda-static
# 直读，URL→文件映射语义不变；原 S3 版历史可 git revert）
# ⚠️ 命名约束：含 rewrite 的片段勿用 proxy-* 前缀（http 上下文通配 include 限制）。
# comment 前端仅 admin 占位页（out/admin.html + 404.html + _next 资产），
# /api/* 不在此片段（server 块内反代 noda-api :3012 / 双跑期 Node）。
# 用法：location 内 include；调用方在 location 内声明 error_page 403 404
# /404.html 兜底。调用方 server 级的 upstream-seaweedfs.conf include 已无
# 本片段消费方（P4 清理时摘）。
root /var/noda-static;
rewrite ^/(.+)/$ /$1;
rewrite ^(/(?:.*/)?[^/.]+)$ $1.html;
rewrite ^(.*)$ /sites/comment$1 break;
try_files $uri =404;

# Cache-Control 仍由 nginx 注入（HTML no-cache / _next immutable）
add_header Cache-Control $comment_cache_control;

# 静态 location 有自己的 add_header → 不继承 server 级安全头，须重新注入
include /etc/nginx/snippets/security-headers.conf;
