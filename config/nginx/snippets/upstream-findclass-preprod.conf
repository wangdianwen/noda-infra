# noda-apps pre-prod upstream 变量 — 在 server 块中 include
# 使用 resolver 127.0.0.11 动态解析 DNS，容器重建后自动刷新 IP
# 单容器部署（无蓝绿），容器名固定为 noda-apps-preprod
# 所有变量名使用 _preprod_ 前缀，避免与 prod upstream 冲突
set $findclass_preprod_upstream noda-apps-preprod:3000;
set $www_preprod_upstream noda-apps-preprod:3002;
set $auth_app_preprod_upstream noda-apps-preprod:3004;
set $admin_preprod_upstream noda-apps-preprod:3006;
set $admin_api_preprod_upstream noda-apps-preprod:3011;
