# 深链壳兜底 location 专用：禁用条件请求 304（2026-09-15 nearby /item/<id> 白页修复；
# 2026-11-02 本地文件系统迁移 noda-infra#8 P3 换本地等价实现，实证驱动）。
#
# 根因链：浏览器刷新带 If-Modified-Since / If-None-Match → 深链 location 先把
# <id>.html 404 交 error_page 403 404 =200 内部跳到 app-shell.html（同一 location
# 再次伺服）→ 条件请求命中壳页 → nginx 回 304（空 body，本地实测 If-None-Match
# 命中时甚至裸 304，比 S3 时代「200 + 空 body」更糟）→ 浏览器把空文档写进该
# URL 的缓存；HTML 是 no-cache 每次重验证，每次都再拿空 body —— 深链永久白页。
#
# 处置：深链壳页一律全量 200（牺牲壳页 304，换取条件请求不与 error_page 交织；
# 普通静态页不受影响，304 照常）。用法：在含 error_page 403 404 =200 …app-shell
# 兜底的 location 内 include 本片段（与 seaweedfs-*-static.conf 同级合并生效）。
#
# 实现沿革：
#   S3 时代——proxy_set_header 两行剥离条件请求头（proxy 链路专用）；
#   本地根时代（#8）——proxy_set_header 对静态 handler 无效，改 if_modified_since
#   off（忽略 If-Modified-Since）+ etag off（响应无 ETag，If-None-Match 永不
#   命中）；实测两开关齐开后 INM/IMS 各形态对壳页均回全量 200。上方两行
#   proxy_set_header 保留（若该 location 未来重回代理可双保险）。
if_modified_since off;
etag off;
proxy_set_header If-Modified-Since "";
proxy_set_header If-None-Match "";
