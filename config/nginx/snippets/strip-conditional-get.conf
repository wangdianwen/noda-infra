# 深链壳兜底 location 专用：剥离条件请求头（2026-09-15 nearby /item/<id> 白页修复）。
#
# 根因链：浏览器刷新带 If-Modified-Since → 深链 location 先把 <id>.html 404 交
# error_page 403 404 =200 内部跳到 app-shell.html（同一 location 再进 S3）→ S3 对
# 壳页按条件请求回 304 → nginx 把 304 与 =200 状态覆盖合并成「200 + 空 body」→
# 浏览器把空文档写进该 URL 的缓存；HTML 是 no-cache 每次重验证，每次都再拿空
# body —— 深链从此永久白页。
#
# 处置：深链壳页一律全量 200（牺牲壳页 304，换取条件请求不与 error_page 交织；
# 普通静态页不受影响，304 照常）。用法：在含 error_page 403 404 =200 …app-shell
# 兜底的 location 内 include 本片段（与 seaweedfs-*-static.conf 同级合并生效）。
proxy_set_header If-Modified-Since "";
proxy_set_header If-None-Match "";
