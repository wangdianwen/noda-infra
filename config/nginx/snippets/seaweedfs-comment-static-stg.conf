# [preprod 专用] comment 静态壳 → 本地文件系统根直读（comment-preprod 块共用）。
# 与 seaweedfs-comment-static.conf 的差异（2026-11-02 本地文件系统迁移
# noda-infra#8 P3 后）：映射规则相同（root /var/noda-static + /sites/comment），
# 区别仅在挂载源与 noindex——preprod 由 compose 挂 docker/volumes/static-stg
# 到 /var/noda-static（stg 数据与 prod 物理隔离；prod/r4s 挂
# /mnt/mmc1-4/Noda/Static），另注入 X-Robots-Tag noindex。原 stg 桶前缀
# /noda-static-stg/sites/comment 随 S3 代理退役，两文件仍不可互指。
# ⚠️ 命名约束：含 rewrite 的片段勿用 proxy-* 前缀（http 上下文通配 include 限制）。
# comment 前端仅 admin 占位页（out/admin.html + 404.html + _next 资产），
# /api/* 不在此片段（server 块内反代 noda-api :3012 / 双跑期 Node）。
# 用法：location 内 include；调用方在 location 内声明 error_page 403 404
# /404.html 兜底。调用方 server 级的 upstream-seaweedfs.conf include 已无
# 本片段消费方（P4 清理时摘）。
root /var/noda-static;
rewrite ^/(.+)/$ /$1;
rewrite ^(/(?:.*/)?[^/.]+)$ $1.html;
rewrite ^(.*)$ /sites/comment$1 break;
try_files $uri =404;

# Cache-Control 仍由 nginx 注入（HTML no-cache / _next immutable）
add_header Cache-Control $comment_cache_control;

# 静态 location 有自己的 add_header → 不继承 server 级安全头，须重新注入
include /etc/nginx/snippets/security-headers.conf;

# preprod 全站不收录（prod 版 snippet 无此头；server 级会被本片段 add_header 阻断继承）
add_header X-Robots-Tag "noindex" always;
