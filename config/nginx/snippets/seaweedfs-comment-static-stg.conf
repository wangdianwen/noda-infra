# [preprod 专用] comment 静态壳 → SeaweedFS stg 桶代理（comment-preprod 块共用）。
# 与 seaweedfs-comment-static.conf 唯一差异 = 桶前缀 noda-static → noda-static-stg
# （stg 实例桶与 prod 隔离；prod/r4s 一律用原 snippet，两文件不可互指）。
# ⚠️ 命名约束：含 rewrite 的片段勿用 proxy-* 前缀（http 上下文通配 include 限制）。
# comment 前端仅 admin 占位页（out/admin.html + 404.html + _next 资产），
# /api/* 不在此片段（server 块内反代 noda-api :3012 / 双跑期 Node）。
# 用法：location 内 include；调用方（server 级）负责：
#   include /etc/nginx/snippets/upstream-seaweedfs.conf;
#   resolver 127.0.0.11 valid=10s ipv6=off;
#   error_page 403 404 /404.html 兜底声明。
# Host 覆盖：SeaweedFS 会把带域名的 Host 误判为 virtual-host 桶名 → 400。
rewrite ^/(.+)/$ /$1;
rewrite ^(/(?:.*/)?[^/.]+)$ $1.html;
rewrite ^(.*)$ /noda-static-stg/sites/comment$1 break;

proxy_pass http://$seaweedfs_upstream;
proxy_http_version 1.1;
proxy_set_header Host "seaweedfs:8333";
proxy_set_header Connection "";

proxy_intercept_errors on;
proxy_connect_timeout 5s;
proxy_read_timeout 30s;

# SeaweedFS 不回显对象 Cache-Control——nginx 注入（HTML no-cache / _next immutable）
add_header Cache-Control $comment_cache_control always;

# 静态 location 有自己的 add_header → 不继承 server 级安全头，须重新注入
include /etc/nginx/snippets/security-headers.conf;

# preprod 全站不收录（prod 版 snippet 无此头；server 级会被本片段 add_header 阻断继承）
add_header X-Robots-Tag "noindex" always;
