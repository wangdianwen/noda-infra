# class 站安全头 + CSP（2026-09-12 静态壳切换）
# 原 CSP 由已删除的 apps/class/web middleware.ts addCSPHeaders 按响应注入；
# 静态化后改由 nginx 注入。静态 location 因自带 add_header（Cache-Control）不再
# 继承 server 级 add_header，须在每个静态 location include 本片段。
# XFO 沿用 security-headers.conf 的 SAMEORIGIN（middleware 原为 DENY；class 无被
# 嵌套需求，与全站反代策略保持一致）。

include /etc/nginx/snippets/security-headers.conf;

# comments 域已移除：remark42 iframe/脚本随 KC 迁移下线，评论为站内小岛
# accounts.google.com（2026-09-30）：GIS One Tap 弹窗登录——script-src 放行
# gsi/client 脚本，connect-src 放行 GIS 的 gsi/* 请求，frame-src 放行
# GIS 内部 iframe（FedCM 弹窗本体是浏览器 UI 不受 CSP 管，此处为兜底）
# GA collect 端点（2026-10-09 补）：Google 已把 GA4 collect 从
# www.google-analytics.com 迁到 analytics.google.com（stats.g.doubleclick.net
# 为次选回退），旧白名单把 class 全站浏览器 collect 全部 CSP 拦死——
# 实证见 docs/ga4-user-id-2026-10-09.md（BQ 仅 10-07 存活 19 事件）。
# img-src 同步放行 collect/audiences 图像回退（www.google.com、www.google.co.nz
# 为 /ads/ga-audiences 画像像素，NZ 用户落 google.co.nz）。
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://*.noda.co.nz https://*.noda.test https://*.cloudinary.com https://*.imgur.com https://*.amazonaws.com https://lh3.googleusercontent.com https://www.googletagmanager.com https://www.google-analytics.com https://analytics.google.com https://*.google-analytics.com https://*.g.doubleclick.net https://www.google.com https://www.google.co.nz; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://*.noda.co.nz https://*.noda.test https://www.googletagmanager.com https://www.google-analytics.com https://analytics.google.com https://*.google-analytics.com https://*.g.doubleclick.net https://www.google.com https://accounts.google.com; frame-src 'self' https://*.noda.co.nz https://*.noda.test https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self'" always;
