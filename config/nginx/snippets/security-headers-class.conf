# class 站安全头 + CSP（2026-09-12 静态壳切换）
# 原 CSP 由已删除的 apps/class/web middleware.ts addCSPHeaders 按响应注入；
# 静态化后改由 nginx 注入。静态 location 因自带 add_header（Cache-Control）不再
# 继承 server 级 add_header，须在每个静态 location include 本片段。
# XFO 沿用 security-headers.conf 的 SAMEORIGIN（middleware 原为 DENY；class 无被
# 嵌套需求，与全站反代策略保持一致）。

include /etc/nginx/snippets/security-headers.conf;

# comments 域已移除：remark42 iframe/脚本随 KC 迁移下线，评论为站内小岛
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://*.noda.co.nz https://*.noda.test https://*.cloudinary.com https://*.imgur.com https://*.amazonaws.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://*.noda.co.nz https://*.noda.test https://www.googletagmanager.com https://www.google-analytics.com https://www.google.com; frame-src 'self' https://*.noda.co.nz https://*.noda.test; object-src 'none'; base-uri 'self'; form-action 'self'" always;
