# noda-apps pre-prod upstream 变量 — 在 server 块中 include
# 使用 resolver 127.0.0.11 动态解析 DNS，容器重建后自动刷新 IP
# 由 update_upstream() 在蓝绿切换时更新
set $_preprod_findclass_upstream noda-apps-preprod-blue:3000;
set $_preprod_www_upstream noda-apps-preprod-blue:3002;
set $_preprod_auth_app_upstream noda-apps-preprod-blue:3004;
set $_preprod_admin_upstream noda-apps-preprod-blue:3006;
set $_preprod_admin_api_upstream noda-apps-preprod-blue:3011;
