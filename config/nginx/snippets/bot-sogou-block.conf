# 搜狗蜘蛛 403（2026-10-18 issue16）——include 于公网内容 server 块顶部。
# 判定：conf.d/botblock.map.conf 的 $is_sogou_spider（UA 宽松匹配 sogou）。
# server 块级 if + return 属 rewrite 阶段安全用法（无 location 内 if 陷阱）。
# 403 裸响应（无 body）：蜘蛛不消费错误页，省字节；区别于 /api/ 的 JSON
# 403 语义（那是给人类/程序化客户端的）。
if ($is_sogou_spider) {
    return 403;
}
