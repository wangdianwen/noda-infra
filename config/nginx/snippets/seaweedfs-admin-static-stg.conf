# [preprod 专用] Admin CSR 静态壳 → 本地文件系统根直读（admin-preprod 块共用）。
# 与 seaweedfs-admin-static.conf 的差异（2026-11-02 本地文件系统迁移
# noda-infra#8 P3 后）：映射规则相同（root /var/noda-static + /sites/admin），
# 区别仅在挂载源——preprod 由 compose 挂 docker/volumes/static-stg 到
# /var/noda-static（stg 数据与 prod 物理隔离；prod/r4s 挂
# /mnt/mmc1-4/Noda/Static）。原 stg 桶前缀 /noda-static-stg/sites/admin 随
# S3 代理退役，两文件仍不可互指。
# ⚠️ 命名约束：主 nginx.conf 第 38 行在 http 上下文通配 include snippets/proxy-*.conf，
# 本片段含 rewrite（仅 server/location/if 合法）——切勿改回 proxy-* 前缀命名。
# 用法：location 内 include 本片段；调用方在 location 内声明 error_page 兜底
# （cronjobs 深链回 app-shell、其余回 /404.html）。调用方 server 级的
# upstream-seaweedfs.conf include 已无本片段消费方（P4 清理时摘）。
# 鉴权：与原 SSR 行为一致——页面无服务端门槛（客户端 AuthGuard），数据由
# /api/admin/* 的 Go API 会话校验把关。
#
# 路径映射（Next.js output:'export' 平铺布局，out/dashboard.html、
# out/cronjobs/app-shell.html；动态路由 generateStaticParams 产壳页）：
#   0. / → /index.html（根页 = 客户端跳转 /dashboard 的壳；否则直取目录键 501）
#   1. 尾斜杠规整：/dashboard/ → /dashboard
#   2. 无扩展名 URI → <uri>.html：/login → login.html、/users → users.html；
#      带扩展名（/_next/*.js、RSC *.txt、/favicon.ico）原样
#   3. 前缀 sites/admin → 本地文件 /var/noda-static/sites/admin/<key>（缺文件 =404）
root /var/noda-static;
rewrite ^/$ /index.html;
rewrite ^/(.+)/$ /$1;
rewrite ^(/(?:.*/)?[^/.]+)$ $1.html;
rewrite ^(.*)$ /sites/admin$1 break;
try_files $uri =404;

# 缺对象（404，含未预渲染路由的 RSC *.txt）统一交 error_page 兜底；原 S3 匿名
# 拒绝（403）随桶退役，本地 try_files 一律 404（调用方 error_page 403 声明保留）。

# Cache-Control 由调用方按 location 注入（/_next/ immutable、HTML no-cache）；
# 本片段负责静态 location 的安全头（location 有自己的 add_header 时不继承 server 级）
include /etc/nginx/snippets/security-headers.conf;
