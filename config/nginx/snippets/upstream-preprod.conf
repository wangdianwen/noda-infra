# noda 三容器 preprod upstream 变量 — 在 pre-prod server block 中 include
# 使用 resolver 127.0.0.11 动态解析 DNS，容器重建后自动刷新 IP
# 由 pipeline_deploy_preprod() / update_preprod_upstream() 更新
# 三容器拆分（2026-09）：preprod-noda-frontend（Next.js）/ preprod-noda-api（Go API）
#   www 静态站由 static 容器本地 root 伺服（原 $preprod_www_upstream 已删除）
set $preprod_class_upstream preprod-noda-frontend:3000;
set $preprod_liuyao_upstream preprod-noda-frontend:3005;
set $preprod_auth_app_upstream preprod-noda-frontend:3004;
set $preprod_admin_upstream preprod-noda-frontend:3006;
set $preprod_comments_upstream preprod-noda-frontend:3012;
set $preprod_class_api_upstream preprod-noda-api:3001;
set $preprod_liuyao_api_upstream preprod-noda-api:3007;
set $preprod_admin_api_upstream preprod-noda-api:3011;
