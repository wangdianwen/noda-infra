# noda-apps preprod upstream 变量 — 在 pre-prod server block 中 include
# 使用 resolver 127.0.0.11 动态解析 DNS，容器重建后自动刷新 IP
# 由 pipeline_deploy_preprod() 更新
# 容器名: noda-apps-preprod（单容器，非蓝绿）
set $preprod_findclass_upstream noda-apps-preprod:3000;
set $preprod_www_upstream noda-apps-preprod:3002;
set $preprod_auth_app_upstream noda-apps-preprod:3004;
set $preprod_admin_upstream noda-apps-preprod:3006;
set $preprod_admin_api_upstream noda-apps-preprod:3011;
