# auth 静态壳 → SeaweedFS 桶代理（auth.noda.co.nz 各静态 location 共用，2026-09-12 S5）
# ⚠️ 命名约束：主 nginx.conf 在 http 上下文通配 include snippets/proxy-*.conf，
# 本片段含 rewrite（仅 server/location/if 合法）——切勿改回 proxy-* 前缀命名。
# 用法：location 内 include 本片段；调用方（server 级）负责：
#   include /etc/nginx/snippets/upstream-seaweedfs.conf;   # $seaweedfs_upstream 变量
#   resolver 127.0.0.11 valid=10s ipv6=off;                # 变量 upstream 需动态 DNS
# 并在 location 内声明 error_page 403/404 兜底（→ /404.html）。
#
# 路径映射（export 平铺布局 out/zh/login.html、out/zh.html、out/404.html）：
#   1. 尾斜杠规整：/zh/login/ → /zh/login
#   2. 无扩展名 URI → <uri>.html：/zh/login → zh/login.html、/zh → zh.html；
#      带扩展名（/_next/*.js、/favicon.ico、/404.html）原样
#   3. 前缀 sites/auth → path-style S3 GET：/noda-static/sites/auth/<key>
# 匿名只读（mc anonymous set download），无鉴权头。
# Host 覆盖：SeaweedFS 会把带域名的 Host 误判为 virtual-host 桶名 → 400。
rewrite ^/(.+)/$ /$1;
rewrite ^(/(?:.*/)?[^/.]+)$ $1.html;
rewrite ^(.*)$ /noda-static/sites/auth$1 break;

proxy_pass http://$seaweedfs_upstream;
proxy_http_version 1.1;
proxy_set_header Host "seaweedfs:8333";
proxy_set_header Connection "";

# 桶内缺对象（404）与匿名列表拒绝（403）统一交 error_page 兜底
proxy_intercept_errors on;
proxy_connect_timeout 5s;
proxy_read_timeout 30s;

# SeaweedFS 不回显对象 Cache-Control——nginx 注入（$auth_cache_control）
add_header Cache-Control $auth_cache_control always;

# 静态 location 有自己的 add_header → 不继承 server 级安全头，须重新注入
include /etc/nginx/snippets/security-headers.conf;
