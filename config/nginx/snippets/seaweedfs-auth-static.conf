# auth 静态壳 → 本地文件系统根直读（auth.noda.co.nz 各静态 location 共用；
# 2026-09-12 S5 起桶代理，2026-11-02 本地文件系统迁移 noda-infra#8 P3：
# path-style S3 GET /noda-static/sites/auth/<key> 切 root /var/noda-static 直读，
# URL→文件映射语义不变；原 S3 版历史可 git revert）
# ⚠️ 命名约束：主 nginx.conf 在 http 上下文通配 include snippets/proxy-*.conf，
# 本片段含 rewrite（仅 server/location/if 合法）——切勿改回 proxy-* 前缀命名。
# 用法：location 内 include 本片段；调用方在 location 内声明 error_page 403/404
# 兜底（→ /404.html）。调用方 server 级的 upstream-seaweedfs.conf include 已无
# 本片段消费方（P4 清理时摘）。
#
# 路径映射（export 平铺布局 out/zh/login.html、out/zh.html、out/404.html）：
#   1. 尾斜杠规整：/zh/login/ → /zh/login
#   2. 无扩展名 URI → <uri>.html：/zh/login → zh/login.html、/zh → zh.html；
#      带扩展名（/_next/*.js、/favicon.ico、/404.html）原样
#   3. 前缀 sites/auth → 本地文件 /var/noda-static/sites/auth/<key>（缺文件 =404）
root /var/noda-static;
rewrite ^/(.+)/$ /$1;
rewrite ^(/(?:.*/)?[^/.]+)$ $1.html;
rewrite ^(.*)$ /sites/auth$1 break;
try_files $uri =404;

# 缺对象（404）统一交 error_page 兜底；原 S3 匿名列表拒绝（403）随桶退役，
# 本地 try_files 对目录/缺文件一律 404（error_page 403 声明保留，语义兼容）。

# Cache-Control 仍由 nginx 注入（$auth_cache_control）
add_header Cache-Control $auth_cache_control;

# 静态 location 有自己的 add_header → 不继承 server 级安全头，须重新注入
include /etc/nginx/snippets/security-headers.conf;
