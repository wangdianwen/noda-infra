# shuotong.wang 静态站 → SeaweedFS 桶代理（shuotong.wang 各静态 location 共用，2026-10-11 WS4）
# ⚠️ 命名约束：主 nginx.conf 在 http 上下文通配 include snippets/proxy-*.conf，
# 本片段含 rewrite（仅 server/location/if 合法）——切勿改回 proxy-* 前缀命名。
# 用法：location 内 include 本片段；调用方（server 级）负责：
#   include /etc/nginx/snippets/upstream-seaweedfs.conf;   # $seaweedfs_upstream 变量
#   resolver 127.0.0.11 valid=10s ipv6=off;                # 变量 upstream 需动态 DNS
# Cache-Control 由本片段注入（$shuotong_cache_control，见 conf.d/shuotong.map.conf）。
#
# 路径映射（SvelteKit adapter-static 平铺布局：页面 → <page>.html（build/games.html、
# build/news.html…），根 → index.html，无目录 index；与 nearby 的平铺 .html 同构，
# 与 www 的 trailingSlash:true 目录布局不同）：
#   1. / → /index.html
#   2. 尾斜杠规整：/games/ → /games（桶内无目录 index）
#   3. 无扩展名 URI → <uri>.html：/games → games.html、/news/<slug> → news/<slug>.html；
#      带扩展名（/_app/immutable/*.js、/images/*.png、/robots.txt、/sitemap.xml）原样
#   4. 前缀 sites/shuotong → path-style S3 GET：/noda-static/sites/shuotong/<key>
# 匿名只读（mc anonymous set download），无鉴权头。
# Host 覆盖：SeaweedFS 会把带域名的 Host 误判为 virtual-host 桶名 → 400（同 cdn.conf）。
rewrite ^/$ /index.html;
rewrite ^/(.+)/$ /$1;
rewrite ^(/(?:.*/)?[^/.]+)$ $1.html;
rewrite ^(.*)$ /noda-static/sites/shuotong$1 break;

proxy_pass http://$seaweedfs_upstream;
proxy_http_version 1.1;
proxy_set_header Host "seaweedfs:8333";
proxy_set_header Connection "";

# 桶内缺对象（404）与匿名列表拒绝（403）交 nginx 默认错误页
# （shuotong 桶内无 404.html 兜底页——SvelteKit 未预渲染错误页；净 404 语义）
proxy_intercept_errors on;
proxy_connect_timeout 5s;
proxy_read_timeout 30s;

# SeaweedFS 不回显对象 Cache-Control——nginx 注入（$shuotong_cache_control：
# /_app/immutable/* 一年 immutable、/images/* 一天，HTML no-cache）
add_header Cache-Control $shuotong_cache_control;

# 静态 location 有自己的 add_header → 不继承 server 级安全头，须重新注入
include /etc/nginx/snippets/security-headers.conf;
