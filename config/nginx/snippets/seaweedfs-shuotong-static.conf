# shuotong.wang 静态站 → 本地文件系统根直读（shuotong.wang 各静态 location 共用，
# 2026-10-11 WS4 起桶代理，2026-11-02 本地文件系统迁移 noda-infra#8 P3：
# path-style S3 GET /noda-static/sites/shuotong/<key> 切 root /var/noda-static
# 直读，URL→文件映射语义不变；原 S3 版历史可 git revert）
# ⚠️ 命名约束：主 nginx.conf 在 http 上下文通配 include snippets/proxy-*.conf，
# 本片段含 rewrite（仅 server/location/if 合法）——切勿改回 proxy-* 前缀命名。
# 用法：location 内 include 本片段（调用方 server 级的 upstream-seaweedfs.conf
# include 已无本片段消费方，P4 清理时摘）。
# Cache-Control 由本片段注入（$shuotong_cache_control，见 conf.d/shuotong.map.conf）。
#
# 路径映射（SvelteKit adapter-static 平铺布局：页面 → <page>.html（build/games.html、
# build/news.html…），根 → index.html，无目录 index；与 nearby 的平铺 .html 同构，
# 与 www 的 trailingSlash:true 目录布局不同）：
#   1. / → /index.html
#   2. 尾斜杠规整：/games/ → /games（无目录 index）
#   3. 无扩展名 URI → <uri>.html：/games → games.html、/news/<slug> → news/<slug>.html；
#      带扩展名（/_app/immutable/*.js、/images/*.png、/robots.txt、/sitemap.xml）原样
#   4. 前缀 sites/shuotong → 本地文件 /var/noda-static/sites/shuotong/<key>（缺文件 =404）
root /var/noda-static;
rewrite ^/$ /index.html;
rewrite ^/(.+)/$ /$1;
rewrite ^(/(?:.*/)?[^/.]+)$ $1.html;
rewrite ^(.*)$ /sites/shuotong$1 break;
try_files $uri =404;

# 缺对象（404）净 404 语义（站内无 404.html 兜底页——SvelteKit 未预渲染错误页）；
# 原 S3 匿名列表拒绝（403）随桶退役，本地 try_files 一律 404。

# Cache-Control 仍由 nginx 注入（$shuotong_cache_control：
# /_app/immutable/* 一年 immutable、/images/* 一天，HTML no-cache）
add_header Cache-Control $shuotong_cache_control;

# 静态 location 有自己的 add_header → 不继承 server 级安全头，须重新注入
include /etc/nginx/snippets/security-headers.conf;
