# noda 三容器 prod upstream 变量 — 在 server 块中 include
# 使用 resolver 127.0.0.11 动态解析 DNS，容器重建后自动刷新 IP
# 容器布局（2026-10 class 下线后，noda-apps #46 批次 D）：
#   noda-frontend-prod — 3 个 Next.js standalone（auth/admin/comment）
#   noda-api-prod      — Go 多端口 API（:3011 admin / :3012 comment / :3014 noda-api 等；
#                       :3001 仅保留 /api/health 供 compose healthcheck）
#   www 静态站由 noda-static-prod 本地 root 直接伺服
set $auth_app_upstream noda-frontend-prod:3004;
set $admin_upstream noda-frontend-prod:3006;
set $comment_upstream noda-api-prod:3012;
set $admin_api_upstream noda-api-prod:3011;
set $noda_api_upstream noda-api-prod:3014;
set $auth_api_upstream noda-api-prod:3004;
