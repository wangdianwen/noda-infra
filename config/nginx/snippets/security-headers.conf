# 通用安全响应头（所有 server block 共享）
# CSP 和 frame-ancestors 需各站点单独配置，不包含在此文件中
#
# 使用方法：在各 server block 中 include 此文件
#   include /etc/nginx/snippets/security-headers.conf;

# HSTS — 强制 HTTPS（Cloudflare 边缘也终止 TLS，此处作为双重保障）
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# 防止 MIME 类型嗅探
add_header X-Content-Type-Options "nosniff" always;

# 点击劫持防护（基础策略，各站点可通过 CSP frame-ancestors 进一步收紧）
add_header X-Frame-Options "SAMEORIGIN" always;

# XSS 过滤（虽然现代浏览器已内置，保留兼容旧浏览器）
add_header X-XSS-Protection "1; mode=block" always;

# Referrer 策略 — 仅发送 origin 给跨域请求
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# 权限策略 — 禁用不需要的浏览器功能
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
