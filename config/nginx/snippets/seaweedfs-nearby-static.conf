# nearby 静态壳 → SeaweedFS 桶代理（nearby.noda.co.nz 各静态 location 共用）
# ⚠️ 命名约束：主 nginx.conf 在 http 上下文通配 include snippets/proxy-*.conf，
# 本片段含 rewrite（仅 server/location/if 合法）——切勿改回 proxy-* 前缀命名。
# 用法：location 内 include 本片段；调用方（server 级）负责：
#   include /etc/nginx/snippets/upstream-seaweedfs.conf;   # $seaweedfs_upstream 变量
#   resolver 127.0.0.11 valid=10s ipv6=off;                # 变量 upstream 需动态 DNS
# 并在 location 内声明 error_page 403/404 兜底（item/[id] 回壳页、其余回 /404.html）。
#
# 路径映射（Next.js output:'export' 平铺布局，out/en.html、out/zh/item/app-shell.html；
# S3 静态化后 / 与无前缀 en 页面已由块内 rewrite 到 /en 前缀，此片段只管带前缀路径）：
#   1. 尾斜杠规整：/zh/ → /zh（out/ 无目录 index）
#   2. 无扩展名 URI → <uri>.html：/en → en.html、/zh/item/x → zh/item/x.html；
#      带扩展名（/_next/*.js、/robots.txt、/favicon.svg、图片）原样
#   3. 前缀 sites/nearby → path-style S3 GET：/noda-static/sites/nearby/<key>
# 匿名只读（mc anonymous set download），无鉴权头。
# Host 覆盖：SeaweedFS 会把带域名的 Host 误判为 virtual-host 桶名 → 400（同 cdn.conf）。
rewrite ^/(.+)/$ /$1;
rewrite ^(/(?:.*/)?[^/.]+)$ $1.html;
rewrite ^(.*)$ /noda-static/sites/nearby$1 break;

proxy_pass http://$seaweedfs_upstream;
proxy_http_version 1.1;
proxy_set_header Host "seaweedfs:8333";
proxy_set_header Connection "";

# 桶内缺对象（404）与匿名列表拒绝（403）统一交 error_page 兜底
proxy_intercept_errors on;
proxy_connect_timeout 5s;
proxy_read_timeout 30s;

# 桶内缺 .txt（RSC 载荷）时必须净 404——Next 软导航 fetch 到壳 HTML 会解析失败，
# 净 404 触发硬导航兜底（location ~ \.txt$ 无 error_page 即净 404，同 class/liuyao）

# SeaweedFS 不回显对象 Cache-Control——nginx 注入（$nearby_cache_control：
# /_next/* 一年 immutable，HTML no-cache）；CF 边缘与浏览器共用该指令。
# export 后 headers() 不可用，原 next.config 的 /images/* 长缓存也由该 map 承担
add_header Cache-Control $nearby_cache_control always;

# 静态 location 有自己的 add_header → 不继承 server 级安全头，须重新注入
include /etc/nginx/snippets/security-headers.conf;
