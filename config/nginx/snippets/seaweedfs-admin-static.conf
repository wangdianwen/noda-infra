# Admin CSR 静态壳 → SeaweedFS 桶代理（admin.noda.co.nz 各静态 location 共用；S2）
# ⚠️ 命名约束：主 nginx.conf 第 38 行在 http 上下文通配 include snippets/proxy-*.conf，
# 本片段含 rewrite（仅 server/location/if 合法）——切勿改回 proxy-* 前缀命名。
# 用法：location 内 include 本片段；调用方（server 级）负责：
#   include /etc/nginx/snippets/upstream-seaweedfs.conf;   # $seaweedfs_upstream 变量
#   resolver 127.0.0.11 valid=10s ipv6=off;                # 变量 upstream 需动态 DNS
# 并在 location 内声明 error_page 兜底（cronjobs 深链回 app-shell、其余回 /404.html）。
# 鉴权：与原 SSR 行为一致——页面无服务端门槛（客户端 AuthGuard），数据由
# /api/admin/* 的 Go API 会话校验把关。
#
# 路径映射（Next.js output:'export' 平铺布局，out/dashboard.html、
# out/cronjobs/app-shell.html；动态路由 generateStaticParams 产壳页）：
#   0. / → /index.html（根页 = 客户端跳转 /dashboard 的壳；否则直取目录键 501）
#   1. 尾斜杠规整：/dashboard/ → /dashboard
#   2. 无扩展名 URI → <uri>.html：/login → login.html、/users → users.html；
#      带扩展名（/_next/*.js、RSC *.txt、/favicon.ico）原样
#   3. 前缀 sites/admin → path-style S3 GET：/noda-static/sites/admin/<key>
rewrite ^/$ /index.html;
rewrite ^/(.+)/$ /$1;
rewrite ^(/(?:.*/)?[^/.]+)$ $1.html;
rewrite ^(.*)$ /noda-static/sites/admin$1 break;

proxy_pass http://$seaweedfs_upstream;
proxy_http_version 1.1;
proxy_set_header Host "seaweedfs:8333";
proxy_set_header Connection "";

# 桶内缺对象（404，含未预渲染路由的 RSC *.txt）与匿名拒绝（403）统一交 error_page
proxy_intercept_errors on;
proxy_connect_timeout 5s;
proxy_read_timeout 30s;

# SeaweedFS 不回显对象 Cache-Control——调用方按 location 注入（/_next/ immutable、
# HTML no-cache）；本片段负责静态 location 的安全头（location 有自己的 add_header
# 时不继承 server 级）
include /etc/nginx/snippets/security-headers.conf;
