# noda-apps prod upstream 变量 — 在 server 块中 include
# 使用 resolver 127.0.0.11 动态解析 DNS，容器重建后自动刷新 IP
# 容器名: noda-apps-prod（单容器，直接替换部署）
set $class_upstream noda-apps-prod:3000;
set $liuyao_upstream noda-apps-prod:3005;
set $www_upstream noda-apps-prod:3002;
set $auth_app_upstream noda-apps-prod:3004;
set $admin_upstream noda-apps-prod:3006;
set $admin_api_upstream noda-apps-prod:3011;
