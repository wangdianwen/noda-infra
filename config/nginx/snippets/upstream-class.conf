# noda 三容器 prod upstream 变量 — 在 server 块中 include
# 使用 resolver 127.0.0.11 动态解析 DNS，容器重建后自动刷新 IP
# 三容器拆分（2026-09）：
#   noda-frontend-prod — 5 个 Next.js standalone（class/auth/liuyao/admin/comment）
#   noda-api-prod      — Go 四端口 API（class-api/liuyao-api/admin-api/email-service）
#   www 静态站由 noda-static-prod 本地 root 直接伺服（原 $www_upstream 已删除）
# 旧单容器名 noda-apps-prod 仍作为 noda-frontend-prod 的网络别名保留（过渡期兼容）
set $class_upstream noda-frontend-prod:3000;
set $liuyao_upstream noda-frontend-prod:3005;
set $auth_app_upstream noda-frontend-prod:3004;
set $admin_upstream noda-frontend-prod:3006;
set $comment_upstream noda-api-prod:3012;
set $nearby_upstream noda-frontend-prod:3013;
set $class_api_upstream noda-api-prod:3001;
set $liuyao_api_upstream noda-api-prod:3007;
set $admin_api_upstream noda-api-prod:3011;
set $nearby_api_upstream noda-api-prod:3014;
set $auth_api_upstream noda-api-prod:3004;
