# snagme 静态壳 → SeaweedFS 桶代理（snagme.noda.co.nz 各静态 location 共用）
# ⚠️ 命名约束：主 nginx.conf 在 http 上下文通配 include snippets/proxy-*.conf，
# 本片段含 rewrite（仅 server/location/if 合法）——切勿改回 proxy-* 前缀命名。
# 用法：location 内 include 本片段；调用方（server 级）负责：
#   include /etc/nginx/snippets/upstream-seaweedfs.conf;   # $seaweedfs_upstream 变量
#   resolver 127.0.0.11 valid=10s ipv6=off;                # 变量 upstream 需动态 DNS
# 并在 location 内声明 error_page 兜底（deals/report 深链回 app-shell、其余回 /404.html）。
#
# 路径映射（Next.js output:'export'，2026-09-14 产品站化：三语实体目录 out/en|zh|zh-TW/，
# en 默认落根由 server 块 rewrite 到 /en 前缀后进本片段）：
#   1. 尾斜杠规整：/zh/deals/ → /zh/deals
#   2. 无扩展名 URI → <uri>.html：/zh → zh.html、/zh/deals → zh/deals.html；
#      带扩展名（/_next/*.js、/robots.txt、/sitemap.xml、/og-image.png）原样
#   2b. 末段为「点+1~2 位数字」的多段页面 URI 也补 .html：车型族 slug 有
#      id.3/id.4/id.5/4.2 形态（listings bake 实数据）——无此条会被上面的
#      「无扩展名」判定跳过而 404（2026-10-06 线上实证，sitemap 15 条 URL 中招）。
#      单段根文件（robots.txt 等）因要求至少一层目录不会误伤；.js/.css 等真
#      扩展名非数字尾亦不匹配。
#   3. 前缀 sites/snagme → path-style S3 GET：/noda-static/sites/snagme/<key>
# 匿名只读（mc anonymous set download），无鉴权头。
# Host 覆盖：SeaweedFS 会把带域名的 Host 误判为 virtual-host 桶名 → 400（同 liuyao）。
rewrite ^/(.+)/$ /$1;
rewrite ^(/(?:.*/)?[^/.]+)$ $1.html;
rewrite ^(/(?:.*/)+[^/.]*\.\d{1,2})$ $1.html;
rewrite ^(/(?:.*/)+[^/.]*\.)$ $1.html;
rewrite ^(.*)$ /noda-static/sites/snagme$1 break;

proxy_pass http://$seaweedfs_upstream;
proxy_http_version 1.1;
proxy_set_header Host "seaweedfs:8333";
proxy_set_header Connection "";

# 桶内缺对象（404）与匿名列表拒绝（403）统一交 error_page 兜底
proxy_intercept_errors on;
proxy_connect_timeout 5s;
proxy_read_timeout 30s;

# SeaweedFS 不回显对象 Cache-Control——nginx 注入（$snagme_cache_control：
# /_next/* 一年 immutable，HTML no-cache）；CF 边缘与浏览器共用该指令
add_header Cache-Control $snagme_cache_control;

# 静态 location 有自己的 add_header → 不继承 server 级安全头，须重新注入
include /etc/nginx/snippets/security-headers.conf;
