# [preprod 专用] nearby 静态壳 → 本地文件系统根直读（nearby-prepred 块共用）。
# 与 seaweedfs-nearby-static.conf 的差异（2026-11-02 本地文件系统迁移
# noda-infra#8 P3 后）：映射规则相同（root /var/noda-static + /sites/nearby），
# 区别仅在挂载源与 noindex——preprod 由 compose 挂 docker/volumes/static-stg
# 到 /var/noda-static（stg 数据与 prod 物理隔离；prod/r4s 挂
# /mnt/mmc1-4/Noda/Static），另注入 X-Robots-Tag noindex。原 stg 桶前缀
# /noda-static-stg/sites/nearby 随 S3 代理退役，两文件仍不可互指。
# ⚠️ 命名约束：主 nginx.conf 在 http 上下文通配 include snippets/proxy-*.conf，
# 本片段含 rewrite（仅 server/location/if 合法）——切勿改回 proxy-* 前缀命名。
# 用法：location 内 include 本片段；调用方在 location 内声明 error_page 403/404
# 兜底（item/[id] 回壳页、其余回 /404.html）。调用方 server 级的
# upstream-seaweedfs.conf include 已无本片段消费方（P4 清理时摘）。
#
# 路径映射（Next.js output:'export' 平铺布局，out/en.html、out/zh/item/app-shell.html；
# 静态化后 / 与无前缀 en 页面已由块内 rewrite 到 /en 前缀，此片段只管带前缀路径）：
#   1. 尾斜杠规整：/zh/ → /zh（out/ 无目录 index）
#   2. 无扩展名 URI → <uri>.html：/en → en.html、/zh/item/x → zh/item/x.html；
#      带扩展名（/_next/*.js、/robots.txt、/favicon.svg、图片）原样
#   3. 前缀 sites/nearby → 本地文件 /var/noda-static/sites/nearby/<key>（缺文件 =404）
root /var/noda-static;
rewrite ^/(.+)/$ /$1;
rewrite ^(/(?:.*/)?[^/.]+)$ $1.html;
rewrite ^(.*)$ /sites/nearby$1 break;
try_files $uri =404;

# 缺对象（404）统一交 error_page 兜底；原 S3 匿名列表拒绝（403）随桶退役，
# 本地 try_files 对目录/缺文件一律 404（error_page 403 声明保留，语义兼容）。

# 缺 .txt（RSC 载荷）时必须净 404——Next 软导航 fetch 到壳 HTML 会解析失败，
# 净 404 触发硬导航兜底（location ~ \.txt$ 无 error_page 即净 404，同 class/liuyao）

# Cache-Control 仍由 nginx 注入（$nearby_cache_control：/_next/* 一年 immutable，
# HTML no-cache）；CF 边缘与浏览器共用该指令。
# ⚠️ 刻意不带 always：4xx（部署窗口期 chunk 未就绪的 404 等）不得带一年
# immutable，否则浏览器负缓存毒化该 chunk 一年、刷新无效（2026-09-22 实证）。
add_header Cache-Control $nearby_cache_control;

# 静态 location 有自己的 add_header → 不继承 server 级安全头，须重新注入
include /etc/nginx/snippets/security-headers.conf;

# preprod 全站不收录（prod 版 snippet 无此头；server 级会被本片段 add_header 阻断继承）
add_header X-Robots-Tag "noindex" always;
