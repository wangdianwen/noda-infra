# noda-site (www) upstream 变量
# 容器名: noda-apps-prod（单容器，直接替换部署）
set $www_upstream noda-static-prod:8181;
# Nearby 快捷入口卡（2026-09 M2）：www 同域直连 API
set $nearby_api_upstream noda-api-prod:3014;
set $class_api_www_upstream noda-api-prod:3001;
# SnagMe 捡漏展示卡（2026-09-14）：www 同域直连 Go snagmeapi。
# ⚠️ nginx `set` 变量按 server 块作用：本块只 include 本 snippet（不含
# upstream-class.conf），漏定义会在 nginx -t 通过的情况下运行时 500
# （build #58 实证）。新增 www 域 API 代理变量必须加在这里。
set $snagme_api_upstream noda-api-prod:3015;
