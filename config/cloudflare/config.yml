# Cloudflare Tunnel 配置 - Noda 生产环境
# Tunnel ID: 9cab5df3-a546-48fb-9dc5-eacb48c56ff8

tunnel: 9cab5df3-a546-48fb-9dc5-eacb48c56ff8

# 配置文件版本
version: 2

# 日志配置
loglevel: info

# 入站规则配置
ingress:
  # 主域名 - 指向 Nginx (反向代理)
  - hostname: noda.co.nz
    service: http://noda-nginx:81
  # 认证服务 - Keycloak（通过 nginx 反向代理）
  - hostname: auth.noda.co.nz
    service: http://noda-nginx:81
  # 本地开发
  - hostname: localhost.noda.co.nz
    service: http://noda-nginx:81
  # 健康检查端点
  - hostname: health.noda.co.nz
    service: http://noda-nginx:81
  # FindClass 应用
  - hostname: class.noda.co.nz
    service: http://noda-nginx:81
  # Admin Dashboard（内网访问）
  - hostname: admin.noda.co.nz
    service: http://noda-nginx:81
  # Remark42 评论服务
  - hostname: comments.noda.co.nz
    service: http://noda-nginx:81

  # 默认规则 - 必须是最后一条
  - service: http_status:404
