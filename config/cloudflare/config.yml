# Cloudflare Tunnel 配置 - Noda 生产环境
# （线上为 TUNNEL_TOKEN 托管；class/findclass 路由+DNS 已于 2026-10-26 控制台删除，noda-apps #46 阶段 F）
# Tunnel ID: 9cab5df3-a546-48fb-9dc5-eacb48c56ff8

tunnel: 9cab5df3-a546-48fb-9dc5-eacb48c56ff8

# 配置文件版本
version: 2

# 日志配置
loglevel: info

# 入站规则配置
ingress:
  # 主域名 - 指向 Nginx (反向代理)
  - hostname: noda.co.nz
    service: http://noda-nginx:81
  # 认证服务 - Keycloak（通过 nginx 反向代理）
  - hostname: auth.noda.co.nz
    service: http://noda-nginx:81
  # 本地开发
  - hostname: localhost.noda.co.nz
    service: http://noda-nginx:81
  # 健康检查端点
  - hostname: health.noda.co.nz
    service: http://noda-nginx:81
  # Admin Dashboard（内网访问）
  - hostname: admin.noda.co.nz
    service: http://noda-nginx:81
  # Remark42 评论服务
  - hostname: comments.noda.co.nz
    service: http://noda-nginx:81
  - hostname: snagme.noda.co.nz
    service: http://noda-nginx:81
  # GraphQL BFF 统一接口（spec 2026-09-16 graphql-bff-grpc-design）
  # 注意：线上 tunnel 为 TUNNEL_TOKEN 托管（ingress 实际生效于 Cloudflare 控制台，
  # 已配 api.noda.co.nz → noda-nginx:81）；本文件为仓库同构留档。
  - hostname: api.noda.co.nz
    service: http://noda-nginx:81

  # 默认规则 - 必须是最后一条
  - service: http_status:404
